name: RLF KB W003B exact source gallery v2

on:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - tools/rlf_kb_w003b_exact_source_gallery_v2.py
      - .github/workflows/rlf-kb-w003b-exact-source-gallery-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/fred-perry-product-map-20260826
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 curl_cffi pillow
      - name: Collect optimized exact-source galleries
        run: python tools/rlf_kb_w003b_exact_source_gallery_v2.py
      - name: Package auditable output
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root=Path('w003b-exact-source-gallery-v2')
          lines=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          with zipfile.ZipFile('RLF_KB_W003B_EXACT_SOURCE_GALLERY_V2.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(root.parent))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLF_KB_W003B_EXACT_SOURCE_GALLERY_V2
          path: RLF_KB_W003B_EXACT_SOURCE_GALLERY_V2.zip
          retention-days: 7
          if-no-files-found: error
