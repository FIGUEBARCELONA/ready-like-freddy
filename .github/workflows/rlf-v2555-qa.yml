name: RLF v25.55 QA

on:
  pull_request:
    branches: [rlf-v2555-ci-base]
    paths:
      - 'apps/rlf-parallel50-v25-52/**'
      - '.github/workflows/rlf-v2555-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rlf-v2555-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/rlf-parallel50-v25-52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact dependency graph
        run: npm install --ignore-scripts --no-fund
      - name: Verify runtime engine
        run: node --version && npm --version
      - name: TypeScript strict gate
        run: npx tsc --noEmit
      - name: Next production build and Workflow manifest gate
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee workflow-build.log
          grep -F '6 steps, 2 workflows' workflow-build.log
      - name: Dependency audit gate
        run: npm audit --audit-level=moderate --json > dependency-audit-v2555.json
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v2555-qa-evidence
          path: |
            apps/rlf-parallel50-v25-52/dependency-audit-v2555.json
            apps/rlf-parallel50-v25-52/package-lock.json
            apps/rlf-parallel50-v25-52/workflow-build.log
          retention-days: 7
