name: RLF v25.55 QA

on:
  push:
    branches: [rlf-parallel50-v25-55]
    paths:
      - 'apps/rlf-parallel50-v25-52/**'
      - '.github/workflows/rlf-v2555-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/rlf-parallel50-v25-52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/rlf-parallel50-v25-52/package-lock.json
      - name: Install exact dependency graph
        run: npm install --ignore-scripts --no-fund
      - name: TypeScript strict gate
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
      - name: Dependency audit evidence
        run: npm audit --json > dependency-audit-v2555.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v2555-qa-evidence
          path: apps/rlf-parallel50-v25-52/dependency-audit-v2555.json
          retention-days: 7
