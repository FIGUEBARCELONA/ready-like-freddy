name: RLF v25.55 QA

on:
  push:
    branches: [rlf-parallel50-v25-55]
    paths:
      - 'apps/rlf-parallel50-v25-52/**'
      - '.github/workflows/rlf-v2555-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/rlf-parallel50-v25-52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependency graph
        run: npm install --ignore-scripts --no-fund
      - name: TypeScript strict gate
        run: npx tsc --noEmit
      - name: Next production build
        run: npm run build
      - name: Dependency audit evidence
        run: npm audit --json > dependency-audit-v2555.json || true
      - name: Package deployable source
        run: zip -qr rlf-v2555-source.zip app lib workflows package.json next.config.ts tsconfig.json vercel.json RLF_V25_55_DEDUP_GATE.md
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v2555-qa-evidence
          path: |
            apps/rlf-parallel50-v25-52/dependency-audit-v2555.json
            apps/rlf-parallel50-v25-52/rlf-v2555-source.zip
          retention-days: 7
