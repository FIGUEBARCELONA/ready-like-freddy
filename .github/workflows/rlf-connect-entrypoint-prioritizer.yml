name: RLF connect entry-point prioritizer

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-connect-entrypoint-prioritizer.yml'

permissions:
  contents: write

concurrency:
  group: rlf-connect-entrypoint-prioritizer
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Integrate priority entry points into queue preparation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/execution/prepare-official-queue.mjs')
          text = path.read_text()
          marker = 'RLF_PRIORITY_ENTRYPOINTS_INTEGRATED'
          needle = 'console.log(JSON.stringify(await readJson(`${outDir}/summary.json`), null, 2));\n'
          replacement = "\n".join([
              '// RLF_PRIORITY_ENTRYPOINTS_INTEGRATED',
              'const { spawnSync } = await import("node:child_process");',
              'const priorityResult = spawnSync(process.execPath, [',
              '  new URL("./prioritize-official-entrypoints.mjs", import.meta.url).pathname,',
              '  `--queue=${outDir}/queue.json`,',
              '  `--seeds=${seedsPath}`,',
              '  `--summary=${outDir}/summary.json`,',
              '  `--urls=${outDir}/urls.txt`,',
              '], { stdio: "inherit" });',
              'if (priorityResult.status !== 0) {',
              '  throw new Error(`Priority entry-point integration failed with status ${priorityResult.status}`);',
              '}',
              'console.log(JSON.stringify(await readJson(`${outDir}/summary.json`), null, 2));',
              '',
          ])
          marker_count = text.count(marker)
          needle_count = text.count(needle)
          if marker_count == 1:
              print('Priority entry-point integration already present')
          elif marker_count == 0 and needle_count == 1:
              path.write_text(text.replace(needle, replacement, 1))
          else:
              raise SystemExit(
                  f'Unsafe prepare script state: marker_count={marker_count}, needle_count={needle_count}'
              )
          PY
          test "$(grep -c 'RLF_PRIORITY_ENTRYPOINTS_INTEGRATED' scripts/execution/prepare-official-queue.mjs)" = 1
          node --check scripts/execution/prepare-official-queue.mjs
          node --check scripts/execution/prioritize-official-entrypoints.mjs
          tail -n 20 scripts/execution/prepare-official-queue.mjs
      - name: Commit integration when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/execution/prepare-official-queue.mjs; then
            echo 'No script change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/execution/prepare-official-queue.mjs
          git commit -m 'Integrate verified priority entry points into queue preparation'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
