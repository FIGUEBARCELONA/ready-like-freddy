name: RLF connect entry-point prioritizer

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-connect-entrypoint-prioritizer.yml'

permissions:
  contents: write

concurrency:
  group: rlf-connect-entrypoint-prioritizer
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Patch prepare stage exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/rlf-50-worker-kb.yml')
          text = path.read_text()
          needle = '          node scripts/execution/prepare-official-queue.mjs --out=execution/queue\n'
          replacement = '''          node scripts/execution/prepare-official-queue.mjs --out=execution/queue
          node scripts/execution/prioritize-official-entrypoints.mjs \\
            --queue=execution/queue/queue.json \\
            --seeds=data/execution/rlf-kb-official-seeds.json \\
            --summary=execution/queue/summary.json \\
            --urls=execution/queue/urls.txt
          '''
          existing = text.count('prioritize-official-entrypoints.mjs')
          prepare_count = text.count(needle)
          if existing == 1:
              print('Prioritizer already connected; no patch required')
          elif existing == 0 and prepare_count == 1:
              path.write_text(text.replace(needle, replacement, 1))
          else:
              raise SystemExit(
                  f'Unsafe workflow state: prepare_count={prepare_count}, prioritizer_count={existing}'
              )
          PY
          test "$(grep -c 'prioritize-official-entrypoints.mjs' .github/workflows/rlf-50-worker-kb.yml)" = 1
          grep -A7 -B2 'prioritize-official-entrypoints.mjs' .github/workflows/rlf-50-worker-kb.yml
      - name: Validate scripts and workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/execution/prioritize-official-entrypoints.mjs
          node --check scripts/execution/prepare-official-queue.mjs
          grep -q "data/execution/rlf-kb-official-seeds.json" .github/workflows/rlf-50-worker-kb.yml
          grep -q "data/execution/rlf-kb-run-plan.json" .github/workflows/rlf-50-worker-kb.yml
      - name: Commit exact workflow connection when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/rlf-50-worker-kb.yml; then
            echo 'No workflow change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rlf-50-worker-kb.yml
          git commit -m 'Connect verified archive entry points to 50-lane prepare stage'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
