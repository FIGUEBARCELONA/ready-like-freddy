          candidates=json.loads(r'''[{"name":"2nd Fit Kiloshop","key":"2ndfitkiloshop","osm_type":"node","osm_id":2619992606,"lat":53.5601656,"lon":9.9632939,"street":"Schulterblatt","housenumber":"25","postcode":"20357","website":null,"lane":"M920"},{"name":"2nd Second Hand","key":"2ndsecondhand","osm_type":"node","osm_id":12104527498,"lat":53.5828715,"lon":10.0105557,"street":"Mühlenkamp","housenumber":"44","postcode":"22303","website":null,"lane":"M921"},{"name":"Ankauf-Verkauf","key":"ankaufverkauf","osm_type":"node","osm_id":11403863681,"lat":53.46186,"lon":9.9839546,"street":null,"housenumber":null,"postcode":null,"website":null,"lane":"M922"},{"name":"Bilderträume","key":"bildertraume","osm_type":"node","osm_id":3809164051,"lat":53.5731981,"lon":9.9498187,"street":null,"housenumber":null,"postcode":null,"website":null,"lane":"M923"},{"name":"Die Schleuse","key":"dieschleuse","osm_type":"node","osm_id":1053609654,"lat":53.5688106,"lon":9.9499399,"street":"Eimsbütteler Straße","housenumber":"129","postcode":"22769","website":"https://www.dieschleuse.com","lane":"M924"},{"name":"DRK Kilo-Shop Altona","key":"drkkiloshopaltona","osm_type":"node","osm_id":10944463404,"lat":53.5514154,"lon":9.9371262,"street":"Neue Große Bergstraße","housenumber":"4-6","postcode":"22767","website":"https://www.drk-hamburg.de/angebote/alltagshilfen/kilo-shop.html","lane":"M925"},{"name":"Däumling No 3","key":"daumlingno3","osm_type":"node","osm_id":7837581869,"lat":53.5608699,"lon":9.8200963,"street":"Elbchaussee","housenumber":"537","postcode":"22587","website":null,"lane":"M926"},{"name":"Fifty fifty second hand","key":"fiftyfiftysecondhand","osm_type":"node","osm_id":7836458795,"lat":53.5592886,"lon":9.811526,"street":"Blankeneser Bahnhofstraße","housenumber":"7","postcode":"22587","website":"https://fiftyfiftysecondhand.com/","lane":"M927"},{"name":"First Class Designer Second Hand","key":"firstclassdesignersecondhand","osm_type":"node","osm_id":7845757444,"lat":53.559449,"lon":9