name: RLF Hamburg G13 resolution Parallel50 M920-M969

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-hamburg-g13-resolution-p50-m920-m969.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel50:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Build immutable one-identity-per-worker manifest
