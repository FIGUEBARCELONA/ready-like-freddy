name: RLF validation proof

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-validation-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rlf-validation-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Execute complete terminal sequence 15 validation
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm install --frozen-lockfile
            find scripts/execution -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
            node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          import { loadSourcePageLedger } from './scripts/execution/source-page-ledger.mjs';

          const runId = '32783967794';
          const jsonPaths = [
            'data/execution/rlf-kb-official-seeds.json',
            'data/execution/rlf-kb-run-plan.json',
            'data/execution/product-progress.json',
            'data/execution/sequence15-ledger-snapshot.json',
            'data/execution/workflow-runs-snapshot.json',
          ];
          for (const directory of ['data/execution/progress-deltas','data/execution/source-page-deltas','data/execution/source-page-delta-audits']) {
            const names = (await readdir(directory)).filter(name => name.endsWith('.json')).sort((a,b) => a.localeCompare(b,'en',{numeric:true}));
            jsonPaths.push(...names.map(name => `${directory}/${name}`));
          }
          for (const path of jsonPaths) JSON.parse(await readFile(path, 'utf8'));

          const identity = await loadProgressLedger();
          const sourcePages = await loadSourcePageLedger();
          const snapshot = JSON.parse(await readFile('data/execution/sequence15-ledger-snapshot.json','utf8'));
          const dashboard = JSON.parse(await readFile('data/execution/workflow-runs-snapshot.json','utf8'));
          const delta = JSON.parse(await readFile(`data/execution/progress-deltas/${runId}.json`,'utf8'));
          const sourceDelta = JSON.parse(await readFile(`data/execution/source-page-deltas/${runId}.json`,'utf8'));
          const sourceAudit = JSON.parse(await readFile(`data/execution/source-page-delta-audits/${runId}.json`,'utf8'));
          const manifest = JSON.parse(await readFile(`data/execution/runs/${runId}/product-manifest.json`,'utf8'));
          const ledgerAudit = JSON.parse(await readFile(`data/execution/runs/${runId}/ledger-delta-audit.json`,'utf8'));

          const expectedRetries = ['G3636|Z77','HW2300|843','M1588|81B','M1588|84B','M4613|41A','SY3660|46A'];
          const actual = {
            identity: {
              completedIdentityCount: identity.completed.identityCount,
              productUrlCaptureCount: identity.completed.productUrlCaptureCount,
              officialProductImageReferenceCount: identity.counters.officialProductImageReferenceCount,
              materialEvidenceCount: identity.counters.materialEvidenceCount,
              manufacturingClaimCount: identity.counters.manufacturingClaimCount,
              descriptionMissingIdentityCount: identity.metadataGaps.descriptionMissingIdentityCount,
              priceMissingIdentityCount: identity.metadataGaps.priceMissingIdentityCount,
              materialMissingIdentityCount: identity.metadataGaps.materialMissingIdentityCount,
              retryIdentityKeys: identity.retry.identities.map(item => item.identityKey).sort(),
              deltaCount: identity.deltaCount,
              latestRunId: String(identity.latestRunId),
              factoryVerifiedCount: identity.counters.factoryVerifiedCount,
              globalCanonicalProductCount: identity.counters.globalCanonicalProductCount,
              ledgerSha256: identity.ledgerSha256,
            },
            sourcePages: {
              deltaCount: sourcePages.deltaCount,
              attemptedObservationCount: sourcePages.attemptedObservationCount,
              uniqueAttemptedSourcePageCount: sourcePages.uniqueAttemptedSourcePageCount,
              ledgerSha256: sourcePages.ledgerSha256,
            },
          };
          const expected = {
            identity: {
              completedIdentityCount: 1354,
              productUrlCaptureCount: 2152,
              officialProductImageReferenceCount: 11682,
              materialEvidenceCount: 1745,
              manufacturingClaimCount: 64,
              descriptionMissingIdentityCount: 823,
              priceMissingIdentityCount: 767,
              materialMissingIdentityCount: 86,
              retryIdentityKeys: expectedRetries,
              deltaCount: 10,
              latestRunId: runId,
              factoryVerifiedCount: 0,
              globalCanonicalProductCount: 0,
              ledgerSha256: '843bb27ffc396622b7f962f53f8509e564d96e33c957076dc9027a5d831ebb3b',
            },
            sourcePages: {
              deltaCount: 8,
              attemptedObservationCount: 1524,
              uniqueAttemptedSourcePageCount: 1239,
              ledgerSha256: '19545d43003400957b788bb5ecd25019413dfe2c225c86c5c28e827ccfc386e3',
            },
          };
          const mismatches = [];
          for (const section of ['identity','sourcePages']) {
            for (const [key,value] of Object.entries(expected[section])) {
              if (JSON.stringify(actual[section][key]) !== JSON.stringify(value)) mismatches.push([`${section}.${key}`,actual[section][key],value]);
            }
          }
          if (delta.acceptance !== 'FULL_STRICT_EVIDENCE_0_COMPLETE') mismatches.push(['sequence15.acceptance',delta.acceptance,'FULL_STRICT_EVIDENCE_0_COMPLETE']);
          if (delta.completedIdentityKeys.length !== 0 || delta.failedIdentities.length !== 0 || delta.capturedProductUrlCount !== 0) mismatches.push(['sequence15.zeroIdentityDelta',[delta.completedIdentityKeys,delta.failedIdentities,delta.capturedProductUrlCount],[[],[],0]]);
          if (delta.ledgerDeltaSha256 !== 'a32897eaf941304d885cf712bdf09596b83d640c8991a8ae91b6ee37114b7efe') mismatches.push(['sequence15.identityDeltaSha256',delta.ledgerDeltaSha256,'a32897eaf941304d885cf712bdf09596b83d640c8991a8ae91b6ee37114b7efe']);
          if (sourceDelta.attemptedSourcePageCount !== 76 || sourceDelta.uniqueSourcePageCount !== 76 || sourceDelta.successfulSourcePageCount !== 76) mismatches.push(['sequence15.sourcePageCounts',[sourceDelta.attemptedSourcePageCount,sourceDelta.uniqueSourcePageCount,sourceDelta.successfulSourcePageCount],[76,76,76]]);
          if (sourceDelta.sourcePageDeltaSha256 !== '5d775c5e67af9f03f1788de3fb4fc60e91acdbb3677481df9417db438cb46a0d') mismatches.push(['sequence15.sourcePageDeltaSha256',sourceDelta.sourcePageDeltaSha256,'5d775c5e67af9f03f1788de3fb4fc60e91acdbb3677481df9417db438cb46a0d']);
          if (!sourceAudit.passed || sourceAudit.batch.overlapWithPrior.length) mismatches.push(['sequence15.sourceAudit',sourceAudit,'passed with zero overlap']);
          const totals = manifest.totals;
          const expectedTotals = {selectedIdentityCount:0,expectedProductCaptureCount:0,attemptedIdentityCount:0,successfulIdentityCaptureCount:0,failedIdentityCaptureCount:0,soft404IdentityCount:0,missingImageIdentityCount:0,officialProductImageReferenceCount:0,rejectedImageReferenceCount:0,verifiedPriceCount:0,materialEvidenceCount:0,manufacturingClaimCount:0,factoryVerifiedCount:0};
          if (manifest.workerCount !== 50 || !manifest.qualityGatePassed || manifest.orchestrationStatus !== 'FIFTY_OF_FIFTY_PRODUCT_WORKERS_CONSOLIDATED') mismatches.push(['sequence15.productManifestGate',[manifest.workerCount,manifest.qualityGatePassed,manifest.orchestrationStatus],[50,true,'FIFTY_OF_FIFTY_PRODUCT_WORKERS_CONSOLIDATED']]);
          for (const [key,value] of Object.entries(expectedTotals)) if (totals[key] !== value) mismatches.push([`sequence15.productTotals.${key}`,totals[key],value]);
          if (!ledgerAudit.passed || ledgerAudit.batch.overlapWithPrior.length || ledgerAudit.batch.completedAndFailedOverlap.length) mismatches.push(['sequence15.ledgerAudit',ledgerAudit,'passed with zero overlap']);
          const c = dashboard.counts;
          if (!dashboard.passed || dashboard.run.status !== 'completed' || dashboard.run.conclusion !== 'success' || dashboard.run.head_sha !== '607e6838597f64bea50f08b9915a5ae9cf995c2b') mismatches.push(['dashboard.run',dashboard.run,'completed success exact head']);
          for (const [key,value] of Object.entries({discoveryTotal:50,discoverySuccess:50,discoveryFailed:0,discoveryActive:0,productTotal:50,productSuccess:50,productFailed:0,productActive:0,discoveryWorkerArtifacts:50,productWorkerArtifacts:50,consolidatedDiscoveryArtifacts:1,consolidatedProductArtifacts:1,totalArtifacts:104})) if (c[key] !== value) mismatches.push([`dashboard.${key}`,c[key],value]);
          if (!snapshot.passed || snapshot.identity.ledgerSha256 !== expected.identity.ledgerSha256 || snapshot.sourcePages.ledgerSha256 !== expected.sourcePages.ledgerSha256) mismatches.push(['sequence15.snapshot',snapshot,'passed exact snapshot']);
          const completed = new Set(identity.completed.identityKeys);
          const retryOverlap = expectedRetries.filter(key => completed.has(key));
          if (retryOverlap.length) mismatches.push(['retry.completedOverlap',retryOverlap,[]]);
          if (!completed.has('B2328|560')) mismatches.push(['resolvedRetry.B2328|560',false,true]);

          const checkpoint = {
            schemaVersion: 8,
            sourceRunId: runId,
            generatedAt: new Date().toISOString(),
            expected,
            actual,
            sequence15: {
              acceptance: delta.acceptance,
              identityDeltaSha256: delta.ledgerDeltaSha256,
              sourcePageCount: sourceDelta.attemptedSourcePageCount,
              sourcePageDeltaSha256: sourceDelta.sourcePageDeltaSha256,
              productTotals: totals,
              dashboardCounts: c,
            },
            mismatches,
            passed: mismatches.length === 0,
          };
          await writeFile('/tmp/rlf-ledger-checkpoint.json',`${JSON.stringify(checkpoint,null,2)}\n`);
          console.log(JSON.stringify(checkpoint,null,2));
          if (mismatches.length) throw new Error(`Sequence 15 validation mismatch: ${JSON.stringify(mismatches)}`);
          NODE
            pnpm check
            pnpm build
          } 2>&1 | tee /tmp/rlf-validation.log
      - name: Generate validation proof
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const crypto=require('node:crypto');
          const log=fs.existsSync('/tmp/rlf-validation.log')?fs.readFileSync('/tmp/rlf-validation.log'):Buffer.from('missing validation log');
          const checkpoint=fs.existsSync('/tmp/rlf-ledger-checkpoint.json')?JSON.parse(fs.readFileSync('/tmp/rlf-ledger-checkpoint.json','utf8')):null;
          const proof={schemaVersion:8,recordedAt:new Date().toISOString(),sourceCommitSha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT||'1'),validationOutcome:process.env.VALIDATION_OUTCOME,nodeVersion:process.version,logSha256:crypto.createHash('sha256').update(log).digest('hex'),ledgerCheckpoint:checkpoint,requiredChecks:['pnpm_install_frozen_lockfile','execution_script_syntax','canonical_json_ten_identity_deltas_eight_source_page_deltas','exact_sequence15_ledgers','fifty_of_fifty_discovery_workers','fifty_of_fifty_product_workers','sequence15_terminal_frontier_exhausted','sequence15_full_strict_evidence_zero_complete','sequence15_76_unique_source_pages_no_overlap','zero_soft404_missing_or_rejected_images','zero_verified_transformed_prices','factory_verified_zero','global_canonical_products_zero','typescript_no_emit','production_build']};
          fs.writeFileSync('data/execution/validation-proof.json',`${JSON.stringify(proof,null,2)}\n`);
          NODE
      - name: Publish proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/validation-proof.json
          git commit -m "Persist RLF terminal sequence 15 validation proof ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
      - name: Enforce validation success
        if: steps.validate.outcome != 'success'
        run: exit 1
