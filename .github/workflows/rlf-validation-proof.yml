name: RLF validation proof

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-validation-proof.yml'

permissions:
  contents: write

concurrency:
  group: rlf-validation-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
        name: Enable pinned pnpm
      - name: Execute complete validation
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm install --frozen-lockfile
            find scripts/execution -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
            node - <<'NODE'
          const { readFileSync, readdirSync } = require('node:fs');
          const paths = [
            'data/execution/rlf-kb-official-seeds.json',
            'data/execution/rlf-kb-run-plan.json',
            'data/execution/product-progress.json',
            ...readdirSync('data/execution/progress-deltas')
              .filter(name => name.endsWith('.json'))
              .sort((a, b) => a.localeCompare(b, 'en', { numeric: true }))
              .map(name => `data/execution/progress-deltas/${name}`),
            ...readdirSync('data/execution/source-page-deltas')
              .filter(name => name.endsWith('.json'))
              .sort((a, b) => a.localeCompare(b, 'en', { numeric: true }))
              .map(name => `data/execution/source-page-deltas/${name}`),
          ];
          for (const path of paths) JSON.parse(readFileSync(path, 'utf8'));
          console.log(JSON.stringify({ validatedJsonFiles: paths.length, paths }, null, 2));
          NODE
            node --input-type=module - <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          import { loadSourcePageLedger } from './scripts/execution/source-page-ledger.mjs';

          const identityState = await loadProgressLedger();
          const sourcePageState = await loadSourcePageLedger();

          const expectedIdentity = {
            completedIdentityCount: 1241,
            productUrlCaptureCount: 2013,
            officialProductImageReferenceCount: 10787,
            materialEvidenceCount: 1605,
            manufacturingClaimCount: 63,
            descriptionMissingIdentityCount: 710,
            priceMissingIdentityCount: 654,
            materialMissingIdentityCount: 86,
            retryIdentityKeys: [
              'G3636|Z77',
              'HW2300|843',
              'M1588|81B',
              'M1588|84B',
              'SY3660|46A',
            ],
            deltaCount: 6,
            latestRunId: '32758087459',
            factoryVerifiedCount: 0,
            globalCanonicalProductCount: 0,
          };
          const actualIdentity = {
            completedIdentityCount: identityState.completed.identityCount,
            productUrlCaptureCount: identityState.completed.productUrlCaptureCount,
            officialProductImageReferenceCount: identityState.counters.officialProductImageReferenceCount,
            materialEvidenceCount: identityState.counters.materialEvidenceCount,
            manufacturingClaimCount: identityState.counters.manufacturingClaimCount,
            descriptionMissingIdentityCount: identityState.metadataGaps.descriptionMissingIdentityCount,
            priceMissingIdentityCount: identityState.metadataGaps.priceMissingIdentityCount,
            materialMissingIdentityCount: identityState.metadataGaps.materialMissingIdentityCount,
            retryIdentityKeys: identityState.retry.identities.map(item => item.identityKey).sort(),
            deltaCount: identityState.deltaCount,
            latestRunId: String(identityState.latestRunId),
            factoryVerifiedCount: identityState.counters.factoryVerifiedCount,
            globalCanonicalProductCount: identityState.counters.globalCanonicalProductCount,
            ledgerSha256: identityState.ledgerSha256,
          };

          const expectedSourcePages = {
            deltaCount: 4,
            attemptedObservationCount: 782,
            uniqueAttemptedSourcePageCount: 497,
            ledgerSha256: 'f995a567dc82018bcdad0ab53d4fc68b58ef1ba5e573e48191ef94e0519cb347',
          };
          const actualSourcePages = {
            deltaCount: sourcePageState.deltaCount,
            attemptedObservationCount: sourcePageState.attemptedObservationCount,
            uniqueAttemptedSourcePageCount: sourcePageState.uniqueAttemptedSourcePageCount,
            ledgerSha256: sourcePageState.ledgerSha256,
          };

          const mismatches = [];
          for (const key of Object.keys(expectedIdentity).filter(key => key !== 'retryIdentityKeys')) {
            if (actualIdentity[key] !== expectedIdentity[key]) {
              mismatches.push([`identity.${key}`, actualIdentity[key], expectedIdentity[key]]);
            }
          }
          if (JSON.stringify(actualIdentity.retryIdentityKeys) !== JSON.stringify(expectedIdentity.retryIdentityKeys)) {
            mismatches.push([
              'identity.retryIdentityKeys',
              actualIdentity.retryIdentityKeys,
              expectedIdentity.retryIdentityKeys,
            ]);
          }
          for (const key of Object.keys(expectedSourcePages)) {
            if (actualSourcePages[key] !== expectedSourcePages[key]) {
              mismatches.push([`sourcePages.${key}`, actualSourcePages[key], expectedSourcePages[key]]);
            }
          }

          const completed = new Set(identityState.completed.identityKeys);
          const completedRetries = actualIdentity.retryIdentityKeys.filter(key => completed.has(key));
          if (completedRetries.length) {
            mismatches.push(['identity.completedRetries', completedRetries, []]);
          }
          if (!completed.has('B2328|560')) {
            mismatches.push(['identity.resolvedRetry.B2328|560', false, true]);
          }

          const checkpoint = {
            schemaVersion: 3,
            sourceRunId: '32758087459',
            generatedAt: new Date().toISOString(),
            expected: {
              identity: expectedIdentity,
              sourcePages: expectedSourcePages,
            },
            actual: {
              identity: actualIdentity,
              sourcePages: actualSourcePages,
            },
            mismatches,
            passed: mismatches.length === 0,
          };
          await writeFile('/tmp/rlf-ledger-checkpoint.json', `${JSON.stringify(checkpoint, null, 2)}\n`);
          console.log(JSON.stringify(checkpoint, null, 2));
          if (mismatches.length) {
            throw new Error(`Ledger checkpoint mismatch: ${JSON.stringify(mismatches)}`);
          }
          NODE
            pnpm check
            pnpm build
          } 2>&1 | tee /tmp/rlf-validation.log
      - name: Generate validation proof
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p data/execution
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const log = fs.existsSync('/tmp/rlf-validation.log')
            ? fs.readFileSync('/tmp/rlf-validation.log')
            : Buffer.from('validation step did not create a log');
          const checkpoint = fs.existsSync('/tmp/rlf-ledger-checkpoint.json')
            ? JSON.parse(fs.readFileSync('/tmp/rlf-ledger-checkpoint.json', 'utf8'))
            : null;
          const proof = {
            schemaVersion: 4,
            recordedAt: new Date().toISOString(),
            sourceCommitSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || '1'),
            validationOutcome: process.env.VALIDATION_OUTCOME,
            nodeVersion: process.version,
            logSha256: crypto.createHash('sha256').update(log).digest('hex'),
            ledgerCheckpoint: checkpoint,
            requiredChecks: [
              'pnpm_install_frozen_lockfile',
              'execution_script_syntax',
              'canonical_json_six_identity_deltas_four_source_page_deltas',
              'exact_sequence_11_identity_and_source_page_ledgers',
              'resolved_retry_b2328_560',
              'typescript_no_emit',
              'production_build'
            ]
          };
          fs.writeFileSync('data/execution/validation-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
          NODE
      - name: Commit, rebase and publish proof with retry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/validation-proof.json
          git commit -m "Persist RLF validation proof ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo 'Unable to publish validation proof after five rebases' >&2
          exit 1
      - name: Enforce validation success
        if: steps.validate.outcome != 'success'
        run: exit 1
