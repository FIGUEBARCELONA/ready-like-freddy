name: RLF validation proof

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-validation-proof.yml'

permissions:
  contents: write

concurrency:
  group: rlf-validation-proof
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
        name: Enable pinned pnpm
      - name: Execute complete validation
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm install --frozen-lockfile
            find scripts/execution -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node --check
            node - <<'NODE'
          const { readFileSync, readdirSync } = require('node:fs');
          const paths = [
            'data/execution/rlf-kb-official-seeds.json',
            'data/execution/rlf-kb-run-plan.json',
            'data/execution/product-progress.json',
            ...readdirSync('data/execution/progress-deltas')
              .filter(name => name.endsWith('.json'))
              .sort((a, b) => a.localeCompare(b, 'en', { numeric: true }))
              .map(name => `data/execution/progress-deltas/${name}`),
          ];
          for (const path of paths) JSON.parse(readFileSync(path, 'utf8'));
          console.log(JSON.stringify({ validatedJsonFiles: paths.length, paths }, null, 2));
          NODE
            node --input-type=module - <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          const state = await loadProgressLedger();
          const expected = {
            completedIdentityCount: 1054,
            productUrlCaptureCount: 1707,
            officialProductImageReferenceCount: 9271,
            materialEvidenceCount: 1383,
            manufacturingClaimCount: 59,
            descriptionMissingIdentityCount: 523,
            priceMissingIdentityCount: 467,
            materialMissingIdentityCount: 68,
            retryIdentityKeys: ['B2328|560', 'HW2300|843'],
            deltaCount: 5,
            latestRunId: '32754804084',
            factoryVerifiedCount: 0,
            globalCanonicalProductCount: 0,
          };
          const actual = {
            completedIdentityCount: state.completed.identityCount,
            productUrlCaptureCount: state.completed.productUrlCaptureCount,
            officialProductImageReferenceCount: state.counters.officialProductImageReferenceCount,
            materialEvidenceCount: state.counters.materialEvidenceCount,
            manufacturingClaimCount: state.counters.manufacturingClaimCount,
            descriptionMissingIdentityCount: state.metadataGaps.descriptionMissingIdentityCount,
            priceMissingIdentityCount: state.metadataGaps.priceMissingIdentityCount,
            materialMissingIdentityCount: state.metadataGaps.materialMissingIdentityCount,
            retryIdentityKeys: state.retry.identities.map(item => item.identityKey).sort(),
            deltaCount: state.deltaCount,
            latestRunId: String(state.latestRunId),
            factoryVerifiedCount: state.counters.factoryVerifiedCount,
            globalCanonicalProductCount: state.counters.globalCanonicalProductCount,
            ledgerSha256: state.ledgerSha256,
          };
          const fields = Object.keys(expected).filter(key => key !== 'retryIdentityKeys');
          const mismatches = fields
            .filter(key => actual[key] !== expected[key])
            .map(key => [key, actual[key], expected[key]]);
          if (JSON.stringify(actual.retryIdentityKeys) !== JSON.stringify(expected.retryIdentityKeys)) {
            mismatches.push(['retryIdentityKeys', actual.retryIdentityKeys, expected.retryIdentityKeys]);
          }
          const completed = new Set(state.completed.identityKeys);
          const completedRetries = actual.retryIdentityKeys.filter(key => completed.has(key));
          if (completedRetries.length) mismatches.push(['completedRetries', completedRetries, []]);
          const checkpoint = {
            schemaVersion: 2,
            sourceRunId: '32754804084',
            generatedAt: new Date().toISOString(),
            expected,
            actual,
            mismatches,
            passed: mismatches.length === 0,
          };
          await writeFile('/tmp/rlf-ledger-checkpoint.json', `${JSON.stringify(checkpoint, null, 2)}\n`);
          console.log(JSON.stringify(checkpoint, null, 2));
          if (mismatches.length) throw new Error(`Ledger checkpoint mismatch: ${JSON.stringify(mismatches)}`);
          NODE
            pnpm check
            pnpm build
          } 2>&1 | tee /tmp/rlf-validation.log
      - name: Generate validation proof
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p data/execution
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const log = fs.existsSync('/tmp/rlf-validation.log')
            ? fs.readFileSync('/tmp/rlf-validation.log')
            : Buffer.from('validation step did not create a log');
          const checkpoint = fs.existsSync('/tmp/rlf-ledger-checkpoint.json')
            ? JSON.parse(fs.readFileSync('/tmp/rlf-ledger-checkpoint.json', 'utf8'))
            : null;
          const proof = {
            schemaVersion: 3,
            recordedAt: new Date().toISOString(),
            sourceCommitSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || '1'),
            validationOutcome: process.env.VALIDATION_OUTCOME,
            nodeVersion: process.version,
            logSha256: crypto.createHash('sha256').update(log).digest('hex'),
            ledgerCheckpoint: checkpoint,
            requiredChecks: [
              'pnpm_install_frozen_lockfile',
              'execution_script_syntax',
              'canonical_json_and_five_delta_parse',
              'exact_sequence_10_append_only_ledger_checkpoint',
              'typescript_no_emit',
              'production_build'
            ]
          };
          fs.writeFileSync('data/execution/validation-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
          NODE
      - name: Commit, rebase and publish proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/validation-proof.json
          git commit -m "Persist RLF validation proof ${GITHUB_RUN_ID}"
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
      - name: Enforce validation success
        if: steps.validate.outcome != 'success'
        run: exit 1
