name: RLF EU27 CP122 Parallel27 deep lexical discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-eu27-cp122-parallel27-deep-lexical-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deep27:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix:
        lane: [L01,L02,L03,L04,L05,L06,L07,L08,L09,L10,L11,L12,L13,L14,L15,L16,L17,L18,L19,L20,L21,L22,L23,L24,L25,L26,L27]
    env:
      GH_TOKEN: ${{ github.token }}
      LANE: ${{ matrix.lane }}
      CP121_RUN: '33763764511'
      CP120_RUN: '33759404171'
    steps:
      - uses: actions/checkout@v4

      - name: Recover newest lane state fail-closed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          if gh run download "$CP121_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP121-LANE-$LANE" -D src 2>/dev/null; then
            echo 'SOURCE_CHECKPOINT=CP121' >> "$GITHUB_ENV"
          else
            gh run download "$CP120_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP120-LANE-$LANE" -D src
            echo 'SOURCE_CHECKPOINT=CP120_FALLBACK' >> "$GITHUB_ENV"
          fi
          test -f "src/$LANE.json"

      - name: Execute non-overlapping deep lexical vectors and first-party triage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q shapely
          python3 - <<'PY'
          import os,json,re,html,time,hashlib,urllib.parse,urllib.request,ssl,random
          from pathlib import Path
          from urllib.parse import urlparse
          from shapely.geometry import shape,box,Point

          lane=os.environ['LANE']; lane_no=int(lane[1:]); source=os.environ['SOURCE_CHECKPOINT']
          a=json.load(open(f'src/{lane}.json',encoding='utf-8'))
          iso=a.get('iso'); city_id=a.get('city_id'); city_name=a.get('city_name'); zone_id=a.get('zone_id')
          UA='Mozilla/5.0 (compatible; RLF-EU27-CP122/1.0; +https://github.com/FIGUEBARCELONA/ready-like-freddy)'
          ctx=ssl.create_default_context(); time.sleep((lane_no%6)*0.65)
          endpoints=['https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.osm.ch/api/interpreter']

          def domain(v):
            if not v:return None
            try:
              u=str(v) if '://' in str(v) else 'https://'+str(v); h=(urlparse(u).hostname or '').lower().strip('.')
              return h[4:] if h.startswith('www.') else h
            except:return None

          seen_keys=set(); seen_domains=set(); excluded_names=set(); excluded_domains=set()
          for key in ['candidates','enriched_candidates','new_identities']:
            for r in a.get(key) or []:
              if r.get('osm_key'): seen_keys.add(str(r['osm_key']))
              d=domain(r.get('domain') or r.get('canonical_domain_candidate') or r.get('website'))
              if d: seen_domains.add(d)
          for p in Path('data/supplier-census/canonical').glob('*.json'):
            try:o=json.load(open(p,encoding='utf-8'))
            except:continue
            for v in ([o.get('canonical_domain')] if o.get('canonical_domain') else [])+list(o.get('canonical_domains') or []):
              d=domain(v)
              if d:seen_domains.add(d)
          ex=Path('data/supplier-census/exclusions/canonical-rejection-ledger-2026-09-03.json')
          if ex.exists():
            try:
              eo=json.load(open(ex,encoding='utf-8'))
              for r in eo.get('entries') or []:
                if r.get('name'):excluded_names.add(str(r['name']).strip().lower())
                d=domain(r.get('domain'))
                if d:excluded_domains.add(d)
            except:pass

          def get_json(url,timeout=90):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,*/*'})
            with urllib.request.urlopen(req,timeout=timeout,context=ctx) as r:return json.loads(r.read())

          zone=None; geometry_status='UNRESOLVED_FAIL_CLOSED'
          if iso!='FR':
            try:
              gj=get_json('https://gisco-services.ec.europa.eu/distribution/v2/lau/geojson/LAU_RG_01M_2024_4326.geojson')
              feat=next(f for f in gj['features'] if str((f.get('properties') or {}).get('LAU_ID') or (f.get('properties') or {}).get('GISCO_ID'))==str(city_id))
              g=shape(feat['geometry']); minx,miny,maxx,maxy=g.bounds; dx=(maxx-minx)/3; dy=(maxy-miny)/3
              zmap={}
              for rr in range(1,4):
                for cc in range(1,4):
                  z=g.intersection(box(minx+(cc-1)*dx,miny+(rr-1)*dy,minx+cc*dx,miny+rr*dy))
                  if not z.is_empty and z.area>1e-15:zmap[f'{city_id}_G{rr}{cc}']=z
              zone=zmap.get(zone_id); geometry_status='GISCO_GRID_PASS' if zone is not None else 'ZONE_NOT_IN_GRID_FAIL_CLOSED'
            except Exception:geometry_status='GISCO_FETCH_FAIL_CLOSED'

          def overpass(q,seed):
            errs=[]; order=list(range(len(endpoints))); random.Random(12200+seed+lane_no).shuffle(order)
            for j in order:
              ep=endpoints[j]
              for method in ('POST','GET'):
                try:
                  if method=='POST':
                    payload=urllib.parse.urlencode({'data':q}).encode(); req=urllib.request.Request(ep,data=payload,headers={'User-Agent':UA,'Accept':'application/json,*/*','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'})
                  else:req=urllib.request.Request(ep+'?'+urllib.parse.urlencode({'data':q}),headers={'User-Agent':UA,'Accept':'application/json,*/*'})
                  with urllib.request.urlopen(req,timeout=55,context=ctx) as r:body=r.read();status=getattr(r,'status',200)
                  return json.loads(body),ep,method,status,errs
                except Exception as e:errs.append({'endpoint':ep,'method':method,'error':type(e).__name__+': '+str(e)})
            return None,None,None,None,errs[-8:]

          core='consignment|commission sale|kommission|kommissions|resale|re-sale|reuse|re-use|preowned|pre-owned|designer second|luxury second|vintage kilo|kilo shop|op shop|boutique solidaire|tienda solidaria|moda circular|roupa usada|odzież używana|seconda mano|friperie|kringloop|kirppis|kirpputori|loppis|gebrauchtkleidung|gebrauchte kleidung|kleidertausch|second hand mode|second-hand mode|preloved'
          social='humana|oxfam|caritas|carla|red cross|rotes kreuz|croix rouge|croce rossa|cruz roja|emmaus|emaus|remar|betel|vinzi|kringwinkel'
          vectors=[]
          if iso=='FR' and str(zone_id).startswith('FR_'):
            code=str(zone_id)[3:]; area=f'area["ref:INSEE"="{code}"]->.a;'; geometry_status='INSEE_AREA_QUERY'
            vectors=[
              ('X01',f'[out:json][timeout:45];{area}nwr[shop=clothes][description~"{core}",i](area.a);out center tags;'),
              ('X02',f'[out:json][timeout:45];{area}nwr[shop=boutique][name~"{core}",i](area.a);out center tags;'),
              ('X03',f'[out:json][timeout:45];{area}nwr[description~"{core}",i](area.a);out center tags;'),
              ('X04',f'[out:json][timeout:45];{area}nwr[operator~"{social}",i](area.a);out center tags;'),
              ('X05',f'[out:json][timeout:45];{area}nwr[brand~"{social}",i](area.a);out center tags;'),
              ('X06',f'[out:json][timeout:45];{area}nwr[amenity=marketplace][name~"{core}",i](area.a);out center tags;'),
              ('X07',f'[out:json][timeout:45];{area}nwr[second_hand][shop!=second_hand][shop!=clothes](area.a);out center tags;')]
          elif zone is not None:
            minx,miny,maxx,maxy=zone.bounds; bb=f'{miny},{minx},{maxy},{maxx}'
            vectors=[
              ('X01',f'[out:json][timeout:45];nwr[shop=clothes][description~"{core}",i]({bb});out center tags;'),
              ('X02',f'[out:json][timeout:45];nwr[shop=boutique][name~"{core}",i]({bb});out center tags;'),
              ('X03',f'[out:json][timeout:45];nwr[description~"{core}",i]({bb});out center tags;'),
              ('X04',f'[out:json][timeout:45];nwr[operator~"{social}",i]({bb});out center tags;'),
              ('X05',f'[out:json][timeout:45];nwr[brand~"{social}",i]({bb});out center tags;'),
              ('X06',f'[out:json][timeout:45];nwr[amenity=marketplace][name~"{core}",i]({bb});out center tags;'),
              ('X07',f'[out:json][timeout:45];nwr[second_hand][shop!=second_hand][shop!=clothes]({bb});out center tags;')]

          merged={}; records=[]; technical=False
          for i,(vid,q) in enumerate(vectors):
            data,ep,method,status,errs=overpass(q,i)
            if data is None:
              technical=True;records.append({'vector':vid,'status':'TECHNICAL_FAILURE_NO_CREDIT','errors':errs});continue
            total=fresh=0
            for el in data.get('elements',[]):
              lat=el.get('lat');lon=el.get('lon');cen=el.get('center') or {}
              if lat is None:lat=cen.get('lat')
              if lon is None:lon=cen.get('lon')
              if lat is None or lon is None:continue
              lat=float(lat);lon=float(lon)
              if zone is not None and not zone.covers(Point(lon,lat)):continue
              total+=1;t=el.get('tags') or {};key=f"{el.get('type')}:{el.get('id')}";name=str(t.get('name') or '').strip();web=t.get('website') or t.get('contact:website');d=domain(web)
              if key in seen_keys or (d and d in seen_domains) or (d and d in excluded_domains) or (name and name.lower() in excluded_names):continue
              fresh+=1
              rec=merged.setdefault(key,{'osm_key':key,'name':name or None,'website':web,'domain':d,'phone':t.get('phone') or t.get('contact:phone'),'email':t.get('email') or t.get('contact:email'),'operator':t.get('operator'),'brand':t.get('brand'),'shop':t.get('shop'),'second_hand':t.get('second_hand'),'description':t.get('description'),'lat':lat,'lon':lon,'vectors':[]})
              rec['vectors'].append(vid)
            records.append({'vector':vid,'status':'SUCCESS','in_zone':total,'fresh_after_master_dedup':fresh,'endpoint':ep,'method':method,'http_status':status})

          rows=list(merged.values());rows.sort(key=lambda r:(0 if r.get('website') else 1,0 if r.get('shop') in ('clothes','boutique') else 1,str(r.get('name') or '').lower()));rows=rows[:14]
          legal_re=re.compile(r'\b(impressum|imprint|legal notice|mentions légales|aviso legal|privacy|terms|conditions|company|societ|gmbh|ug\b|ohg\b|kg\b|srl\b|s\.l\.|bv\b|oy\b|ab\b|aps\b|kft\b|sro\b|uab\b|oü\b|sia\b|vat|iva|nif|cif|siret|siren|kvk|nip|uid|ust.?id|register)\b',re.I)
          second_re=re.compile(r'\b(second[ -]?hand|pre[ -]?loved|preowned|pre-owned|vintage|thrift|used clothing|used clothes|gebraucht|friperie|kringloop|kringwinkel|segunda mano|roupa usada|seconda mano|odzież używana|loppis|kirppis|kirpputori|consignment|commission)\b',re.I)
          apparel_re=re.compile(r'\b(clothes|clothing|apparel|fashion|garment|kleidung|mode|ropa|roupa|abbigliamento|kleding|odzież|dress|shirt|jacket|coat|trousers|jeans|skirt|blouse|shoes)\b',re.I)
          commerce_re=re.compile(r'\b(add to cart|checkout|buy now|shop now|warenkorb|panier|carrito|carrello|winkelwagen|koszyk|€|eur)\b',re.I)
          paths=['/','/impressum','/imprint','/legal','/aviso-legal','/mentions-legales','/privacy-policy','/policies/contact-information','/terms','/agb','/policies/terms-of-service','/shipping','/versand','/envios','/contact','/kontakt','/about','/about-us']
          def fetch_text(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=6,context=ctx) as r:raw=r.read(180000);final=r.geturl();status=getattr(r,'status',200)
              txt=html.unescape(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',raw.decode('utf-8','replace'))))[:90000]
              return status,final,txt
            except:return None,url,''
          enriched=[]
          for r in rows:
            pages=[];web=r.get('website')
            if web:
              base=(web if '://' in str(web) else 'https://'+str(web)).rstrip('/')
              for p in paths:
                st,u,txt=fetch_text(base+p)
                if not txt:continue
                m={'legal':bool(legal_re.search(txt)),'secondhand':bool(second_re.search(txt)),'apparel':bool(apparel_re.search(txt)),'commerce':bool(commerce_re.search(txt))}
                pages.append({'path':p,'url':u,'status':st,'markers':m,'sha256':hashlib.sha256(txt.encode()).hexdigest()})
                if any(x['markers']['legal'] for x in pages) and any(x['markers']['secondhand'] and x['markers']['apparel'] for x in pages) and len(pages)>=3:break
            agg={k:any(p['markers'][k] for p in pages) for k in ['legal','secondhand','apparel','commerce']}
            st='PASS2_EVIDENCE_PACK_READY' if agg['legal'] and agg['secondhand'] and agg['apparel'] else ('PASS2_ACTIVITY_READY_LEGAL_GAP' if agg['secondhand'] and agg['apparel'] else 'PASS2_EVIDENCE_GAP')
            enriched.append({**r,'pass2_status':st,'markers':agg,'pages':pages})

          out={'schema':'RLF_EU27_CP122_DEEP_LEXICAL_DISCOVERY_V1','lane_id':lane,'iso':iso,'city_id':city_id,'city_name':city_name,'zone_id':zone_id,'source_checkpoint':source,'vector_family':'CP122_X01_X07_NON_OVERLAPPING_WITH_CP121_S01_S07','query_records':records,'fresh_identities_discovered':len(merged),'candidates_harvested_for_pass2':len(enriched),'pass2_evidence_pack_ready':sum(x['pass2_status']=='PASS2_EVIDENCE_PACK_READY' for x in enriched),'activity_ready_legal_gap':sum(x['pass2_status']=='PASS2_ACTIVITY_READY_LEGAL_GAP' for x in enriched),'evidence_gap':sum(x['pass2_status']=='PASS2_EVIDENCE_GAP' for x in enriched),'technical_failure':technical,'geometry_status':geometry_status,'candidates':enriched,'canonical_delta':0,'automatic_promotion_prohibited':True,'territorial_credit':'NONE_SUPPLEMENTAL_DISCOVERY_ONLY','quality':'AAA_FAIL_CLOSED'}
          out['sha256']=hashlib.sha256(json.dumps(out,sort_keys=True,ensure_ascii=False).encode()).hexdigest();Path('out').mkdir(exist_ok=True);json.dump(out,open(f'out/{lane}.json','w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps({k:out[k] for k in ['lane_id','iso','zone_id','source_checkpoint','fresh_identities_discovered','pass2_evidence_pack_ready','activity_ready_legal_gap','evidence_gap','technical_failure','geometry_status']},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP122-LANE-${{ matrix.lane }}
          path: out/${{ matrix.lane }}.json
          retention-days: 30

  consolidate:
    if: always()
    needs: deep27
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RLF-EU27-CP122-LANE-*
          path: lanes
          merge-multiple: true
      - name: Consolidate CP122
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,hashlib
          rows=[]
          for f in glob.glob('lanes/*.json'):
            try:rows.append(json.load(open(f,encoding='utf-8')))
            except:pass
          out={'schema':'RLF_EU27_CP122_CONSOLIDATED_V1','lanes_received':len(rows),'cp121_sources':sum(x.get('source_checkpoint')=='CP121' for x in rows),'cp120_fallback_sources':sum(x.get('source_checkpoint')=='CP120_FALLBACK' for x in rows),'fresh_identities_discovered':sum(x.get('fresh_identities_discovered',0) for x in rows),'candidates_harvested_for_pass2':sum(x.get('candidates_harvested_for_pass2',0) for x in rows),'pass2_evidence_pack_ready':sum(x.get('pass2_evidence_pack_ready',0) for x in rows),'activity_ready_legal_gap':sum(x.get('activity_ready_legal_gap',0) for x in rows),'evidence_gap':sum(x.get('evidence_gap',0) for x in rows),'technical_failure_lanes':[x.get('lane_id') for x in rows if x.get('technical_failure')],'geometry_fail_closed_lanes':[x.get('lane_id') for x in rows if 'FAIL_CLOSED' in str(x.get('geometry_status'))],'canonical_delta':0,'automatic_promotion_prohibited':True,'territorial_credit':'NONE_SUPPLEMENTAL_DISCOVERY_ONLY','quality_gate':'PASS' if len(rows)==27 else 'FAIL_CLOSED'}
          out['sha256']=hashlib.sha256(json.dumps(out,sort_keys=True).encode()).hexdigest();json.dump(out,open('CP122-CONSOLIDATED.json','w'),indent=2,sort_keys=True);print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP122-CONSOLIDATED
          path: CP122-CONSOLIDATED.json
          retention-days: 30
