name: RLF Berlin G21 repair Parallel50 M770-M819

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-berlin-g21-repair-p50-m770-m819.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel50:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Build G21 live queue and 50 exclusive work units
        shell: bash
        run: |
          set -euo pipefail
          rm -rf p50 && mkdir -p p50/ready p50/out p50/buckets
          python3 -m pip install -q shapely
          curl -fsSL 'https://raw.githubusercontent.com/euraf/eu-nuts-lau/main/v1/DE/DE300_LAU_RG_01M_2024_4326.geojson' -o berlin.geojson
          python3 - <<'PYQ'
          import json,re,urllib.request,unicodedata,hashlib
          from shapely.geometry import shape,box,Point,mapping
          f=json.load(open('berlin.geojson'))['features'][0]; g=shape(f['geometry']); minx,miny,maxx,maxy=g.bounds
          dx=(maxx-minx)/3; dy=(maxy-miny)/3
          bbox=[minx,miny+dy,minx+dx,miny+2*dy]; clip=g.intersection(box(*bbox))
          q='''[out:json][timeout:70];(nwr[shop=second_hand]({s},{w},{n},{e});nwr[shop=clothes][second_hand]({s},{w},{n},{e});nwr[shop=clothes][clothes=second_hand]({s},{w},{n},{e}););out center tags;'''.format(s=bbox[1],w=bbox[0],n=bbox[3],e=bbox[2])
          req=urllib.request.Request('https://overpass-api.de/api/interpreter',data=q.encode(),headers={'User-Agent':'RLF-census/1.0'})
          with urllib.request.urlopen(req,timeout=85) as r:data=json.load(r)
          raw=[]
          for el in data.get('elements',[]):
            lat=el.get('lat') or (el.get('center') or {}).get('lat'); lon=el.get('lon') or (el.get('center') or {}).get('lon')
            if lat is None or lon is None or not clip.covers(Point(lon,lat)):continue
            raw.append({'type':el.get('type'),'id':el.get('id'),'lat':lat,'lon':lon,'tags':el.get('tags',{})})
          def norm(s):
            s=unicodedata.normalize('NFKD',(s or '').lower());s=''.join(c for c in s if not unicodedata.combining(c));return re.sub('[^a-z0-9]+','',s)
          groups={}
          for x in raw:
            nm=x['tags'].get('name');key=norm(nm) if nm else f"unnamed:{x['type']}:{x['id']}";groups.setdefault(key,[]).append(x)
          ordered=sorted(groups.items(),key=lambda kv:((kv[1][0]['tags'].get('name') or 'zzzz').lower(),kv[0]))
          buckets=[[] for _ in range(20)]
          for i,(k,v) in enumerate(ordered):buckets[i%20].append({'key':k,'name':v[0]['tags'].get('name'),'records':v})
          for i,b in enumerate(buckets):json.dump(b,open(f'p50/buckets/{i:02d}.json','w'),ensure_ascii=False,indent=2)
          fc={'type':'FeatureCollection','features':[{'type':'Feature','properties':{'zone_id':'DE_11000000_G21','grid_bbox':bbox},'geometry':mapping(clip)}]};json.dump(fc,open('BERLIN_G21_CLIP.geojson','w'),ensure_ascii=False,indent=2)
          manifest={'zone':'DE_11000000_G21','bbox':bbox,'raw_records':len(raw),'identity_groups':len(ordered),'groups':[{'key':k,'name':v[0]['tags'].get('name'),'count':len(v)} for k,v in ordered]};manifest['sha256']=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest();json.dump(manifest,open('BERLIN_G21_LIVE_QUEUE.json','w'),ensure_ascii=False,indent=2);print(json.dumps({'raw_records':len(raw),'identity_groups':len(ordered),'bbox':bbox}))
          PYQ

          cat > p50/worker.py <<'PYW'
          import sys,os,time,json,re,html,urllib.parse,urllib.request,hashlib
          lane,kind,payload=sys.argv[1:4];open(f'p50/ready/{lane}','w').write(str(os.getpid()))
          deadline=time.time()+45
          while not os.path.exists('p50/GO'):
            if time.time()>deadline:raise SystemExit('barrier timeout')
            time.sleep(.02)
          time.sleep((int(hashlib.sha256(lane.encode()).hexdigest()[:4],16)%1200)/1000)
          def search(q,engine='bing'):
            enc=urllib.parse.quote_plus(q);url=f'https://www.bing.com/search?q={enc}&count=20' if engine=='bing' else f'https://html.duckduckgo.com/html/?q={enc}'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/151','Accept-Language':'de-DE,de;q=0.9'})
              with urllib.request.urlopen(req,timeout=30) as r:b=r.read().decode('utf-8','replace');st=getattr(r,'status',200)
              links=[];seen=set()
              for h in re.findall(r'href=["\']([^"\']+)["\']',b,re.I):
                h=html.unescape(h)
                if h.startswith('//'):h='https:'+h
                if 'uddg=' in h:
                  try:h=urllib.parse.parse_qs(urllib.parse.urlparse(h).query).get('uddg',[h])[0]
                  except:pass
                if not h.startswith('http'):continue
                host=(urllib.parse.urlparse(h).hostname or '').lower()
                if any(x in host for x in ['bing.com','microsoft.com','duckduckgo.com']):continue
                h=h.split('#',1)[0]
                if h in seen:continue
                seen.add(h);links.append(h)
                if len(links)>=12:break
              return {'query':q,'status':st,'links':links}
            except Exception as e:return {'query':q,'error':type(e).__name__+': '+str(e),'links':[]}
          out={'lane':lane,'kind':kind,'pid':os.getpid(),'payload':payload,'zone':'DE_11000000_G21'}
          if kind=='osm':
            b=json.load(open(f'p50/buckets/{int(payload):02d}.json'));items=[]
            for j,c in enumerate(b):
              nm=c.get('name');q=f'"{nm}" Berlin second hand kleidung' if nm else f'Berlin second hand near {c["records"][0]["lat"]} {c["records"][0]["lon"]}'
              items.append({'candidate':c,'search':search(q,'ddg' if j%2==0 else 'bing')})
            out['items']=items
          elif kind=='oxfam':
            urls=['https://shops.oxfam.de/shops/berlin-charlottenburg','https://shops.oxfam.de/shops/berlin-spandau','https://shops.oxfam.de/shops/berlin-wilmersdorf','https://shops.oxfam.de/impressum'];direct=[]
            for u in urls:
              try:
                req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Chrome/151'});r=urllib.request.urlopen(req,timeout=25);b=r.read(200000).decode('utf-8','replace');direct.append({'url':u,'status':getattr(r,'status',200),'text':html.unescape(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',b)))[:7000]})
              except Exception as e:direct.append({'url':u,'error':type(e).__name__+': '+str(e)})
            out['direct']=direct
          else:out['search']=search(payload,'bing' if int(lane[1:])%2 else 'ddg')
          json.dump(out,open(f'p50/out/{lane}.json','w'),ensure_ascii=False,indent=2)
          PYW

          queries=(
          'Spandau 13597 second hand kleidung laden' 'Spandau 13585 vintage kleidung geschäft' 'Spandau 13583 sozialkaufhaus kleidung verkauf' 'Spandau 13581 secondhand mode' 'Spandau 13589 gebraucht kleidung shop' 'Wilhelmstadt Berlin second hand mode' 'Altstadt Spandau vintage secondhand kleidung' 'Charlottenburg 10629 second hand kleidung' 'Charlottenburg 10627 vintage mode gebraucht' 'Charlottenburg 10625 secondhand shop mode' 'Charlottenburg 10623 preloved kleidung laden' 'Charlottenburg 10589 second hand mode' 'Charlottenburg 10587 secondhand kleidung' 'Westend 14050 vintage second hand kleidung' 'Westend 14052 gebraucht mode shop' 'Westend 14055 secondhand kleidung laden' 'Wilmersdorf 10709 second hand mode' 'Wilmersdorf 10711 vintage gebraucht kleidung' 'Wilmersdorf 10713 secondhand shop' 'Wilmersdorf 10715 kommissionsladen mode' 'Wilmersdorf 10717 second hand kleidung' 'Wilmersdorf 10719 vintage secondhand' 'Halensee Berlin second hand mode' 'Grunewald 14193 second hand kleidung' 'Schmargendorf second hand mode Berlin' 'Siemensstadt second hand kleidung Berlin' 'Charlottenburg sozialkaufhaus kleidung Verkauf' 'Spandau charity shop kleidung Verkauf' 'Berlin west Neueröffnung second hand 2026'
          )
          pids=();for i in $(seq 0 19);do lane=$(printf 'M%03d' $((770+i)));python3 p50/worker.py "$lane" osm "$i" & pids+=("$!");done
          python3 p50/worker.py M790 oxfam OXFAM_DEUTSCHLAND_SHOPS_GGMBH & pids+=("$!")
          for i in $(seq 0 28);do lane=$(printf 'M%03d' $((791+i)));python3 p50/worker.py "$lane" query "${queries[$i]}" & pids+=("$!");done
          deadline=$((SECONDS+45));while true;do ready=$(find p50/ready -type f|wc -l);[ "$ready" -eq 50 ]&&break;[ "$SECONDS" -ge "$deadline" ]&&exit 7;sleep .05;done
          alive=0;for p in "${pids[@]}";do kill -0 "$p" 2>/dev/null&&alive=$((alive+1));done;echo "BARRIER_READY=$ready";echo "SIMULTANEOUS_ALIVE=$alive";[ "$alive" -eq 50 ]||exit 8
          date +%s.%N > p50/GO;fail=0;for p in "${pids[@]}";do wait "$p"||fail=$((fail+1));done;echo "WORKER_PROCESS_FAILURES=$fail";[ "$fail" -eq 0 ]||exit 9
      - name: AAA merge
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,hashlib
          rows=[json.load(open(f)) for f in sorted(glob.glob('p50/out/M*.json'))];q=json.load(open('BERLIN_G21_LIVE_QUEUE.json'))
          r={'zone':'DE_11000000_G21','packet':'M770-M819','workers':len(rows),'unique_pids':len({x['pid'] for x in rows}),'unique_lanes':len({x['lane'] for x in rows}),'simultaneous_alive':50,'queue_identity_groups':q['identity_groups'],'rows':rows};r['sha256']=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':')).encode()).hexdigest();json.dump(r,open('RLF_BERLIN_G21_REPAIR_M770_M819.json','w'),indent=2);print(json.dumps({k:r[k] for k in ['workers','unique_pids','unique_lanes','simultaneous_alive','queue_identity_groups']}));assert r['workers']==r['unique_pids']==r['unique_lanes']==50
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: RLF-BERLIN-G21-REPAIR-M770-M819
          path: |
            BERLIN_G21_CLIP.geojson
            BERLIN_G21_LIVE_QUEUE.json
            RLF_BERLIN_G21_REPAIR_M770_M819.json
            p50/out/*.json
          retention-days: 7
