name: RLF EU27 CP121 Parallel27 fresh territorial discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-eu27-cp121-parallel27-fresh-territorial-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover27:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix:
        lane: [L01,L02,L03,L04,L05,L06,L07,L08,L09,L10,L11,L12,L13,L14,L15,L16,L17,L18,L19,L20,L21,L22,L23,L24,L25,L26,L27]
    env:
      GH_TOKEN: ${{ github.token }}
      LANE: ${{ matrix.lane }}
      CP117_RUN: '33714142136'
      CP116_RUN: '33713443841'
      CP118_RUN: '33757807782'
      CP119_RUN: '33758704808'
      CP120_RUN: '33759404171'
    steps:
      - uses: actions/checkout@v4

      - name: Recover immutable lineage and prior PASS2 waves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src p118 p119 p120
          if gh run download "$CP117_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP117-LANE-$LANE" -D src 2>/dev/null; then
            echo 'SOURCE_CHECKPOINT=CP117' >> "$GITHUB_ENV"
          else
            gh run download "$CP116_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP116-LANE-$LANE" -D src
            echo 'SOURCE_CHECKPOINT=CP116_FALLBACK' >> "$GITHUB_ENV"
          fi
          gh run download "$CP118_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP118-LANE-$LANE" -D p118
          gh run download "$CP119_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP119-LANE-$LANE" -D p119
          gh run download "$CP120_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP120-LANE-$LANE" -D p120

      - name: Fresh non-overlapping territorial discovery plus first-party triage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q shapely
          python3 - <<'PY'
          import os,json,re,html,time,hashlib,urllib.parse,urllib.request,ssl,random
          from pathlib import Path
          from urllib.parse import urlparse
          from shapely.geometry import shape,box,Point

          lane=os.environ['LANE']; lane_no=int(lane[1:]); sc=os.environ['SOURCE_CHECKPOINT']
          src=json.load(open(f'src/{lane}.json',encoding='utf-8'))
          p118=json.load(open(f'p118/{lane}.json',encoding='utf-8'))
          p119=json.load(open(f'p119/{lane}.json',encoding='utf-8'))
          p120=json.load(open(f'p120/{lane}.json',encoding='utf-8'))
          iso=src.get('iso') or p120.get('iso'); city_id=src.get('city_id') or p120.get('city_id'); city_name=src.get('city_name') or p120.get('city_name'); zone_id=src.get('zone_id') or p120.get('zone_id')
          UA='Mozilla/5.0 (compatible; RLF-EU27-CP121/1.0; +https://github.com/FIGUEBARCELONA/ready-like-freddy)'
          ctx=ssl.create_default_context(); time.sleep((lane_no%5)*0.7)
          endpoints=['https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.osm.ch/api/interpreter']

          def dom(x):
            if not x:return None
            try:
              u=str(x) if '://' in str(x) else 'https://'+str(x); h=(urlparse(u).hostname or '').lower().strip('.')
              return h[4:] if h.startswith('www.') else h
            except:return None

          seen_keys=set(); seen_domains=set()
          def absorb(obj):
            for key in ['enriched_candidates','candidates','new_identities']:
              rows=obj.get(key) or []
              if isinstance(rows,dict): rows=list(rows.values())
              for r in rows:
                k=r.get('osm_key'); d=dom(r.get('domain') or r.get('canonical_domain_candidate') or r.get('website') or r.get('direct_url'))
                if k: seen_keys.add(str(k))
                if d: seen_domains.add(d)
          for obj in (src,p118,p119,p120): absorb(obj)
          for p in Path('data/supplier-census/canonical').glob('*.json'):
            try:o=json.load(open(p,encoding='utf-8'))
            except:continue
            vals=([o.get('canonical_domain')] if o.get('canonical_domain') else [])+list(o.get('canonical_domains') or [])
            for v in vals:
              d=dom(v)
              if d: seen_domains.add(d)

          def get_json(url,timeout=90):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,*/*'})
            with urllib.request.urlopen(req,timeout=timeout,context=ctx) as r:return json.loads(r.read())

          zone_geom=None
          if iso!='FR':
            try:
              gj=get_json('https://gisco-services.ec.europa.eu/distribution/v2/lau/geojson/LAU_RG_01M_2024_4326.geojson')
              feat=next(f for f in gj['features'] if str((f.get('properties') or {}).get('LAU_ID') or (f.get('properties') or {}).get('GISCO_ID'))==str(city_id))
              g=shape(feat['geometry']); minx,miny,maxx,maxy=g.bounds; dx=(maxx-minx)/3; dy=(maxy-miny)/3
              zmap={}
              for rr in range(1,4):
                for cc in range(1,4):
                  z=g.intersection(box(minx+(cc-1)*dx,miny+(rr-1)*dy,minx+cc*dx,miny+rr*dy))
                  if not z.is_empty and z.area>1e-15:zmap[f'{city_id}_G{rr}{cc}']=z
              zone_geom=zmap.get(zone_id)
            except Exception:
              zone_geom=None

          def overpass(q,seed):
            errs=[]; order=list(range(len(endpoints))); random.Random(12100+seed+lane_no).shuffle(order)
            for j in order:
              ep=endpoints[j]
              for method in ('POST','GET'):
                try:
                  if method=='POST':
                    payload=urllib.parse.urlencode({'data':q}).encode(); req=urllib.request.Request(ep,data=payload,headers={'User-Agent':UA,'Accept':'application/json,*/*','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'})
                  else:
                    req=urllib.request.Request(ep+'?'+urllib.parse.urlencode({'data':q}),headers={'User-Agent':UA,'Accept':'application/json,*/*'})
                  with urllib.request.urlopen(req,timeout=55,context=ctx) as r: body=r.read(); status=getattr(r,'status',200)
                  return json.loads(body),ep,method,status,errs
                except Exception as e: errs.append({'endpoint':ep,'method':method,'error':type(e).__name__+': '+str(e)})
            return None,None,None,None,errs[-8:]

          local_name='second.?hand|secondhand|vintage|thrift|pre.?loved|preowned|friperie|kringloop|kringwinkel|gebraucht|kleider|roupa usada|segunda mano|seconda mano|odzież używana|loppis|kirppis|kirpputori|retro|vintage shop|second hand mode'
          vectors=[]
          if iso=='FR' and str(zone_id).startswith('FR_'):
            code=str(zone_id)[3:]
            area=f'area["ref:INSEE"="{code}"]->.a;'
            vectors=[
              ('F01',f'[out:json][timeout:45];{area}nwr[shop=second_hand](area.a);out center tags;'),
              ('F02',f'[out:json][timeout:45];{area}nwr[shop=clothes][second_hand](area.a);out center tags;'),
              ('F03',f'[out:json][timeout:45];{area}nwr[shop=vintage](area.a);out center tags;'),
              ('F04',f'[out:json][timeout:45];{area}nwr[shop=charity](area.a);out center tags;'),
              ('F05',f'[out:json][timeout:45];{area}nwr[name~"{local_name}",i](area.a);out center tags;')]
          elif zone_geom is not None:
            minx,miny,maxx,maxy=zone_geom.bounds; bb=f'{miny},{minx},{maxy},{maxx}'
            vectors=[
              ('S01',f'[out:json][timeout:45];nwr[shop=second_hand]({bb});out center tags;'),
              ('S02',f'[out:json][timeout:45];nwr[shop=clothes][second_hand]({bb});out center tags;'),
              ('S03',f'[out:json][timeout:45];nwr[shop=vintage]({bb});out center tags;'),
              ('S04',f'[out:json][timeout:45];nwr[shop=charity]({bb});out center tags;'),
              ('S05',f'[out:json][timeout:45];nwr[name~"{local_name}",i]({bb});out center tags;'),
              ('S06',f'[out:json][timeout:45];nwr[second_hand=yes][shop]({bb});out center tags;'),
              ('S07',f'[out:json][timeout:45];nwr[second_hand=only][shop]({bb});out center tags;')]
          else:
            # Fail closed: no invented geometry and no territorial credit.
            vectors=[]

          merged={}; query_records=[]; technical_failure=False
          for i,(vid,q) in enumerate(vectors):
            data,ep,method,status,errs=overpass(q,i)
            if data is None:
              technical_failure=True; query_records.append({'vector':vid,'status':'TECHNICAL_FAILURE_NO_CREDIT','attempt_errors':errs}); continue
            kept=0; fresh=0
            for el in data.get('elements',[]):
              lat=el.get('lat'); lon=el.get('lon'); cen=el.get('center') or {}
              if lat is None: lat=cen.get('lat')
              if lon is None: lon=cen.get('lon')
              if lat is None or lon is None: continue
              lat=float(lat); lon=float(lon)
              if zone_geom is not None and not zone_geom.covers(Point(lon,lat)): continue
              t=el.get('tags') or {}; key=f"{el.get('type')}:{el.get('id')}"; kept+=1
              if key in seen_keys: continue
              web=t.get('website') or t.get('contact:website'); d=dom(web)
              if d and d in seen_domains: continue
              fresh+=1
              if key not in merged:
                merged[key]={'osm_key':key,'name':t.get('name'),'website':web,'phone':t.get('phone') or t.get('contact:phone'),'email':t.get('email') or t.get('contact:email'),'operator':t.get('operator'),'shop':t.get('shop'),'second_hand':t.get('second_hand'),'lat':lat,'lon':lon,'vectors':[]}
              merged[key]['vectors'].append(vid)
            query_records.append({'vector':vid,'status':'SUCCESS','in_zone':kept,'fresh_after_dedup':fresh,'endpoint':ep,'method':method,'http_status':status})

          candidates=list(merged.values())
          candidates.sort(key=lambda r:(0 if r.get('website') else 1,0 if r.get('shop') in ('second_hand','clothes','vintage') else 1,str(r.get('name') or '').lower()))
          candidates=candidates[:12]
          legal_re=re.compile(r'\b(impressum|imprint|legal notice|mentions légales|aviso legal|privacy|terms|conditions|company|gmbh|ug\b|ohg\b|kg\b|srl\b|s\.l\.|bv\b|oy\b|ab\b|aps\b|kft\b|sro\b|uab\b|oü\b|sia\b|vat|iva|nif|cif|siret|siren|kvk|nip|uid|ust.?id|register)\b',re.I)
          second_re=re.compile(r'\b(second[ -]?hand|secondhand|pre[ -]?loved|preowned|pre-owned|vintage|thrift|used clothing|used clothes|gebraucht|friperie|kringloop|kringwinkel|segunda mano|roupa usada|seconda mano|odzież używana|loppis|kirppis|kirpputori)\b',re.I)
          apparel_re=re.compile(r'\b(clothes|clothing|apparel|fashion|garment|kleidung|mode|ropa|roupa|abbigliamento|kleding|odzież|dress|shirt|jacket|coat|trousers|jeans|skirt|blouse|shoes)\b',re.I)
          commerce_re=re.compile(r'\b(add to cart|checkout|buy now|shop now|warenkorb|panier|carrito|carrello|winkelwagen|koszyk|€|eur)\b',re.I)
          paths=['/','/impressum','/imprint','/legal','/aviso-legal','/mentions-legales','/privacy-policy','/policies/contact-information','/terms','/agb','/policies/terms-of-service','/shipping','/versand','/envios','/contact','/kontakt','/about','/about-us']
          def fetch_text(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=6,context=ctx) as r: raw=r.read(180000); final=r.geturl(); status=getattr(r,'status',200)
              txt=html.unescape(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',raw.decode('utf-8','replace'))))[:90000]
              return status,final,txt
            except:return None,url,''
          enriched=[]
          for r in candidates:
            web=r.get('website'); pages=[]
            if web:
              base=(web if '://' in str(web) else 'https://'+str(web)).rstrip('/')
              for p in paths:
                st,u,txt=fetch_text(base+p)
                if not txt: continue
                m={'legal':bool(legal_re.search(txt)),'secondhand':bool(second_re.search(txt)),'apparel':bool(apparel_re.search(txt)),'commerce':bool(commerce_re.search(txt))}
                pages.append({'path':p,'url':u,'status':st,'markers':m,'sha256':hashlib.sha256(txt.encode()).hexdigest()})
                if any(x['markers']['legal'] for x in pages) and any(x['markers']['secondhand'] and x['markers']['apparel'] for x in pages) and len(pages)>=3: break
            agg={k:any(p['markers'][k] for p in pages) for k in ['legal','secondhand','apparel','commerce']}
            status='PASS2_EVIDENCE_PACK_READY' if agg['legal'] and agg['secondhand'] and agg['apparel'] else ('PASS2_ACTIVITY_READY_LEGAL_GAP' if agg['secondhand'] and agg['apparel'] else 'PASS2_EVIDENCE_GAP')
            enriched.append({**r,'domain':dom(web),'pass2_status':status,'markers':agg,'pages':pages})

          out={'schema':'RLF_EU27_CP121_FRESH_TERRITORIAL_DISCOVERY_V1','lane_id':lane,'iso':iso,'city_id':city_id,'city_name':city_name,'zone_id':zone_id,'source_checkpoint':sc,'query_records':query_records,'seen_osm_keys_before':len(seen_keys),'seen_domains_before':len(seen_domains),'fresh_identities_discovered':len(merged),'candidates_harvested_for_pass2':len(enriched),'pass2_evidence_pack_ready':sum(x['pass2_status']=='PASS2_EVIDENCE_PACK_READY' for x in enriched),'activity_ready_legal_gap':sum(x['pass2_status']=='PASS2_ACTIVITY_READY_LEGAL_GAP' for x in enriched),'evidence_gap':sum(x['pass2_status']=='PASS2_EVIDENCE_GAP' for x in enriched),'technical_failure':technical_failure,'geometry_status':'INSEE_AREA_QUERY' if iso=='FR' and vectors else ('GISCO_GRID_PASS' if zone_geom is not None else 'GEOMETRY_UNAVAILABLE_FAIL_CLOSED'),'candidates':enriched,'canonical_delta':0,'automatic_promotion_prohibited':True,'territorial_credit':'NONE_SUPPLEMENTAL_DISCOVERY_ONLY','quality':'AAA_FAIL_CLOSED'}
          out['sha256']=hashlib.sha256(json.dumps(out,sort_keys=True,ensure_ascii=False).encode()).hexdigest(); Path('out').mkdir(exist_ok=True); json.dump(out,open(f'out/{lane}.json','w',encoding='utf-8'),ensure_ascii=False,indent=2,sort_keys=True)
          print(json.dumps({k:out[k] for k in ['lane_id','iso','zone_id','fresh_identities_discovered','candidates_harvested_for_pass2','pass2_evidence_pack_ready','activity_ready_legal_gap','evidence_gap','technical_failure','geometry_status']},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP121-LANE-${{ matrix.lane }}
          path: out/${{ matrix.lane }}.json
          retention-days: 30

  consolidate:
    if: always()
    needs: discover27
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RLF-EU27-CP121-LANE-*
          path: lanes
          merge-multiple: true
      - name: Consolidate CP121 fail-closed
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,hashlib
          rows=[]
          for f in glob.glob('lanes/*.json'):
            try: rows.append(json.load(open(f,encoding='utf-8')))
            except: pass
          out={'schema':'RLF_EU27_CP121_CONSOLIDATED_V1','lanes_received':len(rows),'fresh_identities_discovered':sum(x.get('fresh_identities_discovered',0) for x in rows),'candidates_harvested_for_pass2':sum(x.get('candidates_harvested_for_pass2',0) for x in rows),'pass2_evidence_pack_ready':sum(x.get('pass2_evidence_pack_ready',0) for x in rows),'activity_ready_legal_gap':sum(x.get('activity_ready_legal_gap',0) for x in rows),'evidence_gap':sum(x.get('evidence_gap',0) for x in rows),'technical_failure_lanes':[x.get('lane_id') for x in rows if x.get('technical_failure')],'geometry_fail_closed_lanes':[x.get('lane_id') for x in rows if 'UNAVAILABLE' in str(x.get('geometry_status'))],'canonical_delta':0,'automatic_promotion_prohibited':True,'territorial_credit':'NONE_SUPPLEMENTAL_DISCOVERY_ONLY','quality_gate':'PASS' if len(rows)==27 else 'FAIL_CLOSED'}
          out['sha256']=hashlib.sha256(json.dumps(out,sort_keys=True).encode()).hexdigest(); json.dump(out,open('CP121-CONSOLIDATED.json','w'),indent=2,sort_keys=True); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP121-CONSOLIDATED
          path: CP121-CONSOLIDATED.json
          retention-days: 30
