name: Fetch UploadNow package

on:
  push:
    branches:
      - automation/download-uploadnow-20260823
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare browser automation
        run: |
          set -euo pipefail
          mkdir -p downloaded diagnostics recovered-small reconstructed
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Capture the public package download URL without downloading 23 GB
        env:
          TARGET_URL: https://uploadnow.io/f/mFyDB1H
          CAPTURE_DOWNLOAD_URL_ONLY: '1'
        run: node tools/fetch-uploadnow.cjs

      - name: Inventory the remote ZIP through HTTP byte ranges
        run: python tools/inventory-remote-zip.py

      - name: Recover small canonical files and reconstruct the workstream backup
        run: python tools/extract-remote-zip.py

      - name: Publish verified source to isolated development branch
        env:
          TARGET_BRANCH: feature/rlf-execution-backend-20260823
        run: |
          set -euo pipefail
          source_dir="$PWD/reconstructed/RLF_WORKSTREAM_CONTROL_FULL_BACKUP_20260822"
          test -f "$source_dir/package.json"
          test -f "$source_dir/server/routers/workstreamRouter.ts"
          test -f "$source_dir/drizzle/schema.ts"

          staging="$(mktemp -d)"
          cp -a "$source_dir/." "$staging/"
          cat > "$staging/RECOVERY_PROVENANCE.md" <<'EOF'
          # RLF Workstream Control — Recovery provenance

          - Source share: `https://uploadnow.io/f/mFyDB1H`
          - Outer package: `GENERAL + KB.zip`
          - Outer package size: `23,404,142,579` bytes
          - Canonical split backup: `RLF_WORKSTREAM_CONTROL_FULL_BACKUP_20260822.zip.part00` … `.part09`
          - Reconstructed ZIP SHA-256: `a6ed9c5f68afd11d5b36f941a13fee027ca5cffccd0e9d19b34af072635c04b8`
          - Integrity gates: per-part SHA-256 verified, whole ZIP SHA-256 verified, ZIP CRC verified.
          - Recovery run: GitHub Actions selective HTTP Range extraction; the 23.4 GB outer archive was not copied into the repository.
          - Isolation rule: this branch was created without merging temporary retrieval PR #5.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$TARGET_BRANCH" origin/main
          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$staging/." .
          git add -A
          git commit -m "Recover verified RLF Workstream Control source"
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Remove ephemeral signed URLs from retained diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          root = Path('diagnostics')
          source = root / 'download-candidates.json'
          if source.is_file():
              records = json.loads(source.read_text(encoding='utf-8'))
              for record in records:
                  url = record.get('url')
                  if url:
                      parts = urlsplit(url)
                      record['url'] = urlunsplit((parts.scheme, parts.netloc, parts.path, 'REDACTED', ''))
              source.write_text(json.dumps(records, indent=2) + '\n', encoding='utf-8')
          (root / 'download-url.txt').unlink(missing_ok=True)
          PY

      - name: Inventory and hash retained evidence
        if: always()
        run: |
          set -euo pipefail
          find downloaded -type f -printf '%P\t%s bytes\n' | sort | tee diagnostics/download-inventory.tsv
          find recovered-small reconstructed -type f -printf '%p\t%s bytes\n' | sort > diagnostics/recovered-files-inventory.tsv
          find diagnostics recovered-small reconstructed -type f ! -name EVIDENCE_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > diagnostics/EVIDENCE_SHA256SUMS.txt
          find diagnostics -type f -printf '%P\t%s bytes\n' | sort > diagnostics/diagnostics-inventory.tsv

      - name: Upload verified selective recovery and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploadnow-mFyDB1H-selective-recovery
          path: |
            downloaded/**
            diagnostics/**
            recovered-small/**
            reconstructed/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
