name: RLF KB W003D physical evidence

on:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - tools/rlf_kb_w003d_physical_evidence.py
      - .github/workflows/rlf-kb-w003d-physical-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 curl_cffi pillow
      - name: Collect exact physical evidence
        run: python tools/rlf_kb_w003d_physical_evidence.py
      - name: Package auditable output
        run: zip -r RLF_KB_W003D_PHYSICAL_EVIDENCE_V1.zip w003d-physical-evidence
      - name: Upload W003D evidence package
        uses: actions/upload-artifact@v4
        with:
          name: RLF_KB_W003D_PHYSICAL_EVIDENCE_V1
          path: RLF_KB_W003D_PHYSICAL_EVIDENCE_V1.zip
          retention-days: 7
