name: RLF KB W002 official sitemap images

on:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - 'tools/rlf_kb_w002_official_sitemap_images.py'
      - 'data/kb/w001/RLF_KB_W001_TOP50_SEEDS.csv'
      - '.github/workflows/rlf-kb-w002-official-sitemap-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Recover official sitemap image evidence
        run: |
          python tools/rlf_kb_w002_official_sitemap_images.py \
            data/kb/w001/RLF_KB_W001_TOP50_SEEDS.csv \
            RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1
      - name: Package output
        run: |
          zip -r RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1.zip RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1
          sha256sum RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1.zip > RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1.zip.sha256
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1
          path: |
            RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1.zip
            RLF_KB_W002_OFFICIAL_SITEMAP_IMAGES_V1.zip.sha256
          if-no-files-found: error
          retention-days: 7
