name: RLF EU27 CP122 targeted repair L14 L27 resilient

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-eu27-cp122-repair-l14-l27-resilient.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [L14,L27]
    env:
      GH_TOKEN: ${{ github.token }}
      LANE: ${{ matrix.lane }}
      CP121_RUN: '33763764511'
    steps:
      - uses: actions/checkout@v4
      - name: Recover CP121 lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          gh run download "$CP121_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP121-LANE-$LANE" -D src
          test -f "src/$LANE.json"
      - name: Install geometry dependency resiliently
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if python3 -m pip install --disable-pip-version-check --retries 6 --timeout 120 -q shapely; then exit 0; fi
            sleep $((i*5))
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-shapely
          python3 -c 'import shapely; print(shapely.__version__)'
      - name: Execute CP122 X01-X07 targeted repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,re,html,time,hashlib,urllib.parse,urllib.request,ssl,random
          from pathlib import Path
          from urllib.parse import urlparse
          from shapely.geometry import shape,box,Point
          lane=os.environ['LANE']; lane_no=int(lane[1:]); a=json.load(open(f'src/{lane}.json',encoding='utf-8'))
          iso=a.get('iso'); city_id=a.get('city_id'); city_name=a.get('city_name'); zone_id=a.get('zone_id')
          UA='Mozilla/5.0 (compatible; RLF-EU27-CP122-REPAIR/1.0)';ctx=ssl.create_default_context()
          endpoints=['https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter','https://overpass.osm.ch/api/interpreter']
          def domain(v):
            if not v:return None
            try:
              u=str(v) if '://' in str(v) else 'https://'+str(v);h=(urlparse(u).hostname or '').lower().strip('.');return h[4:] if h.startswith('www.') else h
            except:return None
          seen_keys=set();seen_domains=set();excluded_names=set();excluded_domains=set()
          for key in ['candidates','enriched_candidates','new_identities']:
            for r in a.get(key) or []:
              if r.get('osm_key'):seen_keys.add(str(r['osm_key']))
              d=domain(r.get('domain') or r.get('canonical_domain_candidate') or r.get('website'))
              if d:seen_domains.add(d)
          for p in Path('data/supplier-census/canonical').glob('*.json'):
            try:o=json.load(open(p,encoding='utf-8'))
            except:continue
            for v in ([o.get('canonical_domain')] if o.get('canonical_domain') else [])+list(o.get('canonical_domains') or []):
              d=domain(v)
              if d:seen_domains.add(d)
          ex=Path('data/supplier-census/exclusions/canonical-rejection-ledger-2026-09-03.json')
          if ex.exists():
            eo=json.load(open(ex,encoding='utf-8'))
            for r in eo.get('entries') or []:
              if r.get('name'):excluded_names.add(str(r['name']).strip().lower())
              d=domain(r.get('domain'))
              if d:excluded_domains.add(d)
          def get_json(url,timeout=120):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,*/*'})
            with urllib.request.urlopen(req,timeout=timeout,context=ctx) as r:return json.loads(r.read())
          gj=get_json('https://gisco-services.ec.europa.eu/distribution/v2/lau/geojson/LAU_RG_01M_2024_4326.geojson')
          feat=next(f for f in gj['features'] if str((f.get('properties') or {}).get('LAU_ID') or (f.get('properties') or {}).get('GISCO_ID'))==str(city_id))
          g=shape(feat['geometry']);minx,miny,maxx,maxy=g.bounds;dx=(maxx-minx)/3;dy=(maxy-miny)/3;zmap={}
          for rr in range(1,4):
            for cc in range(1,4):
              z=g.intersection(box(minx+(cc-1)*dx,miny+(rr-1)*dy,minx+cc*dx,miny+rr*dy))
              if not z.is_empty and z.area>1e-15:zmap[f'{city_id}_G{rr}{cc}']=z
          zone=zmap[zone_id];minx,miny,maxx,maxy=zone.bounds;bb=f'{miny},{minx},{maxy},{maxx}'
          core='consignment|commission sale|kommission|kommissions|resale|re-sale|reuse|re-use|preowned|pre-owned|designer second|luxury second|vintage kilo|kilo shop|op shop|boutique solidaire|tienda solidaria|moda circular|roupa usada|odzież używana|seconda mano|friperie|kringloop|kirppis|kirpputori|loppis|gebrauchtkleidung|gebrauchte kleidung|kleidertausch|second hand mode|second-hand mode|preloved'
          social='humana|oxfam|caritas|carla|red cross|rotes kreuz|croix rouge|croce rossa|cruz roja|emmaus|emaus|remar|betel|vinzi|kringwinkel'
          vectors=[('X01',f'[out:json][timeout:45];nwr[shop=clothes][description~"{core}",i]({bb});out center tags;'),('X02',f'[out:json][timeout:45];nwr[shop=boutique][name~"{core}",i]({bb});out center tags;'),('X03',f'[out:json][timeout:45];nwr[description~"{core}",i]({bb});out center tags;'),('X04',f'[out:json][timeout:45];nwr[operator~"{social}",i]({bb});out center tags;'),('X05',f'[out:json][timeout:45];nwr[brand~"{social}",i]({bb});out center tags;'),('X06',f'[out:json][timeout:45];nwr[amenity=marketplace][name~"{core}",i]({bb});out center tags;'),('X07',f'[out:json][timeout:45];nwr[second_hand][shop!=second_hand][shop!=clothes]({bb});out center tags;')]
          def overpass(q,seed):
            errs=[];order=list(range(len(endpoints)));random.Random(12250+seed+lane_no).shuffle(order)
            for ep_i in order:
              ep=endpoints[ep_i]
              for method in ('POST','GET'):
                try:
                  if method=='POST':req=urllib.request.Request(ep,data=urllib.parse.urlencode({'data':q}).encode(),headers={'User-Agent':UA,'Accept':'application/json,*/*','Content-Type':'application/x-www-form-urlencoded'})
                  else:req=urllib.request.Request(ep+'?'+urllib.parse.urlencode({'data':q}),headers={'User-Agent':UA,'Accept':'application/json,*/*'})
                  with urllib.request.urlopen(req,timeout=70,context=ctx) as r:return json.loads(r.read()),ep,method,getattr(r,'status',200),errs
                except Exception as e:errs.append({'endpoint':ep,'method':method,'error':type(e).__name__+': '+str(e)})
            return None,None,None,None,errs[-8:]
          merged={};records=[];technical=False
          for i,(vid,q) in enumerate(vectors):
            data,ep,method,status,errs=overpass(q,i)
            if data is None:technical=True;records.append({'vector':vid,'status':'TECHNICAL_FAILURE_NO_CREDIT','errors':errs});continue
            total=fresh=0
            for el in data.get('elements',[]):
              lat=el.get('lat');lon=el.get('lon');cen=el.get('center') or {};lat=lat if lat is not None else cen.get('lat');lon=lon if lon is not None else cen.get('lon')
              if lat is None or lon is None:continue
              lat=float(lat);lon=float(lon)
              if not zone.covers(Point(lon,lat)):continue
              total+=1;t=el.get('tags') or {};key=f"{el.get('type')}:{el.get('id')}";name=str(t.get('name') or '').strip();web=t.get('website') or t.get('contact:website');d=domain(web)
              if key in seen_keys or (d and d in seen_domains) or (d and d in excluded_domains) or (name and name.lower() in excluded_names):continue
              fresh+=1;rec=merged.setdefault(key,{'osm_key':key,'name':name or None,'website':web,'domain':d,'phone':t.get('phone') or t.get('contact:phone'),'email':t.get('email') or t.get('contact:email'),'operator':t.get('operator'),'brand':t.get('brand'),'shop':t.get('shop'),'second_hand':t.get('second_hand'),'description':t.get('description'),'lat':lat,'lon':lon,'vectors':[]});rec['vectors'].append(vid)
            records.append({'vector':vid,'status':'SUCCESS','in_zone':total,'fresh_after_master_dedup':fresh,'endpoint':ep,'method':method,'http_status':status})
          rows=list(merged.values());rows.sort(key=lambda r:(0 if r.get('website') else 1,str(r.get('name') or '').lower()));rows=rows[:14]
          out={'schema':'RLF_EU27_CP122_TARGETED_REPAIR_V1','lane_id':lane,'iso':iso,'city_id':city_id,'city_name':city_name,'zone_id':zone_id,'source_checkpoint':'CP121','vector_family':'CP122_X01_X07','query_records':records,'fresh_identities_discovered':len(merged),'candidates':rows,'technical_failure':technical,'geometry_status':'GISCO_GRID_PASS','canonical_delta':0,'automatic_promotion_prohibited':True,'territorial_credit':'NONE_SUPPLEMENTAL_DISCOVERY_ONLY','quality':'AAA_FAIL_CLOSED'}
          out['sha256']=hashlib.sha256(json.dumps(out,sort_keys=True,ensure_ascii=False).encode()).hexdigest();Path('out').mkdir(exist_ok=True);json.dump(out,open(f'out/{lane}.json','w',encoding='utf-8'),ensure_ascii=False,indent=2);print(json.dumps({'lane':lane,'fresh':len(merged),'technical':technical}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP122-REPAIR-${{ matrix.lane }}
          path: out/${{ matrix.lane }}.json
          retention-days: 30
