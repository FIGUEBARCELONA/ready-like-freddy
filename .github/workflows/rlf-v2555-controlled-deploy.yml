name: RLF v25.55 Controlled Deploy

on:
  push:
    branches: [rlf-v2555-sweep-once-v2556]
    paths:
      - '.github/deploy/RLF_V25_55_CONTROLLED_DEPLOY.json'

permissions:
  contents: read

concurrency:
  group: rlf-parallel50-production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_fhf0Woa7HxognliF2TaI3zsq
      VERCEL_PROJECT_ID: prj_KIU3Yvscq5uryndAt1VH3u2oP4gu
      VERCEL_SCOPE: jordifiguerassolerpersonal-2224s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD_URL: https://rlf-parallel50-runtime.vercel.app
      SENTINEL: .github/deploy/RLF_V25_55_CONTROLLED_DEPLOY.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate immutable release descriptor
        id: release
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const p=process.env.SENTINEL;
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!/^[0-9a-f]{40}$/.test(j.targetSha||'')) throw new Error('invalid targetSha');
          if(!/^25\.55\.\d+(?:-r\d+)?$/.test(j.expectedVersion||'')) throw new Error('invalid expectedVersion');
          if(!['ARMED','CLOSED'].includes(j.expectedOneShotState)) throw new Error('invalid expectedOneShotState');
          console.log(`target_sha=${j.targetSha}`);
          console.log(`expected_version=${j.expectedVersion}`);
          console.log(`expected_one_shot=${j.expectedOneShotState}`);
          NODE

      - name: Enforce target provenance and app immutability
        env:
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        shell: bash
        run: |
          git merge-base --is-ancestor "$TARGET_SHA" "$GITHUB_SHA"
          test -z "$(git diff --name-only "$TARGET_SHA" "$GITHUB_SHA" -- apps/rlf-parallel50-v25-52)"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install verified dependency graph
        working-directory: apps/rlf-parallel50-v25-52
        run: npm install --ignore-scripts --no-fund

      - name: Re-run strict gates and Workflow manifest contract
        working-directory: apps/rlf-parallel50-v25-52
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit
          npm run build 2>&1 | tee workflow-build.log
          grep -F '6 steps, 2 workflows' workflow-build.log
          npm audit --audit-level=moderate

      - name: Require deployment credential
        run: test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN secret is not configured'; exit 1; }

      - name: Pull production project settings
        working-directory: apps/rlf-parallel50-v25-52
        run: npx vercel@58.4.4 pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Build Vercel production output
        working-directory: apps/rlf-parallel50-v25-52
        run: npx vercel@58.4.4 build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"

      - name: Deploy exact prebuilt output to production
        working-directory: apps/rlf-parallel50-v25-52
        run: npx vercel@58.4.4 deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" | tail -n 1 | tee deployment-url.txt

      - name: Verify production truth boundary
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.expected_version }}
          EXPECTED_ONE_SHOT: ${{ steps.release.outputs.expected_one_shot }}
        working-directory: apps/rlf-parallel50-v25-52
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error "$PROD_URL/api/health" -o health.json && node - <<'NODE'
          const h=require('./health.json');
          if(h.version!==process.env.EXPECTED_VERSION)process.exit(1);
          if(h.oneShotSweep!==process.env.EXPECTED_ONE_SHOT)process.exit(1);
          if(h.delta!=='0051'||h.parallelism!==50||h.dependencyAudit?.total!==0||h.simulatedWorkersStarted!==0)process.exit(1);
          NODE
            then break; fi
            test "$i" -lt 30
            sleep 3
          done
          CODE=$(curl --silent --output invalid-capability.json --write-out '%{http_code}' "$PROD_URL/api/one-shot/invalid-capability-check")
          test "$CODE" = '404'

      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v2555-controlled-production-deployment
          path: |
            apps/rlf-parallel50-v25-52/deployment-url.txt
            apps/rlf-parallel50-v25-52/health.json
            apps/rlf-parallel50-v25-52/invalid-capability.json
            apps/rlf-parallel50-v25-52/workflow-build.log
          retention-days: 14
