name: RLF execution run index

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - 'data/execution/rlf-kb-official-seeds.json'
      - 'data/execution/rlf-kb-run-plan.json'

permissions:
  actions: read
  contents: write

concurrency:
  group: rlf-run-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Resolve sibling 50-worker run
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=''
          for attempt in $(seq 1 24); do
            run_json="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "RLF 50-worker KB official discovery")][0] // empty')"
            if [[ -n "$run_json" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$run_json" ]]; then
            echo 'Unable to resolve the sibling 50-worker run' >&2
            exit 1
          fi
          printf '%s\n' "$run_json" > /tmp/run.json
          printf 'run_id=%s\n' "$(jq -r '.id' /tmp/run.json)" >> "$GITHUB_OUTPUT"
      - name: Publish immutable run pointer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/execution
          node - <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('/tmp/run.json', 'utf8'));
          const pointer = {
            schemaVersion: 1,
            indexedAt: new Date().toISOString(),
            sourceCommitSha: process.env.GITHUB_SHA,
            workflowName: run.name,
            workflowId: run.workflow_id,
            runId: String(run.id),
            runNumber: run.run_number,
            runAttempt: run.run_attempt,
            event: run.event,
            status: run.status,
            conclusion: run.conclusion,
            createdAt: run.created_at,
            updatedAt: run.updated_at,
            htmlUrl: run.html_url,
            headBranch: run.head_branch,
            headSha: run.head_sha,
          };
          fs.writeFileSync('data/execution/live-run.json', `${JSON.stringify(pointer, null, 2)}\n`);
          NODE
          git pull --rebase origin feature/rlf-execution-backend-20260823
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/live-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Index RLF execution run ${{ steps.resolve.outputs.run_id }}"
          git push origin HEAD:feature/rlf-execution-backend-20260823
