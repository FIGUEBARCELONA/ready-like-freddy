name: Temporary UploadNow retrieval

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch:
    if: github.head_ref == 'automation/download-uploadnow-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare browser automation
        run: |
          mkdir -p downloaded diagnostics
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Fetch package
        env:
          TARGET_URL: https://uploadnow.io/files/mFyDB1H
        run: node tools/fetch-uploadnow.cjs

      - name: Inventory and hash downloaded bytes
        if: always()
        run: |
          find downloaded -type f -printf '%P\t%s bytes\n' | sort | tee diagnostics/download-inventory.tsv
          if find downloaded -type f -print -quit | grep -q .; then
            find downloaded -type f -print0 | sort -z | xargs -0 sha256sum | tee diagnostics/SHA256SUMS.txt
          fi

      - name: Upload fetched package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploadnow-mFyDB1H-fetched
          path: |
            downloaded/**
            diagnostics/**
          if-no-files-found: warn
          retention-days: 3
