name: RLF v2.34 WordPress 7.0.3 supply relay

on:
  push:
    branches:
      - runtime-supply-relay-20260811
    paths:
      - '.github/workflows/runtime-supply-relay-v234.yml'

permissions:
  contents: read

jobs:
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acquire WordPress 7.0.3 and record observed integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supply
          url='https://wordpress.org/wordpress-7.0.3.zip'
          curl --fail --location --retry 4 --retry-all-errors "$url" -o supply/wordpress-7.0.3.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,zipfile
          p=Path('supply/wordpress-7.0.3.zip')
          b=p.read_bytes()
          observed={
              'filename':p.name,
              'size_bytes':p.stat().st_size,
              'md5':hashlib.md5(b).hexdigest(),
              'sha1':hashlib.sha1(b).hexdigest(),
              'sha256':hashlib.sha256(b).hexdigest(),
          }
          assert observed['size_bytes'] == 31436439
          assert observed['md5'] == 'b76609b2cdc7b9e9b7dbda951a0cb05e'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              v=z.read('wordpress/wp-includes/version.php').decode('utf-8','replace')
              assert re.search(r"\$wp_version\s*=\s*['\"]7\.0\.3['\"]\s*;",v)
              z.getinfo('wordpress/wp-load.php')
          Path('supply/OBSERVED_HASHES.json').write_text(json.dumps(observed,indent=2,sort_keys=True)+'\n')
          Path('supply/SHA256SUMS.txt').write_text(f"{observed['sha256']}  {p.name}\n")
          print(json.dumps(observed,sort_keys=True))
          PY
          printf '%s\n' "$url" > supply/SOURCE_URL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v234-wordpress-7.0.3-observed-official
          path: supply
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
