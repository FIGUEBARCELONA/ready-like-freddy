name: RLF v2.34 runtime supply relay

on:
  push:
    branches:
      - runtime-supply-relay-20260811
    paths:
      - '.github/workflows/runtime-supply-relay-v234.yml'

permissions:
  contents: read

jobs:
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acquire exact official WordPress 7.0.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supply
          url='https://wordpress.org/wordpress-7.0.3.zip'
          curl --fail --location --retry 4 --retry-all-errors "$url" -o supply/wordpress-7.0.3.zip
          test "$(stat -c '%s' supply/wordpress-7.0.3.zip)" = '31436439'
          printf '%s  %s\n' 'b76609b2cdc7b9e9b7dbda951a0cb05e' 'supply/wordpress-7.0.3.zip' | md5sum -c -
          printf '%s  %s\n' 'ccfd5109f9f87d7639a874e19bcac717b6ad1795e' 'supply/wordpress-7.0.3.zip' | sha1sum -c -
          unzip -tq supply/wordpress-7.0.3.zip
          unzip -p supply/wordpress-7.0.3.zip wordpress/wp-includes/version.php | grep -Eq "\\$wp_version[[:space:]]*=[[:space:]]*'7\\.0\\.3'"
          printf '%s\n' "$url" > supply/SOURCE_URL.txt
          sha256sum supply/wordpress-7.0.3.zip > supply/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v234-wordpress-7.0.3-official
          path: supply
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  woocommerce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acquire exact official WooCommerce 11.0.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supply
          url='https://github.com/woocommerce/woocommerce/releases/download/11.0.1/woocommerce.zip'
          curl --fail --location --retry 4 --retry-all-errors "$url" -o supply/woocommerce.11.0.1.zip
          test "$(stat -c '%s' supply/woocommerce.11.0.1.zip)" = '20521356'
          printf '%s  %s\n' '88837ea0504544fdb835078d39c68c6c4abde00cdb4af8f67027255ee8ae494c' 'supply/woocommerce.11.0.1.zip' | sha256sum -c -
          unzip -tq supply/woocommerce.11.0.1.zip
          unzip -p supply/woocommerce.11.0.1.zip woocommerce/woocommerce.php | grep -Eq '^[[:space:]]*\\*?[[:space:]]*Version:[[:space:]]*11\\.0\\.1[[:space:]]*$'
          printf '%s\n' "$url" > supply/SOURCE_URL.txt
          sha256sum supply/woocommerce.11.0.1.zip > supply/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v234-woocommerce-11.0.1-official
          path: supply
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Acquire exact official MariaDB 11.8.8 x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supply
          file='mariadb-11.8.8-linux-systemd-x86_64.tar.gz'
          url="https://downloads.mariadb.org/rest-api/mariadb/11.8.8/${file}"
          curl --fail --location --retry 4 --retry-all-errors "$url" -o "supply/${file}"
          test "$(stat -c '%s' "supply/${file}")" = '429017672'
          printf '%s  %s\n' 'fbd4e8d05946c974b0560c94f01ce4c687291b6528074c2e001fb8f35c0d2762' "supply/${file}" | sha256sum -c -
          tar -tzf "supply/${file}" > supply/TAR_CONTENTS.txt
          grep -Eq 'mariadb-11\\.8\\.8[^/]*/bin/(mariadbd|mysqld)$' supply/TAR_CONTENTS.txt
          grep -Eq 'mariadb-11\\.8\\.8[^/]*/bin/(mariadb|mysql)$' supply/TAR_CONTENTS.txt
          grep -Eq 'mariadb-11\\.8\\.8[^/]*/(scripts|bin)/(mariadb-install-db|mysql_install_db)$' supply/TAR_CONTENTS.txt
          printf '%s\n' "$url" > supply/SOURCE_URL.txt
          sha256sum "supply/${file}" > supply/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v234-mariadb-11.8.8-linux-x64-official
          path: supply
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  languages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acquire exact official WordPress 7.0.3 CA and ES language packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supply
          ca='https://downloads.wordpress.org/translation/core/7.0.3/ca.zip'
          es='https://downloads.wordpress.org/translation/core/7.0.3/es_ES.zip'
          curl --fail --location --retry 4 --retry-all-errors "$ca" -o supply/wordpress-core-7.0.3-ca.zip
          curl --fail --location --retry 4 --retry-all-errors "$es" -o supply/wordpress-core-7.0.3-es_ES.zip
          unzip -tq supply/wordpress-core-7.0.3-ca.zip
          unzip -tq supply/wordpress-core-7.0.3-es_ES.zip
          unzip -Z1 supply/wordpress-core-7.0.3-ca.zip > supply/ca-contents.txt
          unzip -Z1 supply/wordpress-core-7.0.3-es_ES.zip > supply/es_ES-contents.txt
          grep -Eq '(^|/)ca\\.(mo|po)$' supply/ca-contents.txt
          grep -Eq '(^|/)es_ES\\.(mo|po)$' supply/es_ES-contents.txt
          printf '%s\n%s\n' "$ca" "$es" > supply/SOURCE_URLS.txt
          sha256sum supply/wordpress-core-7.0.3-ca.zip supply/wordpress-core-7.0.3-es_ES.zip > supply/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v234-wordpress-7.0.3-languages-ca-es_ES-official
          path: supply
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  php_mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Acquire exact official Debian php8.4-mysql package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supply
          file='php8.4-mysql_8.4.23-1~deb13u1_amd64.deb'
          url="https://ftp.debian.org/debian/pool/main/p/php8.4/${file}"
          curl --fail --location --retry 4 --retry-all-errors "$url" -o "supply/${file}"
          test "$(stat -c '%s' "supply/${file}")" = '119688'
          test "$(dpkg-deb -f "supply/${file}" Package)" = 'php8.4-mysql'
          test "$(dpkg-deb -f "supply/${file}" Version)" = '8.4.23-1~deb13u1'
          test "$(dpkg-deb -f "supply/${file}" Architecture)" = 'amd64'
          dpkg-deb -c "supply/${file}" > supply/PAYLOAD.txt
          for required in \
            './usr/lib/php/20240924/mysqli.so' \
            './usr/lib/php/20240924/mysqlnd.so' \
            './usr/lib/php/20240924/pdo_mysql.so' \
            './usr/share/php8.4-mysql/mysql/mysqli.ini' \
            './usr/share/php8.4-mysql/mysql/mysqlnd.ini' \
            './usr/share/php8.4-mysql/mysql/pdo_mysql.ini'; do
            grep -Fq "$required" supply/PAYLOAD.txt
          done
          printf '%s\n' "$url" > supply/SOURCE_URL.txt
          sha256sum "supply/${file}" > supply/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-v234-php8.4-mysql-8.4.23-debian13-amd64-official
          path: supply
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
