name: RLF recover sequence 10 audited delta

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-recover-sequence10.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: rlf-recover-sequence10
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '32754804084'
  SOURCE_HEAD_SHA: 'cdd8e0cd0521ebd5dce8b9599db36698ab8ab1c5'
  PRODUCT_ARTIFACT_ID: '9530679835'
  PRODUCT_ARTIFACT_NAME: 'rlf-kb-product-pages-32754804084'
  PRODUCT_ARTIFACT_DIGEST: 'sha256:9501521a11541212f6fda66b61919f96b8982ea36dc634df0bbaf7179fc899b7'
  DISCOVERY_ARTIFACT_ID: '9530611276'
  DISCOVERY_ARTIFACT_NAME: 'rlf-kb-official-discovery-32754804084'
  DISCOVERY_ARTIFACT_DIGEST: 'sha256:d9f11351a7f08578e23d4a6d69c7962ec1a00e0c178d398e5aa1a3416f890078'
  SOURCE_BRANCH: 'feature/rlf-execution-backend-20260823'

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRODUCT_ARTIFACT_ID}" > /tmp/product-artifact.json
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DISCOVERY_ARTIFACT_ID}" > /tmp/discovery-artifact.json
          jq -e --arg name "$PRODUCT_ARTIFACT_NAME" --arg digest "$PRODUCT_ARTIFACT_DIGEST" '.name == $name and .digest == $digest and .expired == false and (.workflow_run.id | tostring) == "32754804084" and .workflow_run.head_sha == "cdd8e0cd0521ebd5dce8b9599db36698ab8ab1c5"' /tmp/product-artifact.json
          jq -e --arg name "$DISCOVERY_ARTIFACT_NAME" --arg digest "$DISCOVERY_ARTIFACT_DIGEST" '.name == $name and .digest == $digest and .expired == false and (.workflow_run.id | tostring) == "32754804084" and .workflow_run.head_sha == "cdd8e0cd0521ebd5dce8b9599db36698ab8ab1c5"' /tmp/discovery-artifact.json
      - name: Download exact source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf recovery
          mkdir -p recovery/product recovery/discovery
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PRODUCT_ARTIFACT_NAME" --dir recovery/product
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$DISCOVERY_ARTIFACT_NAME" --dir recovery/discovery
          test -f recovery/product/products-consolidated/product-manifest.json
          test -f recovery/product/products-consolidated/product-progress-delta.json
          test -f recovery/discovery/consolidated/product-frontier.json
          test -f recovery/discovery/consolidated/manifest.json
      - name: Verify source hashes, counts and strict evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';

          const sha256 = value => createHash('sha256').update(value).digest('hex');
          const readVerifiedJson = async (path, expectedFileSha, hashField, expectedLogicalSha) => {
            const bytes = await readFile(path);
            const fileSha = sha256(bytes);
            if (fileSha !== expectedFileSha) throw new Error(`${path} file SHA mismatch: ${fileSha}`);
            const value = JSON.parse(bytes.toString('utf8'));
            const unsigned = { ...value };
            delete unsigned[hashField];
            const logicalSha = sha256(Buffer.from(JSON.stringify(unsigned)));
            if (logicalSha !== expectedLogicalSha || value[hashField] !== expectedLogicalSha) {
              throw new Error(`${path} logical SHA mismatch: ${logicalSha}/${value[hashField]}`);
            }
            return value;
          };

          const productManifest = await readVerifiedJson(
            'recovery/product/products-consolidated/product-manifest.json',
            'd6fa5c7ae6bbece1f45109e178b923b4c59dbf14018c1c403526dbfd236ee528',
            'manifestSha256',
            '50df3facfc853058cd952cd6fbd137704393cb7ac04c9d774e4aeb4e6cb19c5d',
          );
          const sourceDelta = await readVerifiedJson(
            'recovery/product/products-consolidated/product-progress-delta.json',
            '550a8288cfc26821a5131a722c2f2539b74b83415b6b31d24222109bc4996d92',
            'deltaSha256',
            '039339f0a2a641efc9bfe62f630fcfcaa0769bffa19caa68a5f126280f6e3793',
          );
          const discoveryManifest = await readVerifiedJson(
            'recovery/discovery/consolidated/manifest.json',
            'c0f35d87d7663d7955ffb13018bfb826f4fade64043ebe32b325565b712fbbb7',
            'manifestSha256',
            '6d67fe75bf34fe1958f1014e85bf0023653283fa9f1156c306f1dd8c10b39095',
          );
          const frontierBytes = await readFile('recovery/discovery/consolidated/product-frontier.json');
          if (sha256(frontierBytes) !== '6dd11f19918a0981ef47b1191f6399ee16ee46310db4c4a6678b23a123eefee1') {
            throw new Error('Product frontier file SHA mismatch');
          }
          const frontier = JSON.parse(frontierBytes.toString('utf8'));
          const prior = await loadProgressLedger();
          const selectedKeys = frontier.assignments.flatMap(item => item.products.map(product => product.identityKey));
          const completed = sourceDelta.completedIdentityKeys;
          const failed = sourceDelta.failedIdentities.map(item => item.identityKey);
          const accounted = [...completed, ...failed].sort();
          if (String(productManifest.runId) !== '32754804084' || String(sourceDelta.runId) !== '32754804084') throw new Error('Source run ID mismatch');
          if (productManifest.workerCount !== 50 || productManifest.workerSummaries.length !== 50) throw new Error('Product manifest is not 50/50');
          if (!discoveryManifest.qualityGatePassed || discoveryManifest.workerCount !== 50 || discoveryManifest.workerSummaries.length !== 50) throw new Error('Discovery manifest is not a valid 50/50 result');
          if (frontier.frontierSha256 !== 'ab0eebcb27357d170f3b1b4b008a98cbfadac1f095e97ba43c78f89386f18422') throw new Error('Frontier logical SHA claim mismatch');
          if (frontier.selectedIdentitySha256 !== '8e5a84cde6686bc1754d35fc21525c324ea89cde5c22e3a521560bbbfdf203e4') throw new Error('Selected identity SHA mismatch');
          if (frontier.progressSha256 !== '0297f280d1d7a66622ee30c5f26f3dd04e85bd066cfffdea527018716ac544c1') throw new Error('Frontier prior ledger SHA mismatch');
          if (prior.ledgerSha256 !== frontier.progressSha256 || prior.completed.identityCount !== 1001 || prior.deltaCount !== 4) throw new Error('Current prior ledger is not the source ledger');
          if (frontier.selectedIdentityCount !== 55 || selectedKeys.length !== 55 || new Set(selectedKeys).size !== 55) throw new Error('Selected frontier count mismatch');
          if (completed.length !== 53 || failed.length !== 2 || new Set(completed).size !== 53 || new Set(failed).size !== 2) throw new Error('Strict batch count mismatch');
          if (JSON.stringify(accounted) !== JSON.stringify([...selectedKeys].sort())) throw new Error('Completed and failed identities do not exactly cover the selected frontier');
          if (completed.some(key => prior.completed.identityKeys.includes(key))) throw new Error('Recovered completions overlap the prior ledger');
          if (JSON.stringify([...failed].sort()) !== JSON.stringify(['B2328|560', 'HW2300|843'])) throw new Error('Retry identities differ from the audited source');
          if (sourceDelta.capturedProductUrlCount !== 66) throw new Error('Captured URL count mismatch');
          if (sourceDelta.counters.officialProductImageReferenceCount !== 424 || sourceDelta.counters.materialEvidenceCount !== 51 || sourceDelta.counters.manufacturingClaimCount !== 0) throw new Error('Evidence counters mismatch');
          if (productManifest.totals.rejectedImageReferenceCount !== 0) throw new Error('Rejected image references detected');
          console.log(JSON.stringify({runId: sourceDelta.runId, completed: completed.length, failed: failed.length, selected: selectedKeys.length, priorLedgerSha256: prior.ledgerSha256}, null, 2));
          NODE
      - name: Generate canonical audited ledger delta
        shell: bash
        run: |
          set -euo pipefail
          node scripts/execution/generate-ledger-delta.mjs \
            --products=recovery/product/products-consolidated \
            --frontier=recovery/discovery/consolidated/product-frontier.json \
            --progress=data/execution/product-progress.json \
            --progressDeltas=data/execution/progress-deltas \
            --out=recovery/product/products-consolidated/ledger-delta.json \
            --audit=recovery/product/products-consolidated/ledger-delta-audit.json
          node - <<'NODE'
          const delta = require('./recovery/product/products-consolidated/ledger-delta.json');
          const audit = require('./recovery/product/products-consolidated/ledger-delta-audit.json');
          if (delta.completedIdentityKeys.length !== 53 || delta.failedIdentities.length !== 2) throw new Error('Canonical delta count mismatch');
          if (delta.acceptance !== 'PARTIAL_STRICT_EVIDENCE_53_COMPLETE_2_RETRY') throw new Error(`Unexpected acceptance: ${delta.acceptance}`);
          if (!audit.passed || audit.batch.overlapWithPrior.length || audit.batch.completedAndFailedOverlap.length) throw new Error('Canonical audit failed');
          if (audit.projectedLedger.completedIdentityCount !== 1054 || audit.projectedLedger.retryIdentityCount !== 2) throw new Error('Projected ledger mismatch');
          console.log(JSON.stringify({ledgerDeltaSha256: delta.ledgerDeltaSha256, projectedLedger: audit.projectedLedger}, null, 2));
          NODE
      - name: Stage immutable recovery and rebuild cumulative ledger
        shell: bash
        run: |
          set -euo pipefail
          destination="data/execution/runs/${SOURCE_RUN_ID}"
          delta_destination="data/execution/progress-deltas/${SOURCE_RUN_ID}.json"
          if [[ -e "$delta_destination" || -e "$destination" ]]; then
            echo "Sequence ${SOURCE_RUN_ID} is already persisted; refusing a second write" >&2
            exit 1
          fi
          mkdir -p "$destination" "$(dirname "$delta_destination")"
          cp recovery/product/products-consolidated/product-manifest.json "$destination/product-manifest.json"
          cp recovery/product/products-consolidated/product-progress-delta.json "$destination/product-progress-delta.json"
          cp recovery/product/products-consolidated/product-records.ndjson "$destination/product-records.ndjson"
          cp recovery/product/products-consolidated/image-manifest.ndjson "$destination/image-manifest.ndjson"
          cp recovery/product/products-consolidated/duplicate-product-captures.json "$destination/duplicate-product-captures.json"
          cp recovery/product/products-consolidated/ledger-delta.json "$destination/ledger-delta.json"
          cp recovery/product/products-consolidated/ledger-delta-audit.json "$destination/ledger-delta-audit.json"
          cp recovery/discovery/consolidated/manifest.json "$destination/discovery-manifest.json"
          cp recovery/discovery/consolidated/product-frontier.json "$destination/product-frontier.json"
          cp recovery/product/products-consolidated/ledger-delta.json "$delta_destination"
          node --input-type=module - <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          const state = await loadProgressLedger();
          const expected = {
            identityCount: 1054,
            productUrlCaptureCount: 1707,
            imageCount: 9271,
            materialCount: 1383,
            manufacturingClaimCount: 59,
            descriptionMissing: 523,
            priceMissing: 467,
            materialMissing: 68,
            retryKeys: ['B2328|560', 'HW2300|843'],
            deltaCount: 5,
          };
          const actual = {
            identityCount: state.completed.identityCount,
            productUrlCaptureCount: state.completed.productUrlCaptureCount,
            imageCount: state.counters.officialProductImageReferenceCount,
            materialCount: state.counters.materialEvidenceCount,
            manufacturingClaimCount: state.counters.manufacturingClaimCount,
            descriptionMissing: state.metadataGaps.descriptionMissingIdentityCount,
            priceMissing: state.metadataGaps.priceMissingIdentityCount,
            materialMissing: state.metadataGaps.materialMissingIdentityCount,
            retryKeys: state.retry.identities.map(item => item.identityKey).sort(),
            deltaCount: state.deltaCount,
            latestRunId: String(state.latestRunId),
            factoryVerifiedCount: state.counters.factoryVerifiedCount,
            globalCanonicalProductCount: state.counters.globalCanonicalProductCount,
            ledgerSha256: state.ledgerSha256,
          };
          const mismatches = [];
          for (const key of ['identityCount','productUrlCaptureCount','imageCount','materialCount','manufacturingClaimCount','descriptionMissing','priceMissing','materialMissing','deltaCount']) {
            if (actual[key] !== expected[key]) mismatches.push([key, actual[key], expected[key]]);
          }
          if (JSON.stringify(actual.retryKeys) !== JSON.stringify(expected.retryKeys)) mismatches.push(['retryKeys', actual.retryKeys, expected.retryKeys]);
          if (actual.latestRunId !== '32754804084') mismatches.push(['latestRunId', actual.latestRunId, '32754804084']);
          if (actual.factoryVerifiedCount !== 0) mismatches.push(['factoryVerifiedCount', actual.factoryVerifiedCount, 0]);
          if (actual.globalCanonicalProductCount !== 0) mismatches.push(['globalCanonicalProductCount', actual.globalCanonicalProductCount, 0]);
          const checkpoint = {
            schemaVersion: 1,
            sourceRunId: '32754804084',
            recoveredAt: new Date().toISOString(),
            sourceHeadSha: 'cdd8e0cd0521ebd5dce8b9599db36698ab8ab1c5',
            sourceArtifacts: {
              product: {id: 9530679835, digest: 'sha256:9501521a11541212f6fda66b61919f96b8982ea36dc634df0bbaf7179fc899b7'},
              discovery: {id: 9530611276, digest: 'sha256:d9f11351a7f08578e23d4a6d69c7962ec1a00e0c178d398e5aa1a3416f890078'},
            },
            expected,
            actual,
            mismatches,
            passed: mismatches.length === 0,
          };
          await writeFile('data/execution/runs/32754804084/recovery-checkpoint.json', `${JSON.stringify(checkpoint, null, 2)}\n`);
          if (mismatches.length) throw new Error(`Recovered ledger mismatch: ${JSON.stringify(mismatches)}`);
          console.log(JSON.stringify(checkpoint, null, 2));
          NODE
      - name: Commit recovered immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/execution/runs/${SOURCE_RUN_ID}" "data/execution/progress-deltas/${SOURCE_RUN_ID}.json"
          git commit -m "Recover and persist audited RLF sequence 10 run ${SOURCE_RUN_ID}"
          git fetch origin "$SOURCE_BRANCH"
          git rebase "origin/$SOURCE_BRANCH"
          git push origin "HEAD:$SOURCE_BRANCH"
