name: RLF Hamburg authoritative 3x3 grid manifest
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rlf-hamburg-grid-manifest.yml']
permissions:
  contents: read
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Materialize all non-empty Hamburg grid cells
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q shapely pyproj
          curl -fsSL 'https://raw.githubusercontent.com/euraf/eu-nuts-lau/main/v1/DE/DE600_LAU_RG_01M_2024_4326.geojson' -o hamburg.geojson
          python3 - <<'PY'
          import json,hashlib
          from shapely.geometry import shape,box,mapping
          from pyproj import Geod
          src=json.load(open('hamburg.geojson')); f=src['features'][0]; g=shape(f['geometry']); minx,miny,maxx,maxy=g.bounds; dx=(maxx-minx)/3;dy=(maxy-miny)/3; geod=Geod(ellps='WGS84')
          cells=[]
          for r in range(1,4):
            for c in range(1,4):
              zone=f'G{r}{c}'; b=[minx+(c-1)*dx,miny+(r-1)*dy,minx+c*dx,miny+r*dy]; clip=g.intersection(box(*b))
              if clip.is_empty or clip.area==0: continue
              area,per=geod.geometry_area_perimeter(clip)
              obj={'type':'FeatureCollection','features':[{'type':'Feature','properties':{'zone_id':f'DE_02000000_{zone}','zone_name':f'Grid {r}-{c}','zone_order':(r-1)*3+c,'grid_bbox':b,'geodesic_area_km2':abs(area)/1e6,'geodesic_perimeter_km':per/1000,'source':'Eurostat/GISCO LAU 2024 via euraf mirror','method':'canonical 3x3 bbox cell clipped to Hamburg LAU 2024'},'geometry':mapping(clip)}]}
              raw=json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode();obj['features'][0]['properties']['sha256']=hashlib.sha256(raw).hexdigest()
              json.dump(obj,open(f'DE_02000000_{zone}_AUTHORITATIVE_CLIP_2024.geojson','w'),ensure_ascii=False,indent=2)
              cells.append(obj['features'][0]['properties'])
          manifest={'city_id':'DE_02000000','city_name':f['properties']['LAU_NAME'],'population_2024':f['properties']['POP_2024'],'berlin_previous_city_closed':True,'source_bounds':[minx,miny,maxx,maxy],'nonempty_cell_count':len(cells),'cells':cells,'first_nonempty_zone':cells[0]['zone_id'] if cells else None}
          manifest['sha256']=hashlib.sha256(json.dumps(manifest,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest();json.dump(manifest,open('HAMBURG_GRID_MANIFEST.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Upload grid manifest
        uses: actions/upload-artifact@v4
        with:
          name: RLF-HAMBURG-AUTHORITATIVE-GRID-MANIFEST
          path: |
            HAMBURG_GRID_MANIFEST.json
            DE_02000000_G*_AUTHORITATIVE_CLIP_2024.geojson
          retention-days: 7
