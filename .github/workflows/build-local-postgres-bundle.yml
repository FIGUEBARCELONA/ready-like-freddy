name: Build local PostgreSQL bundle

on:
  push:
    paths:
      - '.github/workflows/build-local-postgres-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  POSTGRES_VERSION: '17.10.0'
  PSYCOPG_VERSION: '3.3.4'

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/postgresql bundle/wheels
          curl --fail --location --retry 3 \
            "https://github.com/theseus-rs/postgresql-binaries/releases/download/${POSTGRES_VERSION}/postgresql-${POSTGRES_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o postgresql.tar.gz
          tar -xzf postgresql.tar.gz -C bundle/postgresql --strip-components=1
          python -m pip download --only-binary=:all: --dest bundle/wheels \
            "psycopg[binary]==${PSYCOPG_VERSION}"
          bundle/postgresql/bin/postgres --version
          bundle/postgresql/bin/initdb --version
          bundle/postgresql/bin/pg_ctl --version
          bundle/postgresql/bin/psql --version
          bundle/postgresql/bin/pg_dump --version
          bundle/postgresql/bin/pg_restore --version
          find bundle -type f -print0 | sort -z | xargs -0 sha256sum > bundle/SHA256SUMS.txt
          cat > bundle/PROVENANCE.txt <<EOF
          PostgreSQL binaries: theseus-rs/postgresql-binaries ${POSTGRES_VERSION}
          Source URL: https://github.com/theseus-rs/postgresql-binaries/releases/tag/${POSTGRES_VERSION}
          Psycopg wheels: PyPI ${PSYCOPG_VERSION}
          Build runner: GitHub Actions ubuntu-24.04
          EOF
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: rlf-local-postgres-linux-x64
          path: bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
