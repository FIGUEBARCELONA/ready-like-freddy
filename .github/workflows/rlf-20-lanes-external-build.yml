name: RLF 20 Lanes Verified External Build

on:
  push:
    branches:
      - ci/rlf-20-lanes-build-fix-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout self-contained CI payload
        uses: actions/checkout@v4

      - name: Assemble self-contained application source
        run: |
          mkdir -p work/client/src/pages work/client/public/tracker/apparatus work/server work/scripts work/tests
          cp ci-src/package.json work/package.json
          cp ci-src/client-index.html work/client/index.html
          cp ci-src/main.tsx work/client/src/main.tsx
          cp ci-src/App.tsx work/client/src/App.tsx
          cp ci-src/index.css work/client/src/index.css
          cp ci-src/Home.tsx work/client/src/pages/Home.tsx
          cp ci-src/server-index.ts work/server/index.ts
          cp ci-src/vite.config.ts work/vite.config.ts
          cp ci-src/tsconfig.json work/tsconfig.json
          cat ci-src/lib-lane-apparatus.part1 ci-src/lib-lane-apparatus.part2 ci-src/lib-lane-apparatus.part3 ci-src/lib-lane-apparatus.part4 > work/scripts/lib-lane-apparatus.mjs
          cp ci-src/lane-apparatus.mjs work/scripts/lane-apparatus.mjs
          cp ci-src/run-20-lanes.mjs work/scripts/run-20-lanes.mjs
          cp ci-src/lane-apparatus.test.mjs work/tests/lane-apparatus.test.mjs
          chmod +x work/scripts/lane-apparatus.mjs work/scripts/run-20-lanes.mjs
          test "$(wc -l < work/scripts/lib-lane-apparatus.mjs)" -eq 624
          node <<'NODE'
          const fs = require('fs');
          const lanes = Array.from({ length: 20 }, (_, i) => ({
            lane_id: `LANE-${String(i + 1).padStart(2, '0')}`,
            status: 'ready', active_lease_count: 0, total: 0, queued: 0,
            leased: 0, in_review: 0, quarantine: 0, blocked: 0,
            verified: 0, next_task_id: null, tasks: []
          }));
          const status = {
            apparatus_id: 'RLF-SUPPLIER-CENSUS-20-LANES',
            policy: 'APPEND_ONLY_FAIL_CLOSED', wave_id: 'CI-SMOKE', revision: 1,
            updated_at: new Date().toISOString(), lane_count: 20,
            counters: { total: 0, queued: 0, leased: 0, in_review: 0, quarantine: 0, blocked: 0, verified: 0, expired: 0 },
            lanes,
            invariants: { exactly_20_lanes: true, task_membership_complete: true, no_task_overlap: true, no_network_overlap: true, no_domain_overlap: true, no_supplier_overlap: true, leases_belong_to_lane: true, verified_are_fail_closed: true },
            lease_seconds: 1800,
            state_hash: 'ci-smoke-only'
          };
          fs.writeFileSync('work/client/public/tracker/apparatus/status.json', JSON.stringify(status, null, 2) + '\n');
          NODE
          sha256sum work/scripts/lib-lane-apparatus.mjs work/client/src/pages/Home.tsx work/server/index.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activate exact pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          node --version
          pnpm --version

      - name: Generate and enforce reproducible lockfile
        working-directory: work
        run: |
          pnpm install --lockfile-only
          test -s pnpm-lock.yaml
          cp pnpm-lock.yaml pnpm-lock.generated.yaml
          pnpm install --frozen-lockfile
          cmp pnpm-lock.yaml pnpm-lock.generated.yaml

      - name: TypeScript verification
        working-directory: work
        run: pnpm check

      - name: Apparatus concurrency and fail-closed tests
        working-directory: work
        run: pnpm tracker:test

      - name: Full Vite and Express build
        working-directory: work
        run: pnpm build

      - name: Production smoke test
        working-directory: work
        run: |
          NODE_ENV=production PORT=4173 node dist/index.js > /tmp/rlf-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/rlf-index.html; then
              break
            fi
            sleep 1
          done
          grep -qi '<!doctype html>' /tmp/rlf-index.html
          curl --fail --silent http://127.0.0.1:4173/api/tracker/status | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.lane_count!==20)process.exit(1)})"
          kill $server_pid
          wait $server_pid || true
          cat /tmp/rlf-server.log

      - name: Create auditable build report and offline bundle
        working-directory: work
        run: |
          mkdir -p external-build-result
          {
            echo 'RLF 20 LANES EXTERNAL BUILD: PASS'
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "NODE=$(node --version)"
            echo "PNPM=$(pnpm --version)"
            echo "COMMIT=${GITHUB_SHA}"
            echo
            echo 'DIST FILES:'
            find dist -type f -printf '%P\t%s bytes\n' | sort
            echo
            echo 'SOURCE HASHES:'
            sha256sum package.json pnpm-lock.yaml client/src/pages/Home.tsx server/index.ts scripts/lib-lane-apparatus.mjs scripts/lane-apparatus.mjs scripts/run-20-lanes.mjs tests/lane-apparatus.test.mjs
          } | tee external-build-result/BUILD_REPORT.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > external-build-result/DIST_SHA256SUMS.txt
          tar --zstd -cf external-build-result/RLF_20_LANES_BUILD_OFFLINE_2026-08-30.tar.zst \
            dist node_modules package.json pnpm-lock.yaml client server scripts tests tsconfig.json vite.config.ts
          sha256sum external-build-result/RLF_20_LANES_BUILD_OFFLINE_2026-08-30.tar.zst > external-build-result/OFFLINE_BUNDLE_SHA256.txt
          du -sh external-build-result/*

      - name: Upload compiled and offline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RLF-20-LANES-EXTERNAL-BUILD-PASS
          path: work/external-build-result/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
