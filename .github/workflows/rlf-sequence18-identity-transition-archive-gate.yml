name: RLF sequence 18 identity transition archive gate

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence18-identity-transition-archive-gate.yml'
      - 'scripts/execution/build-sequence18-identity-transition-frontier.mjs'
      - 'scripts/execution/run-identity-transition-archive-worker.mjs'
      - 'scripts/execution/consolidate-sequence18-identity-transition-gate.mjs'

permissions:
  actions: read
  contents: write

env:
  SOURCE_BRANCH: feature/rlf-execution-backend-20260823

concurrency:
  group: rlf-sequence18-identity-transition-archive-gate
  cancel-in-progress: true

jobs:
  prepare_identity_gate:
    name: Prepare strict identity-transition frontier
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.frontier.outputs.matrix }}
      frontier_sha256: ${{ steps.frontier.outputs.frontier_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: frontier
        name: Build fail-closed 3+47 evidence frontier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/execution/build-sequence18-identity-transition-frontier.mjs \
            --progress=data/execution/product-progress.json \
            --progressDeltas=data/execution/progress-deltas \
            --seeds=data/execution/rlf-kb-official-seeds.json \
            --out=execution/sequence18-frontier/identity-transition-frontier.json
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          import { readJson } from './scripts/execution/common.mjs';
          const frontier = await readJson(
            'execution/sequence18-frontier/identity-transition-frontier.json',
          );
          const active = frontier.assignments.filter(
            item => item.candidates.length === 1,
          );
          const idle = frontier.assignments.filter(
            item => item.candidates.length === 0,
          );
          const expected = ['HW2300|843','M1588|81B','M1588|84B'];
          if (
            frontier.targetSequence !== 18 ||
            frontier.workerCount !== 50 ||
            frontier.activeLaneCount !== 3 ||
            frontier.auditedIdleLaneCount !== 47 ||
            frontier.selectedIdentityCount !== 3 ||
            frontier.ledgerMutationAllowed !== false ||
            active.length !== 3 ||
            idle.length !== 47 ||
            JSON.stringify(frontier.candidates.map(item => item.identityKey).sort()) !==
              JSON.stringify(expected)
          ) {
            throw new Error('Invalid sequence 18 identity-transition frontier');
          }
          const matrix = JSON.stringify({
            slot: frontier.assignments.map(item => item.slot),
          });
          await appendFile(process.env.GITHUB_OUTPUT, `matrix=${matrix}\n`);
          await appendFile(
            process.env.GITHUB_OUTPUT,
            `frontier_sha256=${frontier.frontierSha256}\n`,
          );
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rlf-sequence18-identity-transition-frontier
          path: execution/sequence18-frontier/identity-transition-frontier.json
          if-no-files-found: error
          retention-days: 30

  identity_gate_worker:
    name: Identity gate ${{ matrix.slot }}
    needs: prepare_identity_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 50
      matrix: ${{ fromJSON(needs.prepare_identity_gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download immutable identity-transition frontier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/execution/download-artifact-retry.sh \
            --name rlf-sequence18-identity-transition-frontier \
            --dest execution/identity-transition-frontier
      - name: Probe exact official and archival identity evidence
        run: |
          node scripts/execution/run-identity-transition-archive-worker.mjs \
            --slot=${{ matrix.slot }} \
            --frontier=execution/identity-transition-frontier/identity-transition-frontier.json \
            --out=execution/sequence18-identity-workers/${{ matrix.slot }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlf-sequence18-identity-worker-${{ matrix.slot }}
          path: execution/sequence18-identity-workers/${{ matrix.slot }}
          if-no-files-found: error
          retention-days: 30

  consolidate_identity_gate:
    name: Consolidate strict identity-transition evidence
    needs:
      - prepare_identity_gate
      - identity_gate_worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download frontier and all 50 worker artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/execution/download-artifact-retry.sh \
            --name rlf-sequence18-identity-transition-frontier \
            --dest execution/identity-transition-frontier
          bash scripts/execution/download-artifact-retry.sh \
            --pattern 'rlf-sequence18-identity-worker-*' \
            --dest execution/downloaded-sequence18-identity-workers
      - name: Consolidate fail-closed current and archival evidence
        run: |
          node scripts/execution/consolidate-sequence18-identity-transition-gate.mjs \
            --input=execution/downloaded-sequence18-identity-workers \
            --frontier=execution/identity-transition-frontier/identity-transition-frontier.json \
            --out=execution/sequence18-identity-consolidated
      - name: Prove retries retained and protected ledger unchanged
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { readJson } from './scripts/execution/common.mjs';
          const report = await readJson(
            'execution/sequence18-identity-consolidated/sequence18-identity-transition-archive-report.json',
          );
          const records = (await readFile(
            'execution/sequence18-identity-consolidated/identity-transition-observations.ndjson',
            'utf8',
          ))
            .split(/\r?\n/)
            .filter(Boolean)
            .map(JSON.parse);
          const expected = ['HW2300|843','M1588|81B','M1588|84B'];
          if (
            report.workerCount !== 50 ||
            report.activeLaneCount !== 3 ||
            report.auditedIdleLaneCount !== 47 ||
            report.selectedIdentityCount !== 3 ||
            report.attemptedProbeCount !== records.length ||
            report.retriesRetained !== true ||
            report.automaticAliasPromotionPerformed !== false ||
            report.sameColourOrProductNameAloneAccepted !== false ||
            report.ledgerMutationCount !== 0 ||
            report.factoryVerifiedCount !== 0 ||
            report.globalCanonicalProductCount !== 0 ||
            report.passed !== true ||
            JSON.stringify(report.unresolvedIdentityKeys) !== JSON.stringify(expected)
          ) {
            throw new Error('Sequence 18 accounting or protected gates failed');
          }
          if (
            report.evidenceCandidateIdentityKeys.some(
              identityKey => !expected.includes(identityKey),
            )
          ) {
            throw new Error('Sequence 18 emitted an unexpected identity candidate');
          }
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Generate immutable SHA-256 evidence manifest
        run: |
          find \
            execution/identity-transition-frontier \
            execution/downloaded-sequence18-identity-workers \
            execution/sequence18-identity-consolidated \
            -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > execution/SEQUENCE18_IDENTITY_TRANSITION_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rlf-sequence18-identity-transition-results-${{ github.run_id }}
          path: |
            execution/identity-transition-frontier/identity-transition-frontier.json
            execution/downloaded-sequence18-identity-workers
            execution/sequence18-identity-consolidated
            execution/SEQUENCE18_IDENTITY_TRANSITION_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Persist immutable sequence 18 evidence checkpoint
        shell: bash
        run: |
          set -euo pipefail
          branch="${SOURCE_BRANCH}"
          git fetch origin "${branch}"
          git rebase "origin/${branch}"
          node --input-type=module <<'NODE'
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          import { readJson } from './scripts/execution/common.mjs';
          const frontier = await readJson(
            'execution/identity-transition-frontier/identity-transition-frontier.json',
          );
          const ledger = await loadProgressLedger();
          if (
            ledger.ledgerSha256 !== frontier.priorLedgerSha256 ||
            String(ledger.latestRunId) !== String(frontier.priorRunId) ||
            ledger.deltaCount !== frontier.priorDeltaCount ||
            ledger.retry.identityCount !== 3 ||
            ledger.counters.factoryVerifiedCount !== 0 ||
            ledger.counters.globalCanonicalProductCount !== 0
          ) {
            throw new Error(
              `Canonical ledger changed before sequence 18 persistence: ${ledger.ledgerSha256}`,
            );
          }
          NODE
          destination="data/execution/runs/${GITHUB_RUN_ID}"
          mkdir -p "${destination}"
          cp \
            execution/identity-transition-frontier/identity-transition-frontier.json \
            "${destination}/identity-transition-frontier.json"
          cp \
            execution/sequence18-identity-consolidated/sequence18-identity-transition-archive-report.json \
            "${destination}/sequence18-identity-transition-archive-report.json"
          cp \
            execution/sequence18-identity-consolidated/identity-transition-observations.ndjson \
            "${destination}/identity-transition-observations.ndjson"
          cp \
            execution/SEQUENCE18_IDENTITY_TRANSITION_SHA256SUMS.txt \
            "${destination}/SEQUENCE18_IDENTITY_TRANSITION_SHA256SUMS.txt"
          cp \
            execution/sequence18-identity-consolidated/sequence18-identity-transition-archive-report.json \
            data/execution/sequence18-identity-transition-archive-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "${destination}" \
            data/execution/sequence18-identity-transition-archive-report.json
          git commit -m "Persist audited sequence 18 identity-transition evidence ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${branch}"
            if ! git merge-base --is-ancestor "origin/${branch}" HEAD; then
              base="$(git merge-base HEAD "origin/${branch}")"
              if git diff --name-only "${base}" "origin/${branch}" \
                -- data/execution/progress-deltas \
                | grep -q .; then
                echo 'Concurrent progress delta changed; refusing stale sequence 18 persistence' >&2
                exit 1
              fi
              git rebase "origin/${branch}"
            fi
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Unable to publish sequence 18 evidence checkpoint' >&2
          exit 1
