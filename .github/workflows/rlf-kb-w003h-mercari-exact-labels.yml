name: RLF KB W003H Mercari exact labels

on:
  workflow_dispatch:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - tools/collect_rlf_kb_w003h_mercari_exact_labels.py
      - .github/workflows/rlf-kb-w003h-mercari-exact-labels.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 curl_cffi pillow

      - name: Collect exact Mercari item galleries
        run: python tools/collect_rlf_kb_w003h_mercari_exact_labels.py

      - name: Package auditable output
        run: zip -r RLF_KB_W003H_MERCARI_EXACT_LABELS_V1.zip w003h-mercari-exact-labels

      - name: Upload W003H package
        uses: actions/upload-artifact@v4
        with:
          name: RLF_KB_W003H_MERCARI_EXACT_LABELS_V1
          path: RLF_KB_W003H_MERCARI_EXACT_LABELS_V1.zip
          if-no-files-found: error
          retention-days: 7

