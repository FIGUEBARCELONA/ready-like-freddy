name: RLF sequence 15 repreflight trigger

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence15-repreflight-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
          fetch-depth: 0
      - name: Advance preflight revision exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rlf-source-page-rotation-validation.yml')
          text = path.read_text(encoding='utf-8')
          old = "PREFLIGHT_REVISION: '6'"
          new = "PREFLIGHT_REVISION: '7'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one preflight revision marker, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/rlf-sequence15-repreflight-trigger.yml
      - name: Commit preflight trigger
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rlf-source-page-rotation-validation.yml .github/workflows/rlf-sequence15-repreflight-trigger.yml
          git commit -m 'Revalidate sequence 15 after catalog route filtering'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
