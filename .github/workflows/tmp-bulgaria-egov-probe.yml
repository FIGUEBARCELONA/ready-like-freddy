name: tmp-bulgaria-egov-probe

on:
  push:
    branches:
      - tmp/bulgaria-egov-20260808

permissions:
  contents: read

env:
  DATASET_UUID: 53c0dd26-58ea-49fb-a901-53dd840c359c
  BASE_URL: https://data.egov.bg

jobs:
  fetch-dataset-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch fresh dataset bundle with evidence
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          cd evidence

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          COOKIE_JAR='cookies.txt'

          echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > summary.txt
          echo "runner_ip=$(curl -fsS --max-time 20 https://api.ipify.org || true)" >> summary.txt
          echo "dataset_uuid=${DATASET_UUID}" >> summary.txt

          # 0) Purge any orphan/stale prepared bundle, if one exists. Never use these bytes.
          curl -sS -L --connect-timeout 20 --max-time 90 \
            -A "$UA" -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -D purge.headers \
            -o purge.body \
            -w 'purge_http=%{http_code}\npurge_type=%{content_type}\npurge_size=%{size_download}\npurge_url=%{url_effective}\n' \
            "${BASE_URL}/dataset/resources/download/zip/${DATASET_UUID}" \
            > purge.meta 2> purge.stderr || true

          # 1) Force a fresh server-side bundle generated from the exact dataset UUID.
          curl -sS -L --connect-timeout 20 --max-time 180 \
            -A "$UA" -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -D prepare.headers \
            -o prepare.body \
            -w 'prepare_http=%{http_code}\nprepare_type=%{content_type}\nprepare_size=%{size_download}\nprepare_url=%{url_effective}\n' \
            "${BASE_URL}/dataset/${DATASET_UUID}/resources/download/csv" \
            > prepare.meta 2> prepare.stderr || true

          # 2) Download the freshly generated ZIP. The official controller deletes it after serving.
          curl -sS -L --connect-timeout 20 --max-time 300 \
            -A "$UA" -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -D bundle.headers \
            -o dataset_bundle.zip \
            -w 'bundle_http=%{http_code}\nbundle_type=%{content_type}\nbundle_size=%{size_download}\nbundle_url=%{url_effective}\n' \
            "${BASE_URL}/dataset/resources/download/zip/${DATASET_UUID}" \
            > bundle.meta 2> bundle.stderr || true

          cat purge.meta prepare.meta bundle.meta >> summary.txt
          echo '--- prepare body ---' >> summary.txt
          head -c 2000 prepare.body >> summary.txt 2>/dev/null || true
          printf '\n--- bundle inspection ---\n' >> summary.txt
          file dataset_bundle.zip >> summary.txt 2>&1 || true
          stat -c 'bundle_bytes=%s' dataset_bundle.zip >> summary.txt 2>/dev/null || true
          sha256sum dataset_bundle.zip >> summary.txt 2>/dev/null || true

          if python3 - <<'PY'
          import zipfile
          p='dataset_bundle.zip'
          try:
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip()
                  print('ZIP_OK' if bad is None else f'ZIP_BAD_MEMBER={bad}')
                  print(f'ZIP_MEMBERS={len(z.infolist())}')
                  print(f'ZIP_UNCOMPRESSED_BYTES={sum(i.file_size for i in z.infolist())}')
                  for i in z.infolist()[:200]:
                      print(f'{i.filename}\t{i.file_size}\t{i.CRC:08x}')
              raise SystemExit(0 if bad is None else 2)
          except Exception as e:
              print(f'ZIP_ERROR={type(e).__name__}: {e}')
              raise SystemExit(1)
          PY
          then
            python3 - <<'PY' >> summary.txt
          import hashlib, io, os, re, zipfile
          p='dataset_bundle.zip'
          with zipfile.ZipFile(p) as z:
              for i in z.infolist():
                  if i.is_dir():
                      continue
                  b=z.read(i)
                  print(f'member_sha256={hashlib.sha256(b).hexdigest()}\tbytes={len(b)}\tname={i.filename}')
                  head=b[:512]
                  for enc in ('utf-8-sig','cp1251','latin1'):
                      try:
                          txt=head.decode(enc)
                          print(f'member_head[{i.filename}][{enc}]={txt[:300]!r}')
                          break
                      except Exception:
                          pass
          PY
          else
            true
          fi

          echo '=== SUMMARY ==='
          cat summary.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bulgaria-egov-dataset-bundle-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 1
