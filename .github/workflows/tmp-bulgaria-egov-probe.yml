name: tmp-bulgaria-egov-probe

on:
  push:
    branches:
      - tmp/bulgaria-egov-20260808

permissions:
  contents: read

env:
  BASE_URL: https://data.egov.bg

jobs:
  discover-successor-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query listDatasets through current Bulgarian egressions
        shell: bash
        run: |
          set -u
          mkdir -p evidence/probes
          cd evidence
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          PHRASE='Национален класификатор на локализационните единици'
          printf '%s\n' "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > summary.txt
          printf '%s\n' "phrase=${PHRASE}" >> summary.txt

          curl -fsSL --max-time 30 \
            https://cdn.jsdelivr.net/gh/proxyscrape/free-proxy-list@main/proxies/countries/bg/data.json \
            -o bg_proxies.json || true

          python3 - <<'PY' > proxy_urls.txt
          import json
          try: rows=json.load(open('bg_proxies.json',encoding='utf-8'))
          except Exception: rows=[]
          rows.sort(key=lambda p:(
              0 if p.get('protocol') in ('socks5','socks4') and p.get('ssl') else 1,
              0 if p.get('anonymity')=='elite' else 1,
              -(p.get('uptime_percent') or 0),
              p.get('latency_ms') or 999999,
          ))
          for p in rows[:20]:
              proto=p.get('protocol','http')
              scheme={'socks5':'socks5h','socks4':'socks4a'}.get(proto,'http')
              print(f"{scheme}://{p['ip']}:{p['port']}\t{p.get('city','')}\t{p.get('anonymity','')}\t{p.get('ssl')}\t{p.get('uptime_percent')}\t{p.get('latency_ms')}")
          PY

          echo '--- candidates ---' >> summary.txt
          cat proxy_urls.txt >> summary.txt || true

          python3 - <<'PY' > payloads.tsv
          import json
          phrase='Национален класификатор на локализационните единици'
          queries=[phrase, phrase+' 2024', phrase+' 2025', phrase+' 2026']
          for idx,q in enumerate(queries,1):
              payload={
                  'criteria':{
                      'keywords':q,
                      'public':True,
                      'locale':'bg',
                      'status':2,
                      'visibility':1
                  },
                  'page_number':1,
                  'records_per_page':100
              }
              print(str(idx)+'\t'+json.dumps(payload,ensure_ascii=False,separators=(',',':')))
          PY

          SUCCESS=0
          PROXY_NO=0
          while IFS=$'\t' read -r PROXY CITY ANON SSL UPTIME LATENCY; do
            [ -n "$PROXY" ] || continue
            PROXY_NO=$((PROXY_NO+1))
            SAFE="$(echo "$PROXY" | tr '/:.' '____')"
            QUERY_NO=0
            while IFS=$'\t' read -r PID PAYLOAD; do
              QUERY_NO=$((QUERY_NO+1))
              OUT="probes/p${PROXY_NO}_q${PID}_${SAFE}"
              # One target request per proxy connection attempt. Do not preflight the proxy.
              curl -sS --proxy "$PROXY" --connect-timeout 8 --max-time 35 \
                -A "$UA" -H 'Accept: application/json' -H 'Content-Type: application/json' \
                -D "${OUT}.headers" -o "${OUT}.body" \
                -w 'http=%{http_code}\ntype=%{content_type}\nsize=%{size_download}\nurl=%{url_effective}\n' \
                -X POST --data-binary "$PAYLOAD" \
                "${BASE_URL}/api/listDatasets" \
                > "${OUT}.meta" 2> "${OUT}.stderr" || true
              HTTP=$(awk -F= '/^http=/{print $2}' "${OUT}.meta" | tail -1)
              SIZE=$(awk -F= '/^size=/{print $2}' "${OUT}.meta" | tail -1)
              echo "proxy=${PROXY} city=${CITY} q=${PID} http=${HTTP:-000} size=${SIZE:-0}" >> summary.txt
              if [ "${HTTP:-000}" = "200" ] && python3 - "$OUT.body" <<'PY'
          import json,sys
          try:
              x=json.load(open(sys.argv[1],encoding='utf-8'))
              ok=isinstance(x,dict) and ('datasets' in x or 'success' in x or 'total_records' in x)
          except Exception: ok=False
          raise SystemExit(0 if ok else 1)
          PY
              then
                SUCCESS=1
                cp "${OUT}.body" "api_success_q${PID}.json"
                cp "${OUT}.headers" "api_success_q${PID}.headers"
                echo "success_proxy=${PROXY} query_id=${PID}" >> summary.txt
                # Continue with the remaining query payloads only if the proxy survives; otherwise later proxies can answer them.
              fi
              # A flaky public proxy generally supports one connection; move to next proxy after first target attempt.
              break
            done < payloads.tsv
          done < proxy_urls.txt

          # Summarize every valid JSON response and all matching dataset objects.
          python3 - <<'PY' > parsed_datasets.json
          import glob,json,re
          out={'responses':[],'datasets':[]}
          seen=set()
          for fn in sorted(glob.glob('probes/*.body')+glob.glob('api_success_q*.json')):
              try: x=json.load(open(fn,encoding='utf-8'))
              except Exception: continue
              if not isinstance(x,dict): continue
              ds=x.get('datasets') or []
              out['responses'].append({'file':fn,'total_records':x.get('total_records'),'dataset_count':len(ds) if isinstance(ds,list) else None})
              if isinstance(ds,list):
                  for d in ds:
                      if not isinstance(d,dict): continue
                      raw=json.dumps(d,ensure_ascii=False)
                      if 'локализацион' not in raw.lower() and 'locali' not in raw.lower(): continue
                      key=d.get('uri') or d.get('id') or raw
                      if key in seen: continue
                      seen.add(key); out['datasets'].append(d)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          cat parsed_datasets.json >> summary.txt
          echo '=== SUMMARY ==='
          cat summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulgaria-egov-successor-discovery
          path: evidence/
          if-no-files-found: error
          retention-days: 1
