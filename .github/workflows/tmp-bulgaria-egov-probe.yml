name: tmp-bulgaria-egov-probe

on:
  push:
    branches:
      - tmp/bulgaria-egov-20260808

permissions:
  contents: read

env:
  BASE_URL: https://data.egov.bg
  BG_PROXY: socks5h://31.211.142.115:8192

jobs:
  one-shot-live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Search annual localisation-unit datasets
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          cd evidence
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          PAYLOAD=$(python3 - <<'PY'
          import json
          print(json.dumps({
            'criteria': {'keywords':'Национален класификатор на локализационните единици'},
            'page_number':1,
            'records_per_page':100
          }, ensure_ascii=False, separators=(',',':')))
          PY
          )
          echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > summary.txt
          echo "proxy=${BG_PROXY}" >> summary.txt
          curl -sS --proxy "$BG_PROXY" --connect-timeout 10 --max-time 50 \
            -A "$UA" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -D response.headers -o response.json \
            -w 'http=%{http_code}\ntype=%{content_type}\nsize=%{size_download}\nurl=%{url_effective}\n' \
            -X POST --data-binary "$PAYLOAD" "${BASE_URL}/api/listDatasets" \
            > response.meta 2> response.stderr || true
          cat response.meta response.stderr >> summary.txt
          python3 - <<'PY' >> summary.txt 2>&1 || true
          import json
          x=json.load(open('response.json',encoding='utf-8'))
          print('top_keys=',sorted(x.keys()))
          print('total_records=',x.get('total_records'))
          ds=x.get('datasets') or []
          print('dataset_count=',len(ds))
          for d in ds:
              print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
          cat summary.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulgaria-egov-one-shot-live-api
          path: evidence/
          if-no-files-found: error
          retention-days: 1
