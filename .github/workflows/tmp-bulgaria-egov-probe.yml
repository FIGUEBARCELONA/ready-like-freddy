name: tmp-bulgaria-egov-probe

on:
  push:
    branches:
      - tmp/bulgaria-egov-20260808

permissions:
  contents: read

env:
  BASE_URL: https://data.egov.bg
  DATASET_UUID: 9c5f9ff5-b43f-42a9-8055-c7cc84b1b085
  RESOURCE_UUID: 068c2108-e6b8-4ca4-8bac-3ca79832c72d

jobs:
  live-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 https://cdn.jsdelivr.net/gh/proxyscrape/free-proxy-list@main/proxies/countries/bg/data.json -o /tmp/bg.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          rows=json.load(open('/tmp/bg.json',encoding='utf-8'))
          items=[]
          for i,p in enumerate(rows[:50]):
              proto=p.get('protocol','http')
              scheme={'socks5':'socks5h','socks4':'socks4a'}.get(proto,'http')
              label=f"p{i+1}-{p.get('city') or 'bg'}-{p.get('ip','').replace('.','-')}-{p.get('port')}"
              label=re.sub(r'[^A-Za-z0-9_-]+','-',label)[:80]
              items.append({'label':label,'proxy':f"{scheme}://{p['ip']}:{p['port']}"})
          if not items:
              raise SystemExit('no BG proxies returned')
          print('matrix='+json.dumps({'include':items},separators=(',',':')))
          print('count='+str(len(items)))
          PY
          echo "Current BG proxy count: $(python3 -c 'import json; print(len(json.load(open("/tmp/bg.json"))))')"

  fetch-current-api-data:
    needs: live-matrix
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.live-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: One-shot current resource API
        shell: bash
        env:
          BG_PROXY: ${{ matrix.proxy }}
          LABEL: ${{ matrix.label }}
        run: |
          set -u
          mkdir -p evidence
          cd evidence
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          PAYLOAD="{\"resource_uri\":\"${RESOURCE_UUID}\",\"version\":1}"
          printf '%s\n' \
            "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "dataset_uuid=${DATASET_UUID}" \
            "resource_uuid=${RESOURCE_UUID}" \
            "vintage=2026-07" \
            "proxy=${BG_PROXY}" > summary.txt
          curl -sS --proxy "$BG_PROXY" --connect-timeout 8 --max-time 120 \
            -A "$UA" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -D response.headers -o response.json \
            -w 'http=%{http_code}\ntype=%{content_type}\nsize=%{size_download}\nurl=%{url_effective}\n' \
            -X POST --data-binary "$PAYLOAD" "${BASE_URL}/api/getResourceData" \
            > response.meta 2> response.stderr || true
          cat response.meta response.stderr >> summary.txt
          python3 - <<'PY' | tee analysis.json >> summary.txt
          import hashlib,json,os
          p='response.json'
          if not os.path.exists(p):
              print(json.dumps({'valid':False,'reason':'missing'})); raise SystemExit(0)
          b=open(p,'rb').read(); out={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          try: x=json.loads(b.decode('utf-8-sig'))
          except Exception as e:
              out.update(valid=False,reason='not_json',error=str(e)); print(json.dumps(out)); raise SystemExit(0)
          data=x.get('data') if isinstance(x,dict) else None
          out.update(top_type=type(x).__name__,top_keys=sorted(x.keys()) if isinstance(x,dict) else [],success=x.get('success') if isinstance(x,dict) else None,data_type=type(data).__name__,data_len=len(data) if isinstance(data,(list,dict)) else None)
          if isinstance(data,list): out['first_rows']=data[:4]
          elif isinstance(data,dict): out['first_items']=list(data.items())[:4]
          out['valid']=bool(isinstance(x,dict) and x.get('success') and isinstance(data,(list,dict)) and len(data)>1000)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          sha256sum response.json > response.sha256 2>/dev/null || true
          cat summary.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-api-${{ matrix.label }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
