name: tmp-bulgaria-egov-probe

on:
  push:
    branches:
      - tmp/bulgaria-egov-20260808

permissions:
  contents: read

env:
  BASE_URL: https://data.egov.bg
  DATASET_UUID: 9c5f9ff5-b43f-42a9-8055-c7cc84b1b085
  RESOURCE_UUID: 068c2108-e6b8-4ca4-8bac-3ca79832c72d

jobs:
  fetch-current-resource:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sofia-http
            proxy: http://92.247.12.130:9510
          - label: pleven-socks5
            proxy: socks5h://31.211.142.115:8192
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: One-shot exact resource download
        shell: bash
        env:
          BG_PROXY: ${{ matrix.proxy }}
          LABEL: ${{ matrix.label }}
        run: |
          set -u
          mkdir -p evidence
          cd evidence
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          URL="${BASE_URL}/resource/download/${RESOURCE_UUID}/csv"
          echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > summary.txt
          echo "dataset_uuid=${DATASET_UUID}" >> summary.txt
          echo "resource_uuid=${RESOURCE_UUID}" >> summary.txt
          echo "vintage=2026-07" >> summary.txt
          echo "proxy=${BG_PROXY}" >> summary.txt

          curl -sS -L --proxy "$BG_PROXY" --connect-timeout 10 --max-time 90 \
            -A "$UA" -H 'Accept: text/csv,*/*;q=0.8' \
            -D response.headers -o current_2026_07.csv \
            -w 'http=%{http_code}\ntype=%{content_type}\nsize=%{size_download}\nurl=%{url_effective}\n' \
            "$URL" > response.meta 2> response.stderr || true
          cat response.meta response.stderr >> summary.txt

          python3 - <<'PY' | tee analysis.json >> summary.txt
          import csv,hashlib,io,json,os
          p='current_2026_07.csv'
          if not os.path.exists(p):
              print(json.dumps({'valid_bytes':False,'reason':'missing_file'})); raise SystemExit(0)
          b=open(p,'rb').read(); low=b.lstrip().lower()
          if low.startswith(b'<!doctype') or low.startswith(b'<html') or b'<title>403' in low:
              print(json.dumps({'valid_bytes':False,'reason':'html_or_error','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})); raise SystemExit(0)
          text=None; enc=None
          for e in ('utf-8-sig','utf-8','cp1251'):
              try: text=b.decode(e); enc=e; break
              except UnicodeDecodeError: pass
          if text is None:
              print(json.dumps({'valid_bytes':False,'reason':'encoding','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})); raise SystemExit(0)
          try: delim=csv.Sniffer().sniff('\n'.join(text.splitlines()[:20]),delimiters=',;\t|').delimiter
          except Exception: delim=';'
          rows=[r for r in csv.reader(io.StringIO(text),delimiter=delim) if any(c.strip() for c in r)]
          out={'valid_bytes':bool(rows and len(rows[0])>=3),'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'encoding':enc,'delimiter':delim,'rows_total_including_header':len(rows),'data_rows':max(0,len(rows)-1),'header':rows[0] if rows else [],'sample_widths':sorted({len(r) for r in rows[:1000]}),'first_rows':rows[:4]}
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          sha256sum current_2026_07.csv > current_2026_07.sha256 2>/dev/null || true
          cat summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulgaria-current-2026-07-${{ matrix.label }}
          path: evidence/
          if-no-files-found: error
          retention-days: 1
