name: RLF sequence 19 reader no-mutation checkpoint

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence19-ledger-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rlf-sequence19-ledger-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact ledgers and certify reader no-mutation result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/execution
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          import { loadSourcePageLedger } from './scripts/execution/source-page-ledger.mjs';

          const identity=await loadProgressLedger();
          const sourcePages=await loadSourcePageLedger();
          const preflight=JSON.parse(await readFile('data/execution/sequence19-reader-media-preflight.json','utf8'));
          const manifest=JSON.parse(await readFile('data/execution/sequence19-reader-media-manifest.json','utf8'));
          const evidence=JSON.parse(await readFile('data/execution/sequence19-reader-media-evidence.json','utf8'));
          const dashboard=JSON.parse(await readFile('data/execution/workflow-runs-snapshot.json','utf8'));
          const expectedRetries=['HW2300|843','M1588|81B','M1588|84B'];
          const candidateKinds=evidence.candidateUrls.reduce((map,value)=>{
            const url=new URL(value);
            const key=url.pathname.includes('/media/')?'MEDIA_PATH':'PAGE_OR_FRAGMENT';
            map[key]=(map[key]??0)+1;
            return map;
          },{});
          const snapshot={
            schemaVersion:1,
            generatedAt:new Date().toISOString(),
            sourceCommitSha:process.env.GITHUB_SHA,
            sourceRunId:'32862831870',
            identity:{
              completedIdentityCount:identity.completed.identityCount,
              productUrlCaptureCount:identity.completed.productUrlCaptureCount,
              officialProductImageReferenceCount:identity.counters.officialProductImageReferenceCount,
              materialEvidenceCount:identity.counters.materialEvidenceCount,
              manufacturingClaimCount:identity.counters.manufacturingClaimCount,
              descriptionMissingIdentityCount:identity.metadataGaps.descriptionMissingIdentityCount,
              priceMissingIdentityCount:identity.metadataGaps.priceMissingIdentityCount,
              materialMissingIdentityCount:identity.metadataGaps.materialMissingIdentityCount,
              retryIdentityCount:identity.retry.identityCount,
              retryIdentityKeys:identity.retry.identities.map(item=>item.identityKey).sort(),
              deltaCount:identity.deltaCount,
              latestRunId:String(identity.latestRunId),
              factoryVerifiedCount:identity.counters.factoryVerifiedCount,
              globalCanonicalProductCount:identity.counters.globalCanonicalProductCount,
              ledgerSha256:identity.ledgerSha256,
            },
            sourcePages:{
              deltaCount:sourcePages.deltaCount,
              attemptedObservationCount:sourcePages.attemptedObservationCount,
              uniqueAttemptedSourcePageCount:sourcePages.uniqueAttemptedSourcePageCount,
              ledgerSha256:sourcePages.ledgerSha256,
            },
            sequence19:{
              planSha256:preflight.planSha256,
              preflightPassed:preflight.passed,
              sourceUrlCount:preflight.sourceUrlCount,
              uniqueSourceUrlCount:preflight.uniqueSourceUrlCount,
              readerUrlCount:preflight.readerUrlCount,
              uniqueReaderUrlCount:preflight.uniqueReaderUrlCount,
              assignmentCount:preflight.assignmentCount,
              nonemptyLaneCount:preflight.nonemptyLaneCount,
              manifestSha256:manifest.manifestSha256,
              manifestPassed:manifest.passed,
              status:manifest.status,
              workerCount:manifest.workerCount,
              orchestrationStatus:manifest.orchestrationStatus,
              readerStatusCounts:manifest.readerStatusCounts,
              totals:manifest.totals,
              candidateKinds,
              evidenceRecordCount:evidence.records.length,
              candidateUrlCount:evidence.candidateUrls.length,
              verifiedMediaCount:evidence.verifiedMedia.length,
              dashboardPassed:dashboard.passed,
              dashboardCounts:dashboard.counts,
              consolidatedArtifactDigest:'sha256:18d4e12a6e5b1f9c715e9a9151b9ea957eb1993144689479e93261e872022c91',
            },
          };
          const i=snapshot.identity,s=snapshot.sourcePages,q=snapshot.sequence19,c=q.dashboardCounts;
          snapshot.passed=
            i.completedIdentityCount===1357&&i.productUrlCaptureCount===2155&&
            i.officialProductImageReferenceCount===11708&&i.materialEvidenceCount===1748&&
            i.manufacturingClaimCount===64&&i.descriptionMissingIdentityCount===826&&
            i.priceMissingIdentityCount===770&&i.materialMissingIdentityCount===86&&
            i.retryIdentityCount===3&&JSON.stringify(i.retryIdentityKeys)===JSON.stringify(expectedRetries)&&
            i.deltaCount===11&&i.latestRunId==='32784949243'&&i.factoryVerifiedCount===0&&i.globalCanonicalProductCount===0&&
            i.ledgerSha256==='0476d387dbfb28ea303e9f6c1c642f22a117968537c3bff8c29678c72e60a2b7'&&
            s.deltaCount===8&&s.attemptedObservationCount===1524&&s.uniqueAttemptedSourcePageCount===1239&&
            s.ledgerSha256==='19545d43003400957b788bb5ecd25019413dfe2c225c86c5c28e827ccfc386e3'&&
            q.preflightPassed===true&&q.planSha256==='e8167be1c91516f5f75f0698304385eb44fc427ed4d32fd6cfd2bb9d4477eb8d'&&
            q.sourceUrlCount===50&&q.uniqueSourceUrlCount===50&&q.readerUrlCount===100&&q.uniqueReaderUrlCount===100&&
            q.assignmentCount===50&&q.nonemptyLaneCount===50&&
            q.manifestPassed===true&&q.manifestSha256==='659ddcd44507de5d6577f8904d771412c693874b76fe6d4acaabd6fdd6a3d0bd'&&
            q.status==='READER_CANDIDATE_DISCOVERY_COMPLETE_NO_DIRECTLY_VERIFIED_MEDIA'&&
            q.workerCount===50&&q.orchestrationStatus==='FIFTY_OF_FIFTY_EXCLUSIVE_READER_SOURCES_CONSOLIDATED'&&
            q.readerStatusCounts['200']===50&&Object.keys(q.readerStatusCounts).length===1&&
            q.totals.sourceCount===50&&q.totals.uniqueSourceCount===50&&q.totals.readerAttemptCount===50&&
            q.totals.readerSuccessCount===50&&q.totals.readerFailureCount===0&&q.totals.exactTextOccurrenceSourceCount===36&&
            q.totals.officialCandidateRawCount===62&&q.totals.officialCandidateUniqueCount===48&&q.totals.directVerificationAttemptCount===62&&
            q.totals.verifiedMediaRawCount===0&&q.totals.verifiedMediaCount===0&&q.totals.identitiesWithVerifiedMedia===0&&
            q.candidateKinds.PAGE_OR_FRAGMENT===48&&!q.candidateKinds.MEDIA_PATH&&
            q.evidenceRecordCount===50&&q.candidateUrlCount===48&&q.verifiedMediaCount===0&&q.dashboardPassed===true&&
            c.totalJobs===52&&c.prepareSuccess===1&&c.readerTotal===50&&c.readerSuccess===50&&c.readerFailed===0&&c.readerActive===0&&
            c.consolidateSuccess===1&&c.readerWorkerArtifacts===50&&c.planArtifacts===1&&c.consolidatedArtifacts===1&&c.totalArtifacts===52;
          await writeFile('data/execution/sequence19-ledger-snapshot.json',`${JSON.stringify(snapshot,null,2)}\n`);
          console.log(JSON.stringify(snapshot,null,2));
          if(!snapshot.passed) throw new Error('Sequence 19 exact reader no-mutation checkpoint failed');
          NODE
      - name: Publish exact sequence 19 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/sequence19-ledger-snapshot.json
          git commit -m 'Persist exact sequence 19 reader no-mutation checkpoint'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch"&&git push origin "HEAD:$branch";then exit 0;fi
            git rebase --abort 2>/dev/null||true
            sleep $((attempt*3))
          done
          exit 1
