name: RLF workflow runs snapshot

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-active-runs-snapshot.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SNAPSHOT_REVISION: '34'
  TARGET_RUN_ID: '32784949243'
  TARGET_SHA: '2dd77901661cf282f4771e2d2b666986397de8cd'

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
          fetch-depth: 0
      - name: Capture and certify paginated sequence 16 dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/execution
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > /tmp/run.json
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | {id,name,status,conclusion,started_at,completed_at}' | jq -s '.' > /tmp/jobs.json
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | {id,name,size_in_bytes,digest,expired,created_at,expires_at}' | jq -s '.' > /tmp/artifacts.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg targetRunId "$TARGET_RUN_ID" \
            --arg targetSha "$TARGET_SHA" \
            --slurpfile run /tmp/run.json \
            --slurpfile jobs /tmp/jobs.json \
            --slurpfile artifacts /tmp/artifacts.json \
            '{
              schemaVersion:18,
              capturedAt:$capturedAt,
              targetRunId:$targetRunId,
              targetSha:$targetSha,
              run:($run[0] | {id,run_number,run_attempt,status,conclusion,head_sha,event,created_at,updated_at,html_url}),
              counts:{
                totalJobs:($jobs[0]|length),
                prepareTotal:([$jobs[0][]|select(.name=="Prepare six-retry immutable frontier")]|length),
                prepareSuccess:([$jobs[0][]|select(.name=="Prepare six-retry immutable frontier" and .conclusion=="success")]|length),
                productTotal:([$jobs[0][]|select(.name|test("^Product F[0-9]{2}$"))]|length),
                productSuccess:([$jobs[0][]|select((.name|test("^Product F[0-9]{2}$")) and .conclusion=="success")]|length),
                productFailed:([$jobs[0][]|select((.name|test("^Product F[0-9]{2}$")) and (.conclusion!=null and .conclusion!="success"))]|length),
                productActive:([$jobs[0][]|select((.name|test("^Product F[0-9]{2}$")) and .status!="completed")]|length),
                consolidateTotal:([$jobs[0][]|select(.name=="Consolidate, audit and persist sequence 16")]|length),
                consolidateSuccess:([$jobs[0][]|select(.name=="Consolidate, audit and persist sequence 16" and .conclusion=="success")]|length),
                productWorkerArtifacts:([$artifacts[0][]|select(.name|test("^rlf-sequence16-product-worker-F[0-9]{2}$"))]|length),
                frontierArtifacts:([$artifacts[0][]|select(.name=="rlf-sequence16-retry-frontier")]|length),
                consolidatedProductArtifacts:([$artifacts[0][]|select(.name|test("^rlf-sequence16-retry-results-"))]|length),
                totalArtifacts:($artifacts[0]|length)
              },
              jobs:$jobs[0],
              artifacts:$artifacts[0]
            } | .passed = (
              .run.status=="completed" and .run.conclusion=="success" and .run.head_sha==$targetSha and
              .counts.totalJobs==52 and
              .counts.prepareTotal==1 and .counts.prepareSuccess==1 and
              .counts.productTotal==50 and .counts.productSuccess==50 and .counts.productFailed==0 and .counts.productActive==0 and
              .counts.consolidateTotal==1 and .counts.consolidateSuccess==1 and
              .counts.productWorkerArtifacts==50 and .counts.frontierArtifacts==1 and
              .counts.consolidatedProductArtifacts==1 and .counts.totalArtifacts==52
            )' > data/execution/workflow-runs-snapshot.json
          cat data/execution/workflow-runs-snapshot.json
          jq -e '.passed == true' data/execution/workflow-runs-snapshot.json >/dev/null
      - name: Publish certified snapshot
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/workflow-runs-snapshot.json
          git commit -m 'Certify sequence 16 retry recovery dashboard'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
