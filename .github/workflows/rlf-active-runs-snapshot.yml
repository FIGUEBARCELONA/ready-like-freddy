name: RLF workflow runs snapshot

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-active-runs-snapshot.yml'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write

env:
  SNAPSHOT_REVISION: '6'
  TARGET_SHA: '8af115e91e7b4918a538a352cd929c0e6a0c0825'

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Capture recent runs and target checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/execution
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=feature%2Frlf-execution-backend-20260823&per_page=30" \
            --jq '[.workflow_runs[] | {id, name, run_number, event, status, conclusion, head_sha, created_at, updated_at, html_url}]' \
            > /tmp/all-runs.json
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=30" \
            --jq '[.workflow_runs[] | {id, name, run_number, event, status, conclusion, head_sha, created_at, updated_at, html_url}]' \
            > /tmp/target-runs.json
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | {id, name, status, conclusion, started_at, completed_at, details_url}]' \
            > /tmp/target-checks.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg targetSha "$TARGET_SHA" \
            --slurpfile all /tmp/all-runs.json \
            --slurpfile target /tmp/target-runs.json \
            --slurpfile checks /tmp/target-checks.json \
            '{schemaVersion: 2, capturedAt: $capturedAt, targetSha: $targetSha, targetRuns: $target[0], targetChecks: $checks[0], recentRuns: $all[0]}' \
            > data/execution/workflow-runs-snapshot.json
      - name: Publish snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/workflow-runs-snapshot.json
          git commit -m 'Snapshot sequence 12 massive run'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
