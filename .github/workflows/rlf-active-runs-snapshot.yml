name: RLF active runs snapshot

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-active-runs-snapshot.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Capture recent workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/execution
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/340557520/runs?branch=feature%2Frlf-execution-backend-20260823&per_page=20" \
            --jq '{capturedAt: now | todateiso8601, runs: [.workflow_runs[] | {id, run_number, event, status, conclusion, head_sha, created_at, updated_at, html_url}]}' \
            > data/execution/active-runs.json
      - name: Publish snapshot
        run: |
          set -euo pipefail
          git pull --rebase origin feature/rlf-execution-backend-20260823
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/active-runs.json
          git commit -m 'Snapshot RLF workflow runs'
          git push origin HEAD:feature/rlf-execution-backend-20260823
