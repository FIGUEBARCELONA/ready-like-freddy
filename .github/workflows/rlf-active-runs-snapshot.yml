name: RLF workflow runs snapshot

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-active-runs-snapshot.yml'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write

env:
  SNAPSHOT_REVISION: '12'
  TARGET_SHA: '9812af61eb7ff524a9484c351d99f24f52a857fa'

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Capture target commit workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/execution
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=feature%2Frlf-execution-backend-20260823&per_page=50" \
            --jq '[.workflow_runs[] | {id, name, run_number, run_attempt, event, status, conclusion, head_sha, created_at, updated_at, html_url}]' \
            > /tmp/recent-runs.json
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=50" \
            --jq '[.workflow_runs[] | {id, name, run_number, run_attempt, event, status, conclusion, head_sha, created_at, updated_at, html_url}]' \
            > /tmp/target-runs.json
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | {id, name, status, conclusion, started_at, completed_at, details_url}]' \
            > /tmp/target-checks.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg targetSha "$TARGET_SHA" \
            --slurpfile recent /tmp/recent-runs.json \
            --slurpfile target /tmp/target-runs.json \
            --slurpfile checks /tmp/target-checks.json \
            '{schemaVersion: 4, capturedAt: $capturedAt, targetSha: $targetSha, targetRuns: $target[0], targetChecks: $checks[0], recentRuns: $recent[0]}' \
            > data/execution/workflow-runs-snapshot.json
          cat data/execution/workflow-runs-snapshot.json
      - name: Publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/workflow-runs-snapshot.json
          git commit -m 'Snapshot automatic source-delta integration validation'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
