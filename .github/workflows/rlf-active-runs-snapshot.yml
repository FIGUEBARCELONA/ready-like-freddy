name: RLF workflow runs snapshot

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-active-runs-snapshot.yml'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write

env:
  SNAPSHOT_REVISION: '9'
  TARGET_SHA: '8af115e91e7b4918a538a352cd929c0e6a0c0825'
  TARGET_RUN_ID: '32777623316'

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Capture full target run matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/execution
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" \
            --jq '{id, name, run_number, run_attempt, event, status, conclusion, head_sha, head_branch, created_at, updated_at, html_url}' \
            > /tmp/run.json
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | {id, name, status, conclusion, started_at, completed_at, html_url}' \
            | jq -s 'unique_by(.id) | sort_by(.name)' > /tmp/jobs.json
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | {id, name, size_in_bytes, digest, expired, created_at, expires_at, archive_download_url}' \
            | jq -s 'unique_by(.id) | sort_by(.name)' > /tmp/artifacts.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg targetSha "$TARGET_SHA" \
            --arg targetRunId "$TARGET_RUN_ID" \
            --slurpfile run /tmp/run.json \
            --slurpfile jobs /tmp/jobs.json \
            --slurpfile artifacts /tmp/artifacts.json \
            '{
              schemaVersion: 3,
              capturedAt: $capturedAt,
              targetSha: $targetSha,
              targetRunId: ($targetRunId | tonumber),
              run: $run[0],
              jobs: $jobs[0],
              artifacts: $artifacts[0],
              counts: {
                totalJobs: ($jobs[0] | length),
                discoveryJobs: ([$jobs[0][] | select(.name | startswith("Discovery F"))] | length),
                discoverySuccess: ([$jobs[0][] | select((.name | startswith("Discovery F")) and .status == "completed" and .conclusion == "success")] | length),
                discoveryFailed: ([$jobs[0][] | select((.name | startswith("Discovery F")) and .status == "completed" and .conclusion != "success")] | length),
                discoveryActive: ([$jobs[0][] | select((.name | startswith("Discovery F")) and .status != "completed")] | length),
                productJobs: ([$jobs[0][] | select(.name | startswith("Product F"))] | length),
                productSuccess: ([$jobs[0][] | select((.name | startswith("Product F")) and .status == "completed" and .conclusion == "success")] | length),
                productFailed: ([$jobs[0][] | select((.name | startswith("Product F")) and .status == "completed" and .conclusion != "success")] | length),
                productActive: ([$jobs[0][] | select((.name | startswith("Product F")) and .status != "completed")] | length),
                totalArtifacts: ($artifacts[0] | length),
                discoveryWorkerArtifacts: ([$artifacts[0][] | select(.name | startswith("rlf-discovery-worker-F"))] | length),
                productWorkerArtifacts: ([$artifacts[0][] | select(.name | startswith("rlf-product-worker-F"))] | length),
                consolidatedDiscoveryArtifacts: ([$artifacts[0][] | select(.name == "rlf-kb-official-discovery-32777623316")] | length),
                consolidatedProductArtifacts: ([$artifacts[0][] | select(.name == "rlf-kb-product-pages-32777623316")] | length)
              }
            }' > data/execution/workflow-runs-snapshot.json
          cat data/execution/workflow-runs-snapshot.json
      - name: Publish snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/workflow-runs-snapshot.json
          git commit -m 'Refresh sequence 12 product matrix'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
