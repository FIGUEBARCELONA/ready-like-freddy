name: Deploy RLF Provider Control Center to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'internal/provider-control-center-cloudflare/**'
      - '.github/workflows/deploy-provider-control-center-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rlf-provider-control-center-cloudflare
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: internal/provider-control-center-cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run check

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: internal/provider-control-center-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RLF_ADMIN_TOKEN: ${{ secrets.RLF_ADMIN_TOKEN }}
      RLF_ADMIN_EMAIL: ${{ secrets.RLF_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      - name: Verify required credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 20; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 21; }
          test -n "$RLF_ADMIN_TOKEN" || { echo 'Missing RLF_ADMIN_TOKEN'; exit 22; }

      - name: Create or reuse D1 and patch Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          response="$(curl --fail-with-body -sS -H "$auth" "$api")"
          database_id="$(jq -r '.result[] | select(.name=="rlf-provider-census") | .uuid' <<<"$response" | head -1)"
          if [ -z "$database_id" ]; then
            response="$(curl --fail-with-body -sS -X POST -H "$auth" -H 'content-type: application/json' "$api" --data '{"name":"rlf-provider-census","primary_location_hint":"weur"}')"
            database_id="$(jq -r '.result.uuid' <<<"$response")"
          fi
          test -n "$database_id" && test "$database_id" != null
          DATABASE_ID="$database_id" ADMIN_EMAIL="$RLF_ADMIN_EMAIL" node - <<'NODE'
          import fs from 'node:fs';
          const path='wrangler.jsonc';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.d1_databases[0].database_id=process.env.DATABASE_ID;
          if(process.env.ADMIN_EMAIL) data.vars.ADMIN_EMAIL=process.env.ADMIN_EMAIL;
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
          echo "database_id=$database_id" >> "$GITHUB_ENV"

      - name: Create or reuse Queues
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler queues create rlf-provider-verification || true
          npx wrangler queues create rlf-provider-verification-dlq || true

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply rlf-provider-census --remote

      - name: Store application admin secret
        shell: bash
        run: printf '%s' "$RLF_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Deploy Worker, Queue consumer and Cron
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deployment.log
          grep -Eo 'https://[^ ]+\.workers\.dev' deployment.log | tail -1 | tee deployment-url.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: rlf-provider-control-center-deployment-${{ github.run_id }}
          path: |
            internal/provider-control-center-cloudflare/deployment.log
            internal/provider-control-center-cloudflare/deployment-url.txt
          if-no-files-found: warn
          retention-days: 30
