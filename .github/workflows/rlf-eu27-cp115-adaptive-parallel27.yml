name: RLF EU27 CP115 adaptive Parallel27 continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-eu27-cp115-adaptive-parallel27.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  parallel27:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix:
        lane: [L01,L02,L03,L04,L05,L06,L07,L08,L09,L10,L11,L12,L13,L14,L15,L16,L17,L18,L19,L20,L21,L22,L23,L24,L25,L26,L27]
    env:
      GH_TOKEN: ${{ github.token }}
      LANE: ${{ matrix.lane }}
      CP113_RUN: '33710876974'
      CP114_RUN: '33711366662'
    steps:
      - name: Recover immutable predecessor certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pred
          if [ "$LANE" = "L09" ]; then
            gh run download "$CP113_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP113-LANE-L09" -D pred
          else
            gh run download "$CP114_RUN" -R "$GITHUB_REPOSITORY" -n "RLF-EU27-CP114-LANE-$LANE" -D pred
          fi
          test -f "pred/$LANE.json"
      - name: Execute only the unique work authorized by predecessor state
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q shapely
          python3 - <<'PY'
          import os,json,re,html,time,hashlib,urllib.parse,urllib.request,ssl
          from pathlib import Path
          from shapely.geometry import shape,box,Point,mapping
          lane=os.environ['LANE']
          p=json.load(open(f'pred/{lane}.json',encoding='utf-8'))
          UA='Mozilla/5.0 RLF-EU27-CP115/1.0'
          endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']

          def overpass(q,seed):
              last=None
              for attempt in range(4):
                  ep=endpoints[(seed+attempt)%2]
                  try:
                      req=urllib.request.Request(ep,data=urllib.parse.urlencode({'data':q}).encode(),headers={'User-Agent':UA})
                      with urllib.request.urlopen(req,timeout=95) as r: body=r.read();status=getattr(r,'status',200)
                      return json.loads(body),ep,status,None
                  except Exception as e:
                      last=type(e).__name__+': '+str(e);time.sleep(1.1*(attempt+1))
              return None,None,None,last

          def fetch(url,timeout=18,maxbytes=220000):
              if not url:return {'ok':False,'url':None,'status':None,'text':'','error':'NO_URL'}
              us=[url] if '://' in url else ['https://'+url]
              if url.startswith('http://'): us=[url,'https://'+url[7:]]
              last=None
              for u in us:
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':UA,'Accept-Language':'en,de,fr,nl,it,es,pt,sv,da,fi,et,lv,lt,pl,cs,sk,sl,hr,hu,ro,bg,el;q=0.8'})
                      with urllib.request.urlopen(req,timeout=timeout,context=ssl.create_default_context()) as r:
                          body=r.read(maxbytes).decode('utf-8','replace');status=getattr(r,'status',200)
                      txt=html.unescape(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',body)))
                      return {'ok':True,'url':u,'status':status,'text':txt[:100000],'error':None}
                  except Exception as e:last=type(e).__name__+': '+str(e)
              return {'ok':False,'url':us[-1],'status':None,'text':'','error':last}

          def terminalize(cands,city):
              apparel_re=re.compile(r'\b(second.?hand|vintage|preloved|thrift|clothing|clothes|apparel|fashion|kleidung|mode|ropa|vetement|vêtement|kleding|abbigliamento|moda)\b',re.I)
              legal_re=re.compile(r'\b(impressum|legal notice|mentions légales|company|gmbh|ag\b|bv\b|nv\b|srl\b|spa\b|sl\b|lda\b|oy\b|ab\b|aps\b|as\b|kft\b|sro\b|uab\b|ou\b|oü\b|sia\b|eood\b|d\.o\.o|vat|btw|tva|iva|nif|siren|siret|company number|registration number)\b',re.I)
              out=[]
              for i,c in enumerate(cands):
                  direct=fetch(c.get('website'))
                  text=' '.join([str(c.get('name') or ''),str(c.get('shop') or ''),str(c.get('second_hand') or ''),direct['text'][:60000]])
                  apparel=bool(apparel_re.search(text)) or (c.get('shop')=='clothes' and c.get('second_hand') in ('yes','only'))
                  legal=bool(legal_re.search(direct['text'])) if direct['ok'] else False
                  trace=bool(c.get('website') or c.get('phone') or c.get('email'))
                  current=direct['ok'] or bool(c.get('name'))
                  status=('AAA_READY_CANDIDATE_PENDING_GLOBAL_DEDUP' if apparel and legal and trace and current else
                          'HOLD_NEEDS_RESPONSIBLE_OPERATOR_OR_PRIMARY_EVIDENCE' if apparel else
                          'REJECT_NON_APPAREL_OR_UNPROVEN_APPAREL')
                  out.append({**c,'primary_web_reachable':direct['ok'],'primary_status':direct['status'],'legal_identity_marker':legal,'traceability':trace,'terminal_status':status,'direct_error':direct['error']})
                  time.sleep(.12)
              return out

          def strict_exhaust(zone,known,iso,city,zid):
              minx,miny,maxx,maxy=zone.bounds;b=f'{miny},{minx},{maxy},{maxx}'
              qs=[
                ('Q01',f'[out:json][timeout:75];nwr[shop=second_hand]({b});out center tags;'),
                ('Q02',f'[out:json][timeout:75];nwr[shop=clothes][second_hand=yes]({b});out center tags;'),
                ('Q03',f'[out:json][timeout:75];nwr[shop=clothes][second_hand=only]({b});out center tags;'),
                ('Q04',f'[out:json][timeout:75];nwr[shop=clothes][second_hand]({b});out center tags;'),
                ('Q05',f'[out:json][timeout:75];nwr[shop=vintage]({b});out center tags;'),
                ('Q06',f'[out:json][timeout:75];nwr[second_hand=yes][shop]({b});out center tags;'),
                ('Q07',f'[out:json][timeout:75];nwr[second_hand=only][shop]({b});out center tags;'),
                ('Q08',f'[out:json][timeout:75];nwr[shop=charity]({b});out center tags;'),
                ('Q09',f'[out:json][timeout:75];nwr[name~"second.?hand",i]({b});out center tags;'),
                ('Q10',f'[out:json][timeout:75];nwr[name~"vintage",i]({b});out center tags;'),
                ('Q11',f'[out:json][timeout:75];nwr[name~"thrift",i]({b});out center tags;'),
                ('Q12',f'[out:json][timeout:75];nwr[name~"pre.?loved",i]({b});out center tags;'),
                ('Q13',f'[out:json][timeout:75];nwr[name~"used clothing|gebraucht|friperie|kringwinkel",i]({b});out center tags;'),
                ('Q14',f'[out:json][timeout:75];nwr[name~"seconda mano|segunda mano|second hand",i]({b});out center tags;'),
                ('Q15',f'[out:json][timeout:75];nwr[shop=clothes][second_hand!=no]({b});out center tags;')]
              streak=0;new={};records=[];technical=False
              for qi,(qid,q) in enumerate(qs):
                  data,ep,status,err=overpass(q,int(lane[1:])+qi)
                  if data is None:
                      technical=True;records.append({'qid':qid,'status':'TECHNICAL_FAILURE','error':err});break
                  hits=[]
                  for el in data.get('elements',[]):
                      lat=el.get('lat');lon=el.get('lon');cen=el.get('center') or {}
                      if lat is None:lat=cen.get('lat')
                      if lon is None:lon=cen.get('lon')
                      if lat is None or lon is None or not zone.covers(Point(float(lon),float(lat))):continue
                      key=f"{el.get('type')}:{el.get('id')}"
                      if key not in known:
                          t=el.get('tags') or {};new[key]={'osm_key':key,'name':t.get('name'),'website':t.get('website') or t.get('contact:website'),'phone':t.get('phone') or t.get('contact:phone'),'email':t.get('email') or t.get('contact:email'),'operator':t.get('operator'),'shop':t.get('shop'),'second_hand':t.get('second_hand'),'lat':float(lat),'lon':float(lon),'first_query':qid};hits.append(key)
                  if hits:
                      streak=0;records.append({'qid':qid,'status':'SUCCESS_NEW_IDENTITY','new':len(set(hits))});break
                  streak+=1;records.append({'qid':qid,'status':'SUCCESS_ZERO_NEW','streak_after':streak})
                  time.sleep(.2)
              return {'records':records,'new':list(new.values()),'technical':technical,'streak':streak,'closed':(not technical and not new and streak==15)}

          # L09: predecessor is CP113 closure; advance exactly one grid and perform fresh discovery, then exhaust only if discovery is empty.
          if lane=='L09':
              assert p.get('zone_closed') is True and p.get('exhaustion_streak')=='15/15'
              gjurl='https://gisco-services.ec.europa.eu/distribution/v2/lau/geojson/LAU_RG_01M_2024_4326.geojson'
              req=urllib.request.Request(gjurl,headers={'User-Agent':UA})
              gj=json.loads(urllib.request.urlopen(req,timeout=120).read())
              feat=next(f for f in gj['features'] if str((f.get('properties') or {}).get('LAU_ID') or (f.get('properties') or {}).get('GISCO_ID'))==str(p['city_id']))
              g=shape(feat['geometry']);minx,miny,maxx,maxy=g.bounds;dx=(maxx-minx)/3;dy=(maxy-miny)/3
              physical=[]
              for rr in range(1,4):
                  for cc in range(1,4):
                      z=g.intersection(box(minx+(cc-1)*dx,miny+(rr-1)*dy,minx+cc*dx,miny+rr*dy))
                      if not z.is_empty and z.area>1e-15:physical.append((f"{p['city_id']}_G{rr}{cc}",z,rr,cc))
              ids=[x[0] for x in physical];pos=ids.index(p['zone_id']);assert pos+1<len(physical)
              zid,zone,rr,cc=physical[pos+1];b=zone.bounds;bb=f'{b[1]},{b[0]},{b[3]},{b[2]}'
              vectors=[('D1',f'[out:json][timeout:80];nwr[shop=second_hand]({bb});out center tags;'),('D2',f'[out:json][timeout:80];nwr[shop=clothes][second_hand]({bb});out center tags;'),('D3',f'[out:json][timeout:80];nwr[shop=vintage]({bb});out center tags;'),('D4',f'[out:json][timeout:80];nwr[shop=clothes][clothes=second_hand]({bb});out center tags;')]
              merged={};vrecs=[];technical=0
              for vi,(vk,q) in enumerate(vectors):
                  data,ep,status,err=overpass(q,9+vi)
                  if data is None:technical+=1;vrecs.append({'vector':vk,'status':'TECHNICAL_FAILURE','error':err});continue
                  kept=0
                  for el in data.get('elements',[]):
                      lat=el.get('lat');lon=el.get('lon');cen=el.get('center') or {}
                      if lat is None:lat=cen.get('lat')
                      if lon is None:lon=cen.get('lon')
                      if lat is None or lon is None or not zone.covers(Point(float(lon),float(lat))):continue
                      t=el.get('tags') or {};key=f"{el.get('type')}:{el.get('id')}";kept+=1
                      merged.setdefault(key,{'osm_key':key,'name':t.get('name'),'website':t.get('website') or t.get('contact:website'),'phone':t.get('phone') or t.get('contact:phone'),'email':t.get('email') or t.get('contact:email'),'operator':t.get('operator'),'shop':t.get('shop'),'second_hand':t.get('second_hand'),'lat':float(lat),'lon':float(lon),'vectors':[]})['vectors'].append(vk)
                  vrecs.append({'vector':vk,'status':'SUCCESS','in_zone':kept})
              cands=list(merged.values())
              if technical:
                  result={'schema':'RLF_EU27_CP115_LANE_V1','lane_id':lane,'iso':p['iso'],'city_id':p['city_id'],'city_name':p['city_name'],'zone_id':zid,'action':'TECHNICAL_RETRY_REQUIRED','technical_failures':technical,'canonical_delta':0}
              elif cands:
                  term=terminalize(cands,p['city_name']);result={'schema':'RLF_EU27_CP115_LANE_V1','lane_id':lane,'iso':p['iso'],'city_id':p['city_id'],'city_name':p['city_name'],'zone_id':zid,'action':'ADVANCED_DISCOVERED_AND_TERMINALIZED','discovery_candidates':len(cands),'terminalized':len(term),'aaa_ready':sum(x['terminal_status'].startswith('AAA_READY') for x in term),'hold':sum(x['terminal_status'].startswith('HOLD') for x in term),'reject':sum(x['terminal_status'].startswith('REJECT') for x in term),'zone_closed':False,'exhaustion_streak':'0/15','candidates':term,'canonical_delta':0}
              else:
                  ex=strict_exhaust(zone,set(),p['iso'],p['city_name'],zid);result={'schema':'RLF_EU27_CP115_LANE_V1','lane_id':lane,'iso':p['iso'],'city_id':p['city_id'],'city_name':p['city_name'],'zone_id':zid,'action':'ADVANCED_EMPTY_AND_EXHAUSTED','discovery_candidates':0,'new_identity_count':len(ex['new']),'new_identities':ex['new'],'technical_failure':ex['technical'],'zone_closed':ex['closed'],'exhaustion_streak':f"{ex['streak']}/15",'queries':ex['records'],'canonical_delta':0}
          else:
              action=p.get('action')
              if action!='ADVANCED_ONE_CANONICAL_ZONE':
                  result={'schema':'RLF_EU27_CP115_LANE_V1','lane_id':lane,'iso':p['iso'],'city_id':p['city_id'],'city_name':p['city_name'],'zone_id':p.get('previous_zone_id'),'action':'SKIP_LOCKED_NO_NEW_QUERY','reason':action,'canonical_delta':0}
              elif (p.get('technical_failures') or 0)>0:
                  result={'schema':'RLF_EU27_CP115_LANE_V1','lane_id':lane,'iso':p['iso'],'city_id':p['city_id'],'city_name':p['city_name'],'zone_id':p['next_zone_id'],'action':'TECHNICAL_RETRY_REQUIRED','technical_failures':p['technical_failures'],'canonical_delta':0}
              elif (p.get('candidate_count') or 0)>0:
                  term=terminalize(p.get('candidates') or [],p['city_name']);result={'schema':'RLF_EU27_CP115_LANE_V1','lane_id':lane,'iso':p['iso'],'city_id':p['city_id'],'city_name':p['city_name'],'zone_id':p['next_zone_id'],'action':'TERMINALIZED_CP114_NEW_ZONE_CANDIDATES','terminalized':len(term),'aaa_ready':sum(x['terminal_status'].startswith('AAA_READY') for x in term),'hold':sum(x['terminal_status'].startswith('HOLD') for x in term),'reject':sum(x['terminal_status'].startswith('REJECT') for x in term),'zone_closed':False,'exhaustion_streak':'0/15','candidates':term,'canonical_delta':0}
              else:
                  zone=shape(p['zone_geometry']);ex=strict_exhaust(zone,set(),p['iso'],p['city_name'],p['next_zone_id']);result={'schema':'RLF_EU27_CP115_LANE_V1','lane_id':lane,'iso':p['iso'],'city_id':p['city_id'],'city_name':p['city_name'],'zone_id':p['next_zone_id'],'action':'STRICT_EXHAUSTION_NEW_ZONE','new_identity_count':len(ex['new']),'new_identities':ex['new'],'technical_failure':ex['technical'],'zone_closed':ex['closed'],'exhaustion_streak':f"{ex['streak']}/15",'queries':ex['records'],'canonical_delta':0}
          result['promotion_allowed']=False
          raw=json.dumps(result,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode();result['sha256']=hashlib.sha256(raw).hexdigest()
          Path('out').mkdir(exist_ok=True);Path(f'out/{lane}.json').write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({k:result.get(k) for k in ['lane_id','zone_id','action','terminalized','aaa_ready','hold','reject','new_identity_count','exhaustion_streak','zone_closed','technical_failures']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP115-LANE-${{ matrix.lane }}
          path: out/${{ matrix.lane }}.json
          retention-days: 30

  consolidate:
    needs: parallel27
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RLF-EU27-CP115-LANE-*
          path: lanes
          merge-multiple: true
      - name: Consolidate adaptive Parallel27 wave
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,json,hashlib
          rows=[json.load(open(f,encoding='utf-8')) for f in glob.glob('lanes/L*.json')]
          rep={'schema':'RLF_EU27_CP115_CONSOLIDATED_V1','lanes_received':len(rows),'searched_or_processed':sum(r.get('action')!='SKIP_LOCKED_NO_NEW_QUERY' for r in rows),'locked_skips':sum(r.get('action')=='SKIP_LOCKED_NO_NEW_QUERY' for r in rows),'terminalized':sum(r.get('terminalized',0) for r in rows),'aaa_ready_pending_master_dedup':sum(r.get('aaa_ready',0) for r in rows),'hold':sum(r.get('hold',0) for r in rows),'reject':sum(r.get('reject',0) for r in rows),'new_identities_during_exhaustion':sum(r.get('new_identity_count',0) for r in rows),'zones_closed_15_of_15':sum(bool(r.get('zone_closed')) for r in rows),'technical_failure_lanes':sum(bool(r.get('technical_failure')) or r.get('action')=='TECHNICAL_RETRY_REQUIRED' for r in rows),'canonical_delta':0,'canonical_counts_unchanged':{'verified':413,'eligible':70,'hold':343,'remaining':9587},'quality_gate':'PASS' if len(rows)==27 else 'FAIL_CLOSED'}
          rep['sha256']=hashlib.sha256(json.dumps(rep,sort_keys=True,separators=(',',':')).encode()).hexdigest();open('RLF_EU27_CP115_CONSOLIDATED.json','w').write(json.dumps(rep,indent=2));print(json.dumps(rep,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP115-CONSOLIDATED
          path: RLF_EU27_CP115_CONSOLIDATED.json
          retention-days: 30
