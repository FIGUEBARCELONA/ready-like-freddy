name: Fred Perry fast six retailer maps

on:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - tools/fast_sitemap_retailer_extract.py
      - .github/workflows/fred-perry-fast-six.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        rank: [6, 7, 12, 13, 14, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: |
          rank=$(printf '%02d' '${{ matrix.rank }}')
          python tools/fast_sitemap_retailer_extract.py --rank '${{ matrix.rank }}' --out "artifact/site_${rank}"
      - run: |
          rank=$(printf '%02d' '${{ matrix.rank }}')
          cd "artifact/site_${rank}"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fred-perry-fast-site-${{ matrix.rank }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
