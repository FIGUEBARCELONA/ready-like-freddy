name: Build verified WordPress WooCommerce runtime bundle

on:
  push:
    paths:
      - '.github/workflows/build-wordpress-runtime-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORDPRESS_IMAGE: wordpress:7.0.2-php8.3-apache
  WORDPRESS_CLI_IMAGE: wordpress:cli-2.12.0-php8.3
  MARIADB_IMAGE: mariadb:11.4.12
  WOOCOMMERCE_VERSION: '10.9.4'

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify runner capabilities
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          docker compose version
          command -v curl
          command -v sha256sum
          command -v zstd

      - name: Create deterministic local runtime contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/evidence runtime/oci runtime/plugin runtime/db
          cat > runtime/compose.yml <<'COMPOSE'
          services:
            db:
              image: ${MARIADB_IMAGE}
              environment:
                MARIADB_DATABASE: rlf_wordpress
                MARIADB_USER: rlf_wp
                MARIADB_PASSWORD: local-test-only
                MARIADB_ROOT_PASSWORD: local-root-test-only
              healthcheck:
                test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
                interval: 5s
                timeout: 5s
                retries: 30
              volumes:
                - mariadb_data:/var/lib/mysql
            wordpress:
              image: ${WORDPRESS_IMAGE}
              depends_on:
                db:
                  condition: service_healthy
              environment:
                WORDPRESS_DB_HOST: db:3306
                WORDPRESS_DB_NAME: rlf_wordpress
                WORDPRESS_DB_USER: rlf_wp
                WORDPRESS_DB_PASSWORD: local-test-only
                WORDPRESS_DEBUG: "1"
              ports:
                - "127.0.0.1:8080:80"
              volumes:
                - wordpress_data:/var/www/html
            cli:
              image: ${WORDPRESS_CLI_IMAGE}
              depends_on:
                db:
                  condition: service_healthy
              environment:
                WORDPRESS_DB_HOST: db:3306
                WORDPRESS_DB_NAME: rlf_wordpress
                WORDPRESS_DB_USER: rlf_wp
                WORDPRESS_DB_PASSWORD: local-test-only
              user: "33:33"
              volumes:
                - wordpress_data:/var/www/html
              entrypoint: ["wp", "--path=/var/www/html"]
          volumes:
            mariadb_data:
            wordpress_data:
          COMPOSE
          docker compose --env-file <(printf '%s\n' \
            "WORDPRESS_IMAGE=${WORDPRESS_IMAGE}" \
            "WORDPRESS_CLI_IMAGE=${WORDPRESS_CLI_IMAGE}" \
            "MARIADB_IMAGE=${MARIADB_IMAGE}") \
            -f runtime/compose.yml config > runtime/compose.rendered.yml

      - name: Pull and lock OCI images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${WORDPRESS_IMAGE}"
          docker pull "${WORDPRESS_CLI_IMAGE}"
          docker pull "${MARIADB_IMAGE}"
          {
            printf 'WORDPRESS_IMAGE=%s\n' "$(docker image inspect --format='{{index .RepoDigests 0}}' "${WORDPRESS_IMAGE}")"
            printf 'WORDPRESS_CLI_IMAGE=%s\n' "$(docker image inspect --format='{{index .RepoDigests 0}}' "${WORDPRESS_CLI_IMAGE}")"
            printf 'MARIADB_IMAGE=%s\n' "$(docker image inspect --format='{{index .RepoDigests 0}}' "${MARIADB_IMAGE}")"
          } | tee runtime/IMAGE_LOCK.env
          grep -Eq '^WORDPRESS_IMAGE=wordpress@sha256:[0-9a-f]{64}$' runtime/IMAGE_LOCK.env
          grep -Eq '^WORDPRESS_CLI_IMAGE=wordpress@sha256:[0-9a-f]{64}$' runtime/IMAGE_LOCK.env
          grep -Eq '^MARIADB_IMAGE=mariadb@sha256:[0-9a-f]{64}$' runtime/IMAGE_LOCK.env

      - name: Download and verify WooCommerce package
        shell: bash
        run: |
          set -euo pipefail
          url="https://downloads.wordpress.org/plugin/woocommerce.${WOOCOMMERCE_VERSION}.zip"
          curl --fail --location --retry 3 "$url" -o runtime/plugin/woocommerce.zip
          test -s runtime/plugin/woocommerce.zip
          unzip -p runtime/plugin/woocommerce.zip woocommerce/woocommerce.php \
            | grep -F "Version: ${WOOCOMMERCE_VERSION}"
          sha256sum runtime/plugin/woocommerce.zip | tee runtime/plugin/woocommerce.zip.sha256
          printf '%s\n' "$url" > runtime/plugin/SOURCE_URL.txt

      - name: Start real local WordPress and MariaDB runtime
        shell: bash
        run: |
          set -euo pipefail
          export WORDPRESS_IMAGE WORDPRESS_CLI_IMAGE MARIADB_IMAGE
          docker compose -f runtime/compose.yml up -d db wordpress
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/wp-admin/install.php >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f runtime/compose.yml ps
              docker compose -f runtime/compose.yml logs --no-color
              exit 1
            fi
            sleep 2
          done
          docker compose -f runtime/compose.yml ps --format json > runtime/evidence/compose-ps.json

      - name: Install WordPress and WooCommerce and verify exact versions
        shell: bash
        run: |
          set -euo pipefail
          export WORDPRESS_IMAGE WORDPRESS_CLI_IMAGE MARIADB_IMAGE
          compose=(docker compose -f runtime/compose.yml)
          "${compose[@]}" run --rm cli core install \
            --url=http://127.0.0.1:8080 \
            --title='Ready Like Freddy local verification' \
            --admin_user=rlf_local_admin \
            --admin_password='local-test-only-not-production' \
            --admin_email=local@example.invalid \
            --skip-email
          wordpress_container=$("${compose[@]}" ps -q wordpress)
          docker cp runtime/plugin/woocommerce.zip "${wordpress_container}:/var/www/html/woocommerce.zip"
          "${compose[@]}" run --rm cli plugin install /var/www/html/woocommerce.zip --activate --force
          core_version=$("${compose[@]}" run --rm cli core version)
          woo_version=$("${compose[@]}" run --rm cli plugin get woocommerce --field=version)
          test "$core_version" = "7.0.2"
          test "$woo_version" = "${WOOCOMMERCE_VERSION}"
          {
            printf 'wordpress=%s\n' "$core_version"
            printf 'woocommerce=%s\n' "$woo_version"
            printf 'mariadb=%s\n' "$(docker compose -f runtime/compose.yml exec -T db mariadb --version | head -1)"
          } | tee runtime/evidence/versions.txt
          curl --fail --silent --show-error http://127.0.0.1:8080/ > runtime/evidence/storefront.html
          grep -F 'Ready Like Freddy local verification' runtime/evidence/storefront.html
          "${compose[@]}" run --rm cli option get siteurl | tee runtime/evidence/siteurl.txt
          "${compose[@]}" run --rm cli plugin status woocommerce | tee runtime/evidence/woocommerce-status.txt

      - name: Verify idempotent restart and database durability
        shell: bash
        run: |
          set -euo pipefail
          export WORDPRESS_IMAGE WORDPRESS_CLI_IMAGE MARIADB_IMAGE
          compose=(docker compose -f runtime/compose.yml)
          before=$("${compose[@]}" run --rm cli option get siteurl)
          "${compose[@]}" restart db wordpress
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then break; fi
            [ "$attempt" -lt 60 ] || exit 1
            sleep 2
          done
          after=$("${compose[@]}" run --rm cli option get siteurl)
          test "$before" = "$after"
          "${compose[@]}" exec -T db mariadb-dump \
            -urlf_wp -plocal-test-only rlf_wordpress > runtime/db/rlf_wordpress.sql
          test -s runtime/db/rlf_wordpress.sql
          sha256sum runtime/db/rlf_wordpress.sql > runtime/db/rlf_wordpress.sql.sha256

      - name: Export OCI images and provenance
        shell: bash
        run: |
          set -euo pipefail
          docker image save "${WORDPRESS_IMAGE}" | zstd -T0 -19 -o runtime/oci/wordpress.tar.zst
          docker image save "${WORDPRESS_CLI_IMAGE}" | zstd -T0 -19 -o runtime/oci/wordpress-cli.tar.zst
          docker image save "${MARIADB_IMAGE}" | zstd -T0 -19 -o runtime/oci/mariadb.tar.zst
          cat > runtime/PROVENANCE.txt <<EOF
          Generated by GitHub Actions on ubuntu-24.04.
          WordPress requested tag: ${WORDPRESS_IMAGE}
          WordPress CLI requested tag: ${WORDPRESS_CLI_IMAGE}
          MariaDB requested tag: ${MARIADB_IMAGE}
          WooCommerce version: ${WOOCOMMERCE_VERSION}
          WooCommerce source: https://downloads.wordpress.org/plugin/woocommerce.${WOOCOMMERCE_VERSION}.zip
          This bundle contains no production secrets or commercial data.
          EOF
          find runtime -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > runtime/SHA256SUMS.txt
          sha256sum -c runtime/SHA256SUMS.txt

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          export WORDPRESS_IMAGE WORDPRESS_CLI_IMAGE MARIADB_IMAGE
          docker compose -f runtime/compose.yml logs --no-color > runtime/evidence/compose.log 2>&1 || true
          docker compose -f runtime/compose.yml down -v --remove-orphans || true

      - name: Upload verified runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: rlf-wordpress-7.0.2-woocommerce-10.9.4-mariadb-11.4.12-linux-x64
          path: runtime
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
