name: RLF KB W003G exact physical galleries

on:
  workflow_dispatch:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - tools/collect_rlf_kb_w003g_exact_physical_galleries.py
      - .github/workflows/rlf-kb-w003g-exact-physical-galleries.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 curl_cffi pillow

      - name: Collect exact physical galleries
        run: python tools/collect_rlf_kb_w003g_exact_physical_galleries.py

      - name: Package auditable output
        run: zip -r RLF_KB_W003G_EXACT_PHYSICAL_GALLERIES_V1.zip w003g-exact-physical-galleries

      - name: Upload W003G package
        uses: actions/upload-artifact@v4
        with:
          name: RLF_KB_W003G_EXACT_PHYSICAL_GALLERIES_V1
          path: RLF_KB_W003G_EXACT_PHYSICAL_GALLERIES_V1.zip
          if-no-files-found: error
          retention-days: 7
