name: RLF sequence 15 catalog filter repair

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence15-catalog-filter-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
          fetch-depth: 0
      - name: Exclude non-catalog official routes before lane construction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/execution/prepare-official-queue.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''function isEligibleDiscoveryUrl(url) {
            const path = url.pathname.toLowerCase();
            if (/\\.(?:jpg|jpeg|png|webp|gif|svg|css|js|ico|pdf|xml)(?:$|\\?)/i.test(path)) return false;
            if (/\\/(?:account|checkout|cart|customer|privacy|terms|help|contact|returns|delivery|stores?|shops?|community|size-guides?)(?:\\/|$)/i.test(path)) return false;
            if (/\\/[a-z0-9-]+-[a-z]{1,5}\\d{3,6}(?:-[a-z])?-[a-z0-9]{2,5}\\.html$/i.test(path)) return false;
            if (/\\/site-map\\/?$/i.test(path)) return false;
            return true;
          }'''
          new = '''function isEligibleDiscoveryUrl(url) {
            const path = url.pathname.toLowerCase();
            if (/\\.(?:jpg|jpeg|png|webp|gif|svg|css|js|ico|pdf|xml)(?:$|\\?)/i.test(path)) return false;
            if (/\\/(?:account|checkout|cart|customer|terms|contact|returns|delivery|stores?|shops?|community|size-guides?|auth|login|register|site-map|sitemap)(?:\\/|$)/i.test(path)) return false;
            if (/\\/(?:shop-finder|store-finder|helpcentre|help-center|help-centre|df-social-connect|social-connect)(?:\\/|$)/i.test(path)) return false;
            if (/(?:privacy|privacidad|privacidade|datenschutz|confidentialit|cookies?|legal|accessibility)/i.test(path)) return false;
            if (/\\/[a-z0-9-]+-[a-z]{1,5}\\d{3,6}(?:-[a-z])?-[a-z0-9]{2,5}\\.html$/i.test(path)) return false;
            return true;
          }'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one legacy eligibility block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/execution/prepare-official-queue.mjs
          rm .github/workflows/rlf-sequence15-catalog-filter-repair.yml
      - name: Commit audited repair
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/execution/prepare-official-queue.mjs .github/workflows/rlf-sequence15-catalog-filter-repair.yml
          git commit -m 'Exclude non-catalog routes from 50-lane discovery'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
