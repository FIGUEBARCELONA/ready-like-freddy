name: RLF sequence 14 ledger snapshot

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence14-ledger-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rlf-sequence14-ledger-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact identity and source-page ledgers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/execution
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          import { loadSourcePageLedger } from './scripts/execution/source-page-ledger.mjs';

          const identity = await loadProgressLedger();
          const sourcePages = await loadSourcePageLedger();
          const identityDelta = JSON.parse(
            await readFile('data/execution/progress-deltas/32781308211.json', 'utf8'),
          );
          const sourcePageDelta = JSON.parse(
            await readFile('data/execution/source-page-deltas/32781308211.json', 'utf8'),
          );
          const sourcePageAudit = JSON.parse(
            await readFile('data/execution/source-page-delta-audits/32781308211.json', 'utf8'),
          );
          const productManifest = JSON.parse(
            await readFile('data/execution/runs/32781308211/product-manifest.json', 'utf8'),
          );
          const ledgerAudit = JSON.parse(
            await readFile('data/execution/runs/32781308211/ledger-delta-audit.json', 'utf8'),
          );

          const snapshot = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            sourceCommitSha: process.env.GITHUB_SHA,
            sourceRunId: '32781308211',
            identity: {
              completedIdentityCount: identity.completed.identityCount,
              productUrlCaptureCount: identity.completed.productUrlCaptureCount,
              officialProductImageReferenceCount: identity.counters.officialProductImageReferenceCount,
              materialEvidenceCount: identity.counters.materialEvidenceCount,
              manufacturingClaimCount: identity.counters.manufacturingClaimCount,
              descriptionMissingIdentityCount: identity.metadataGaps.descriptionMissingIdentityCount,
              priceMissingIdentityCount: identity.metadataGaps.priceMissingIdentityCount,
              materialMissingIdentityCount: identity.metadataGaps.materialMissingIdentityCount,
              retryIdentityCount: identity.retry.identityCount,
              retryIdentityKeys: identity.retry.identities.map(item => item.identityKey).sort(),
              deltaCount: identity.deltaCount,
              latestRunId: String(identity.latestRunId),
              factoryVerifiedCount: identity.counters.factoryVerifiedCount,
              globalCanonicalProductCount: identity.counters.globalCanonicalProductCount,
              ledgerSha256: identity.ledgerSha256,
            },
            sourcePages: {
              deltaCount: sourcePages.deltaCount,
              attemptedObservationCount: sourcePages.attemptedObservationCount,
              uniqueAttemptedSourcePageCount: sourcePages.uniqueAttemptedSourcePageCount,
              ledgerSha256: sourcePages.ledgerSha256,
            },
            sequence14: {
              identityDeltaSha256: identityDelta.ledgerDeltaSha256,
              completedIdentityKeys: identityDelta.completedIdentityKeys,
              failedIdentityCount: identityDelta.failedIdentities.length,
              capturedProductUrlCount: identityDelta.capturedProductUrlCount,
              officialProductImageReferenceCount: identityDelta.counters.officialProductImageReferenceCount,
              materialEvidenceCount: identityDelta.counters.materialEvidenceCount,
              manufacturingClaimCount: identityDelta.counters.manufacturingClaimCount,
              sourcePageDeltaSha256: sourcePageDelta.sourcePageDeltaSha256,
              attemptedSourcePageCount: sourcePageDelta.attemptedSourcePageCount,
              sourcePageOverlapWithPrior: sourcePageAudit.batch.overlapWithPrior,
              productWorkerCount: productManifest.workerCount,
              productQualityGatePassed: productManifest.qualityGatePassed,
              productTotals: productManifest.totals,
              ledgerDeltaAuditPassed: ledgerAudit.passed,
              ledgerDeltaOverlapWithPrior: ledgerAudit.batch.overlapWithPrior,
              completedAndFailedOverlap: ledgerAudit.batch.completedAndFailedOverlap,
            },
          };
          snapshot.passed =
            snapshot.identity.completedIdentityCount === 1354 &&
            snapshot.identity.productUrlCaptureCount === 2152 &&
            snapshot.identity.officialProductImageReferenceCount === 11682 &&
            snapshot.identity.materialEvidenceCount === 1745 &&
            snapshot.identity.manufacturingClaimCount === 64 &&
            snapshot.identity.descriptionMissingIdentityCount === 823 &&
            snapshot.identity.priceMissingIdentityCount === 767 &&
            snapshot.identity.materialMissingIdentityCount === 86 &&
            snapshot.identity.retryIdentityCount === 6 &&
            snapshot.identity.deltaCount === 9 &&
            snapshot.identity.latestRunId === '32781308211' &&
            snapshot.identity.factoryVerifiedCount === 0 &&
            snapshot.identity.globalCanonicalProductCount === 0 &&
            snapshot.sourcePages.deltaCount === 7 &&
            snapshot.sourcePages.attemptedObservationCount === 1448 &&
            snapshot.sourcePages.uniqueAttemptedSourcePageCount === 1163 &&
            snapshot.sourcePages.ledgerSha256 === '8de01546abe681f1c271755341f19641083cb59f32cbd63bd7eae1f8980fee24' &&
            snapshot.sequence14.identityDeltaSha256 === '6539e13f665c18b90a7956980605a06b87598cbb3a48137a5eaad9f42d70e6eb' &&
            JSON.stringify(snapshot.sequence14.completedIdentityKeys) === JSON.stringify(['B9352|X89','M2407|X86','M3574|84A']) &&
            snapshot.sequence14.failedIdentityCount === 0 &&
            snapshot.sequence14.capturedProductUrlCount === 3 &&
            snapshot.sequence14.officialProductImageReferenceCount === 28 &&
            snapshot.sequence14.materialEvidenceCount === 3 &&
            snapshot.sequence14.manufacturingClaimCount === 1 &&
            snapshot.sequence14.sourcePageDeltaSha256 === '060379a5365f276ba7426f877c9e4b7f12eacfc6b2c33376817f61243ca4e914' &&
            snapshot.sequence14.attemptedSourcePageCount === 250 &&
            snapshot.sequence14.sourcePageOverlapWithPrior.length === 0 &&
            snapshot.sequence14.productWorkerCount === 50 &&
            snapshot.sequence14.productQualityGatePassed === true &&
            snapshot.sequence14.ledgerDeltaAuditPassed === true &&
            snapshot.sequence14.ledgerDeltaOverlapWithPrior.length === 0 &&
            snapshot.sequence14.completedAndFailedOverlap.length === 0;
          await writeFile(
            'data/execution/sequence14-ledger-snapshot.json',
            `${JSON.stringify(snapshot, null, 2)}\n`,
          );
          console.log(JSON.stringify(snapshot, null, 2));
          if (!snapshot.passed) throw new Error('Sequence 14 exact ledger snapshot failed');
          NODE
      - name: Publish exact ledger snapshot
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/sequence14-ledger-snapshot.json
          git commit -m 'Persist exact sequence 14 ledger snapshot'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
