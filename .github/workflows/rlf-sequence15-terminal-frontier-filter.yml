name: RLF sequence 15 terminal frontier filter

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence15-terminal-frontier-filter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
          fetch-depth: 0
      - name: Exclude residual service and corporate statement routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/execution/prepare-official-queue.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "  if (/\\/(?:shop-finder|store-finder|helpcentre|help-center|help-centre|df-social-connect|social-connect)(?:\\/|$)/i.test(path)) return false;\n"
          addition = marker + "  if (/\\/(?:customercare|customer-care|aboutus\\/statements|about-us\\/statements)(?:\\/|$)/i.test(path)) return false;\n"
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one residual route marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, addition), encoding='utf-8')
          PY
          node --check scripts/execution/prepare-official-queue.mjs
          rm .github/workflows/rlf-sequence15-terminal-frontier-filter.yml
      - name: Commit terminal frontier filter
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/execution/prepare-official-queue.mjs .github/workflows/rlf-sequence15-terminal-frontier-filter.yml
          git commit -m 'Exclude residual non-catalog routes from terminal frontier'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
