name: RLF sequence 15 eligible exclusion recalibration

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence15-eligible-exclusion-recalibration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recalibrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
          fetch-depth: 0
      - name: Recalibrate gate to eligible source-page intersection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rlf-source-page-rotation-validation.yml')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("PREFLIGHT_REVISION: '7'", "PREFLIGHT_REVISION: '8'", 1),
              ("minimumPreviouslyAttemptedSourcePageExclusions: 1100", "minimumPreviouslyAttemptedSourcePageExclusions: 800", 1),
              ("result.excludedPreviouslyAttemptedSourcePageCount >= 1100", "result.excludedPreviouslyAttemptedSourcePageCount >= 800", 1),
              ("schemaVersion: 7,", "schemaVersion: 8,", 1),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {old!r}, found {count}')
              text = text.replace(old, new)
          marker = "            excludedPreviouslyAttemptedSourcePageCount: queue.excludedPreviouslyAttemptedSourcePageCount,\n"
          addition = marker + "            minimumEligiblePreviouslyAttemptedSourcePageExclusions: 800,\n"
          if text.count(marker) != 1:
              raise SystemExit('Expected one excluded-page result marker')
          text = text.replace(marker, addition)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/rlf-sequence15-eligible-exclusion-recalibration.yml
      - name: Commit audited gate recalibration
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rlf-source-page-rotation-validation.yml .github/workflows/rlf-sequence15-eligible-exclusion-recalibration.yml
          git commit -m 'Recalibrate sequence 15 gate to eligible source pages'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
