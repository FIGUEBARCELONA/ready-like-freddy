name: RLF KB W003E Japanese resale physical

on:
  workflow_dispatch:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - tools/collect_rlf_kb_w003e_jp_resale_physical.py
      - .github/workflows/rlf-kb-w003e-jp-resale-physical.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 curl_cffi pillow
      - name: Collect Japanese resale physical evidence
        run: python tools/collect_rlf_kb_w003e_jp_resale_physical.py
      - name: Package
        run: zip -r RLF_KB_W003E_JP_RESALE_PHYSICAL_V1.zip w003e-jp-resale-physical
      - uses: actions/upload-artifact@v4
        with:
          name: RLF_KB_W003E_JP_RESALE_PHYSICAL_V1
          path: RLF_KB_W003E_JP_RESALE_PHYSICAL_V1.zip
          if-no-files-found: error
          retention-days: 7
