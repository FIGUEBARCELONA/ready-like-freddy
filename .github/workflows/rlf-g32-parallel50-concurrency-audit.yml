name: RLF G32 Parallel50 concurrency audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-g32-parallel50-concurrency-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate peak real concurrency for run 33628150433
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          url='https://api.github.com/repos/FIGUEBARCELONA/ready-like-freddy/actions/runs/33628150433/jobs?per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          jobs=[j for j in data['jobs'] if j['name'].startswith('G32 A')]
          events=[]
          for j in jobs:
            s=datetime.datetime.fromisoformat(j['started_at'].replace('Z','+00:00'))
            e=datetime.datetime.fromisoformat(j['completed_at'].replace('Z','+00:00'))
            events.append((s,1,j['name']))
            events.append((e,-1,j['name']))
          # completions first at exact same timestamp, then starts
          events.sort(key=lambda x:(x[0],x[1]))
          active=0; peak=0; peak_at=None
          for t,delta,name in events:
            active += delta
            if active>peak: peak=active; peak_at=t.isoformat()
          starts=sorted(j['started_at'] for j in jobs)
          ends=sorted(j['completed_at'] for j in jobs)
          report={
            'source_run_id':33628150433,
            'research_jobs':len(jobs),
            'peak_concurrency':peak,
            'peak_at':peak_at,
            'earliest_start':starts[0] if starts else None,
            'latest_completion':ends[-1] if ends else None,
            'all_success':all(j['conclusion']=='success' for j in jobs),
            'jobs':[{'name':j['name'],'started_at':j['started_at'],'completed_at':j['completed_at'],'conclusion':j['conclusion'],'runner_name':j.get('runner_name')} for j in jobs]
          }
          json.dump(report,open('G32_PARALLEL50_CONCURRENCY_AUDIT.json','w'),indent=2)
          print(json.dumps({k:report[k] for k in ['research_jobs','peak_concurrency','peak_at','earliest_start','latest_completion','all_success']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G32-PARALLEL50-CONCURRENCY-AUDIT
          path: G32_PARALLEL50_CONCURRENCY_AUDIT.json
          retention-days: 7
