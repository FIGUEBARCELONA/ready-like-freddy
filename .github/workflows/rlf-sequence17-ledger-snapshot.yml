name: RLF sequence 17 no-mutation checkpoint

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence17-ledger-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rlf-sequence17-ledger-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact ledgers and certify sequence 17 no-mutation result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/execution
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { loadProgressLedger } from './scripts/execution/progress-ledger.mjs';
          import { loadSourcePageLedger } from './scripts/execution/source-page-ledger.mjs';

          const identity=await loadProgressLedger();
          const sourcePages=await loadSourcePageLedger();
          const archaeology=JSON.parse(await readFile('data/execution/sequence17-media-archaeology-manifest.json','utf8'));
          const dashboard=JSON.parse(await readFile('data/execution/workflow-runs-snapshot.json','utf8'));
          const evidence=JSON.parse(await readFile('data/execution/sequence17-media-evidence.json','utf8'));
          const expectedRetries=['HW2300|843','M1588|81B','M1588|84B'];
          const snapshot={
            schemaVersion:1,
            generatedAt:new Date().toISOString(),
            sourceCommitSha:process.env.GITHUB_SHA,
            sourceRunId:'32861233493',
            identity:{
              completedIdentityCount:identity.completed.identityCount,
              productUrlCaptureCount:identity.completed.productUrlCaptureCount,
              officialProductImageReferenceCount:identity.counters.officialProductImageReferenceCount,
              materialEvidenceCount:identity.counters.materialEvidenceCount,
              manufacturingClaimCount:identity.counters.manufacturingClaimCount,
              descriptionMissingIdentityCount:identity.metadataGaps.descriptionMissingIdentityCount,
              priceMissingIdentityCount:identity.metadataGaps.priceMissingIdentityCount,
              materialMissingIdentityCount:identity.metadataGaps.materialMissingIdentityCount,
              retryIdentityCount:identity.retry.identityCount,
              retryIdentityKeys:identity.retry.identities.map(item=>item.identityKey).sort(),
              deltaCount:identity.deltaCount,
              latestRunId:String(identity.latestRunId),
              factoryVerifiedCount:identity.counters.factoryVerifiedCount,
              globalCanonicalProductCount:identity.counters.globalCanonicalProductCount,
              ledgerSha256:identity.ledgerSha256,
            },
            sourcePages:{
              deltaCount:sourcePages.deltaCount,
              attemptedObservationCount:sourcePages.attemptedObservationCount,
              uniqueAttemptedSourcePageCount:sourcePages.uniqueAttemptedSourcePageCount,
              ledgerSha256:sourcePages.ledgerSha256,
            },
            sequence17:{
              planSha256:archaeology.planSha256,
              manifestSha256:archaeology.manifestSha256,
              status:archaeology.status,
              archaeologyPassed:archaeology.passed,
              workerCount:archaeology.workerCount,
              orchestrationStatus:archaeology.orchestrationStatus,
              corpus:archaeology.corpus,
              totals:archaeology.totals,
              identityResults:archaeology.identityResults,
              evidenceRunId:String(evidence.runId),
              evidencePlanSha256:evidence.planSha256,
              evidenceRecordCount:evidence.evidence.length,
              dashboardPassed:dashboard.passed,
              dashboardCounts:dashboard.counts,
            },
          };
          const i=snapshot.identity, s=snapshot.sourcePages, q=snapshot.sequence17, c=q.dashboardCounts;
          snapshot.passed=
            i.completedIdentityCount===1357 && i.productUrlCaptureCount===2155 &&
            i.officialProductImageReferenceCount===11708 && i.materialEvidenceCount===1748 &&
            i.manufacturingClaimCount===64 && i.descriptionMissingIdentityCount===826 &&
            i.priceMissingIdentityCount===770 && i.materialMissingIdentityCount===86 &&
            i.retryIdentityCount===3 && JSON.stringify(i.retryIdentityKeys)===JSON.stringify(expectedRetries) &&
            i.deltaCount===11 && i.latestRunId==='32784949243' &&
            i.factoryVerifiedCount===0 && i.globalCanonicalProductCount===0 &&
            i.ledgerSha256==='0476d387dbfb28ea303e9f6c1c642f22a117968537c3bff8c29678c72e60a2b7' &&
            s.deltaCount===8 && s.attemptedObservationCount===1524 && s.uniqueAttemptedSourcePageCount===1239 &&
            s.ledgerSha256==='19545d43003400957b788bb5ecd25019413dfe2c225c86c5c28e827ccfc386e3' &&
            q.planSha256==='d9e30f2ff37d662064521e3dea2812892c5bfd4301020c16eb63405f3423e3b3' &&
            q.manifestSha256==='b18f5d822114ec663beff2492117af224eb40fb99f1e1a13ae5f708302ef2230' &&
            q.status==='IMMUTABLE_OFFICIAL_CORPUS_EXHAUSTED_NO_EXACT_MEDIA' && q.archaeologyPassed===true &&
            q.workerCount===50 && q.orchestrationStatus==='FIFTY_OF_FIFTY_EXCLUSIVE_MEDIA_SHARDS_CONSOLIDATED' &&
            q.corpus.expectedFileCount===80 && q.corpus.assignedFileCount===80 && q.corpus.scannedFileCount===80 &&
            q.corpus.uniqueScannedFileCount===80 && q.corpus.overlappingAssignments.length===0 &&
            q.corpus.missingFiles.length===0 && q.corpus.unexpectedFiles.length===0 &&
            q.totals.rawEvidenceCount===95 && q.totals.deduplicatedEvidenceCount===43 &&
            q.totals.officialMediaUrlCount===0 && q.totals.officialPageUrlCount===8 &&
            q.totals.textOccurrenceEvidenceCount===35 && q.totals.identitiesWithOfficialMedia===0 &&
            q.identityResults.length===3 && q.identityResults.every(item=>item.officialMediaUrls.length===0) &&
            q.evidenceRunId==='32861233493' && q.evidencePlanSha256===q.planSha256 && q.evidenceRecordCount===43 &&
            q.dashboardPassed===true && c.totalJobs===52 && c.prepareSuccess===1 &&
            c.mediaTotal===50 && c.mediaSuccess===50 && c.mediaFailed===0 && c.mediaActive===0 &&
            c.consolidateSuccess===1 && c.mediaWorkerArtifacts===50 && c.planArtifacts===1 &&
            c.consolidatedArtifacts===1 && c.totalArtifacts===52;
          await writeFile('data/execution/sequence17-ledger-snapshot.json',`${JSON.stringify(snapshot,null,2)}\n`);
          console.log(JSON.stringify(snapshot,null,2));
          if(!snapshot.passed) throw new Error('Sequence 17 exact no-mutation checkpoint failed');
          NODE
      - name: Publish exact sequence 17 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/rlf-execution-backend-20260823'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/execution/sequence17-ledger-snapshot.json
          git commit -m 'Persist exact sequence 17 no-mutation checkpoint'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
