name: Fred Perry official full sitemap

on:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - tools/extract_fredperry_official_sitemap.py
      - .github/workflows/fred-perry-official-sitemap.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python tools/extract_fredperry_official_sitemap.py
      - run: |
          cd official-sitemap-artifact
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fred-perry-official-full-sitemap-20260826
          path: official-sitemap-artifact/
          if-no-files-found: error
          retention-days: 7
