name: RLF Parallel50 G32 real trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-parallel50-g32-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-parallel50:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel auth availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'VERCEL_TOKEN_PRESENT=false'
            exit 9
          fi
          echo 'VERCEL_TOKEN_PRESENT=true'

      - name: Trigger authenticated Vercel Parallel50 runtime
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          echo 'POST /api/sweep50 authenticated'
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -X POST 'https://rlf-parallel50-runtime.vercel.app/api/sweep50' \
            -H 'content-type: application/json' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            --data '{}')
          echo "HTTP=$code"
          cat /tmp/body.json
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 22; fi

      - name: Poll runtime status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "--- poll $i ---"
            curl -fsS 'https://rlf-parallel50-runtime.vercel.app/api/status' || true
            echo
            sleep 4
          done
