name: RLF KB W001 enrichment

on:
  push:
    branches:
      - automation/fred-perry-product-map-20260826
    paths:
      - 'tools/rlf_kb_w001_enrich.py'
      - 'data/kb/w001/RLF_KB_W001_TOP50_SEEDS.csv'
      - '.github/workflows/rlf-kb-w001-enrich.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Execute W001 Top 50 enrichment
        run: |
          python tools/rlf_kb_w001_enrich.py \
            data/kb/w001/RLF_KB_W001_TOP50_SEEDS.csv \
            RLF_KB_W001_ENRICHMENT_V1

      - name: Package auditable output
        run: |
          zip -r RLF_KB_W001_ENRICHMENT_V1.zip RLF_KB_W001_ENRICHMENT_V1
          sha256sum RLF_KB_W001_ENRICHMENT_V1.zip > RLF_KB_W001_ENRICHMENT_V1.zip.sha256

      - name: Upload W001 package
        uses: actions/upload-artifact@v4
        with:
          name: RLF_KB_W001_ENRICHMENT_V1
          path: |
            RLF_KB_W001_ENRICHMENT_V1.zip
            RLF_KB_W001_ENRICHMENT_V1.zip.sha256
          if-no-files-found: error
          retention-days: 7
