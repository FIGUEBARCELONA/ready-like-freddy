M754	schnppchen	Schn€ppchen	10.049594,53.5685261;10.0492264,53.568428	-	-	ddg
M755	secondschanze	Second Schanze	9.9644013,53.56864	-	-	bing
M756	secondella	Secondella	9.9866292,53.5525709	https://www.secondella.de/	-	ddg
M757	secondhandgestober	Secondhand Gestöber	9.9428819,53.5765147	-	-	bing
M758	stilbruch	Stilbruch	9.924694,53.5655744	-	-	ddg
M759	stoberkiste	Stöberkiste	9.9504102,53.5728843	-	-	bing
M760	telecardhamburg	Telecard Hamburg	10.0018669,53.5501866	-	-	ddg
M761	thriftthieves	Thrift Thieves	9.958975,53.5650987	-	-	bing
M762	timode	TIMODE	10.0916007,53.5486481	-	-	ddg
M763	veltins	Veltins	9.9715465,53.5582739	-	-	bing
M764	vintagerags	Vintage & Rags	10.003504,53.5530194	https://www.vintage-rags.de/	-	ddg
M765	vintagekaufhaushamburg	Vintage Kaufhaus Hamburg	9.961191,53.5588205	-	-	bing
M766	vintagerevivals	Vintage Revivals	9.9635773,53.5603242	https://www.vintagerevivals.de/de/	-	ddg
M767	zwergenaufstand	Zwergenaufstand	9.9428005,53.5765657	https://www.second-hand-zwergenaufstand.de/	Lisa Käding	bing
M768	UNNAMED_RESIDUAL	UNNAMED_OSM_POINTS	9.9597368,53.5489616;9.9600131,53.574231;10.0925971,53.568137	-	-	ddg
M769	UNINDEXED_G13	UNINDEXED_G13_DISCOVERY	9.690690951,53.395391959;10.325959,53.585253634	-	-	bing
          LANES

          pids=()
          while IFS=$'\t' read -r lane key name coords websites operators engine; do
            python3 p50/worker.py "$lane" "$key" "$name" "$coords" "$websites" "$operators" "$engine" & pids+=("$!")
          done < p50/lanes.tsv

          deadline=$((SECONDS+45))
          while true; do
            ready=$(find p50/ready -type f|wc -l)
            [ "$ready" -eq 50 ] && break
            [ "$SECONDS" -ge "$deadline" ] && { echo "barrier failed $ready/50"; exit 7; }
            sleep .05
          done
          alive=0; for p in "${pids[@]}"; do kill -0 "$p" 2>/dev/null && alive=$((alive+1)); done
          echo "BARRIER_READY=$ready"; echo "SIMULTANEOUS_ALIVE=$alive"; [ "$alive" -eq 50 ] || exit 8
          date +%s.%N > p50/GO
          fail=0; for p in "${pids[@]}"; do wait "$p" || fail=$((fail+1)); done
          echo "WORKER_PROCESS_FAILURES=$fail"; [ "$fail" -eq 0 ] || exit 9

      - name: AAA exclusivity and completeness audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMERGE'
          import glob,json,hashlib
          rows=[json.load(open(f,encoding='utf-8')) for f in sorted(glob.glob('p50/out/M*.json'))]
          report={
            'phase':'FASE_1_CENS_PROVEIDORS_UE','city_id':'DE_02000000','zone':'DE_02000000_G13','packet':'M720-M769',
            'workers':len(rows),'unique_pids':len({r['pid'] for r in rows}),'unique_lanes':len({r['lane'] for r in rows}),
            'unique_candidate_keys':len({r['candidate_key'] for r in rows}),'unique_queries':len({r['query'] for r in rows}),
            'simultaneous_alive':50,'process_failures':0,
            'http_success':sum(1 for r in rows if r['http_status'] and 200<=r['http_status']<300),
            'search_result_urls':sum(len(r['search_results']) for r in rows),
            'lanes_with_results':sum(1 for r in rows if r['search_results'] or r['direct_fetch']),
            'errors':[{'lane':r['lane'],'candidate':r['candidate_name'],'error':r['error']} for r in rows if r['error']],
            'rows':rows
          }
          core=json.dumps(report,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode();report['sha256']=hashlib.sha256(core).hexdigest()
          json.dump(report,open('RLF_HAMBURG_G13_P50_M720_M769.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps({k:report[k] for k in ['workers','unique_pids','unique_lanes','unique_candidate_keys','unique_queries','simultaneous_alive','http_success','search_result_urls','lanes_with_results']},ensure_ascii=False))
          if not (report['workers']==50 and report['unique_pids']==50 and report['unique_lanes']==50 and report['unique_candidate_keys']==50 and report['unique_queries']==50): raise SystemExit(10)
          PYMERGE

      - name: Upload Hamburg G13 M720-M769 evidence
        uses: actions/upload-artifact@v4
        with:
          name: RLF-HAMBURG-G13-P50-M720-M769
          path: |
            RLF_HAMBURG_G13_P50_M720_M769.json
            p50/out/*.json
          retention-days: 7
