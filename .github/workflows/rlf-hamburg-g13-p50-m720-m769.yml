name: RLF Hamburg G13 Parallel50 M720-M769 candidate adjudication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-hamburg-g13-p50-m720-m769.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel50:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Launch 50 exclusive candidate workers behind common barrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf p50 && mkdir -p p50/ready p50/out p50/owners
          cat > p50/worker.py <<'PYWORKER'
          import sys,os,time,json,html,re,urllib.parse,urllib.request,hashlib
          lane,key,name,coords,websites,operators,engine=sys.argv[1:8]
          open(f'p50/ready/{lane}','w').write(str(os.getpid()))
          deadline=time.time()+45
          while not os.path.exists('p50/GO'):
            if time.time()>deadline: raise SystemExit('barrier timeout')
            time.sleep(.02)
          delay=(int(hashlib.sha256(lane.encode()).hexdigest()[:4],16)%1300)/1000
          time.sleep(delay)
          if key=='UNINDEXED_G13':
            query='Hamburg second hand vintage gebraucht kleidung shop 20095 20097 20099 20144 20253 20255 20257 20354 20357 20359 20457 20535 20537 20539 21073 21075 21077 21079 21107 21109'
          elif key=='UNNAMED_RESIDUAL':
            query='Hamburg second hand shop near 53.5489616 9.9597368 OR 53.574231 9.9600131 OR 53.568137 10.0925971'
          else:
            query=f'"{name}" Hamburg ("second hand" OR secondhand OR vintage OR gebraucht OR kleidung OR mode)'
          q=urllib.parse.quote_plus(query)
          url=(f'https://html.duckduckgo.com/html/?q={q}' if engine=='ddg' else f'https://www.bing.com/search?q={q}&count=20')
          status=None;body='';error=None;links=[];started=time.time()
          try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'de-DE,de;q=0.9,en;q=0.4'})
            with urllib.request.urlopen(req,timeout=30) as r:
              status=getattr(r,'status',200);body=r.read().decode('utf-8','replace')
            hrefs=re.findall(r'href=["\']([^"\']+)["\']',body,re.I)
            seen=set()
            for href in hrefs:
              href=html.unescape(href)
              if href.startswith('//'): href='https:'+href
              if 'uddg=' in href:
                try: href=urllib.parse.parse_qs(urllib.parse.urlparse(href).query).get('uddg',[href])[0]
                except Exception: pass
              if not href.startswith('http'): continue
              host=(urllib.parse.urlparse(href).hostname or '').lower()
              if any(x in host for x in ['duckduckgo.com','bing.com','microsoft.com']): continue
              clean=href.split('#',1)[0]
              if clean in seen: continue
              seen.add(clean);links.append(clean)
              if len(links)>=15: break
          except Exception as e:
            error=type(e).__name__+': '+str(e)
          direct=[]
          if websites!='-':
            for w in websites.split(';'):
              if not w: continue
              try:
                req=urllib.request.Request(w,headers={'User-Agent':'Mozilla/5.0 Chrome/151','Accept-Language':'de-DE,de;q=0.9'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  b=r.read(180000).decode('utf-8','replace')
                  direct.append({'url':w,'status':getattr(r,'status',200),'bytes':len(b.encode('utf-8','ignore')),
                                  'text':html.unescape(re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',b)))[:5000]})
              except Exception as e:
                direct.append({'url':w,'error':type(e).__name__+': '+str(e)})
          json.dump({
            'phase':'FASE_1_CENS_PROVEIDORS_UE','city_id':'DE_02000000','zone':'DE_02000000_G13','packet':'M720-M769',
            'lane':lane,'candidate_key':key,'candidate_name':name,'coordinates':coords,'seed_websites':websites,'seed_operators':operators,
            'engine':engine,'pid':os.getpid(),'query':query,'http_status':status,'body_bytes':len(body.encode('utf-8','ignore')),
            'error':error,'search_results':links,'direct_fetch':direct,'started':started,'ended':time.time()
          },open(f'p50/out/{lane}.json','w'),ensure_ascii=False,indent=2)
          PYWORKER

          cat > p50/lanes.tsv <<'LANES'
M720	2ndfitkiloshop	2nd Fit Kiloshop	9.9632939,53.5601656	-	-	ddg
M721	2ndsecondhand	2nd Second Hand	10.0105557,53.5828715	-	-	bing
M722	ankaufverkauf	Ankauf-Verkauf	9.9839546,53.46186	-	-	ddg
M723	augenaufghana	Augen auf Ghana	9.8807681,53.5324231	https://www.augenaufghana.de/	AUGEN AUF GHANA e.V.	bing
