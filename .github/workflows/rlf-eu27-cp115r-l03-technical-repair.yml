name: RLF EU27 CP115R L03 selective technical repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rlf-eu27-cp115r-l03-technical-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repair-l03:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recover CP114 L03 authoritative next-zone geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pred
          gh run download 33711366662 -R "$GITHUB_REPOSITORY" -n RLF-EU27-CP114-LANE-L03 -D pred
          test -f pred/L03.json
      - name: Retry only uncredited L03 G12 exhaustion from 0/15
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q shapely
          python3 - <<'PY'
          import json,time,urllib.parse,urllib.request,hashlib
          from shapely.geometry import shape,Point
          p=json.load(open('pred/L03.json',encoding='utf-8'))
          assert p['next_zone_id']=='BG_SOF46_G12' and (p.get('candidate_count') or 0)==0
          zone=shape(p['zone_geometry']);minx,miny,maxx,maxy=zone.bounds;b=f'{miny},{minx},{maxy},{maxx}'
          qs=[
            ('Q01',f'[out:json][timeout:75];nwr[shop=second_hand]({b});out center tags;'),
            ('Q02',f'[out:json][timeout:75];nwr[shop=clothes][second_hand=yes]({b});out center tags;'),
            ('Q03',f'[out:json][timeout:75];nwr[shop=clothes][second_hand=only]({b});out center tags;'),
            ('Q04',f'[out:json][timeout:75];nwr[shop=clothes][second_hand]({b});out center tags;'),
            ('Q05',f'[out:json][timeout:75];nwr[shop=vintage]({b});out center tags;'),
            ('Q06',f'[out:json][timeout:75];nwr[second_hand=yes][shop]({b});out center tags;'),
            ('Q07',f'[out:json][timeout:75];nwr[second_hand=only][shop]({b});out center tags;'),
            ('Q08',f'[out:json][timeout:75];nwr[shop=charity]({b});out center tags;'),
            ('Q09',f'[out:json][timeout:75];nwr[name~"second.?hand",i]({b});out center tags;'),
            ('Q10',f'[out:json][timeout:75];nwr[name~"vintage",i]({b});out center tags;'),
            ('Q11',f'[out:json][timeout:75];nwr[name~"thrift",i]({b});out center tags;'),
            ('Q12',f'[out:json][timeout:75];nwr[name~"pre.?loved",i]({b});out center tags;'),
            ('Q13',f'[out:json][timeout:75];nwr[name~"used clothing|gebraucht|friperie|kringwinkel",i]({b});out center tags;'),
            ('Q14',f'[out:json][timeout:75];nwr[name~"seconda mano|segunda mano|second hand",i]({b});out center tags;'),
            ('Q15',f'[out:json][timeout:75];nwr[shop=clothes][second_hand!=no]({b});out center tags;')]
          eps=['https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter']
          known=set();streak=0;new={};records=[];technical=False
          for qi,(qid,q) in enumerate(qs):
              data=None;last=None;used=None;status=None
              for attempt in range(5):
                  ep=eps[(qi+attempt)%len(eps)]
                  try:
                      # GET is used first here to avoid the 406 seen on CP115 POST path.
                      url=ep+'?'+urllib.parse.urlencode({'data':q})
                      req=urllib.request.Request(url,headers={'User-Agent':'RLF-EU27-CP115R/1.0','Accept':'application/json,text/plain,*/*'})
                      with urllib.request.urlopen(req,timeout=95) as r: body=r.read();status=getattr(r,'status',200);used=ep
                      data=json.loads(body);break
                  except Exception as e:last=type(e).__name__+': '+str(e);time.sleep(1.3*(attempt+1))
              if data is None:
                  technical=True;records.append({'qid':qid,'status':'TECHNICAL_FAILURE_NO_CREDIT','endpoint':used,'http_status':status,'error':last,'streak_after':streak});break
              found=[]
              for el in data.get('elements',[]):
                  lat=el.get('lat');lon=el.get('lon');cen=el.get('center') or {}
                  if lat is None:lat=cen.get('lat')
                  if lon is None:lon=cen.get('lon')
                  if lat is None or lon is None or not zone.covers(Point(float(lon),float(lat))):continue
                  key=f"{el.get('type')}:{el.get('id')}"
                  if key not in known:
                      t=el.get('tags') or {};new[key]={'osm_key':key,'name':t.get('name'),'website':t.get('website') or t.get('contact:website'),'lat':float(lat),'lon':float(lon),'first_query':qid};found.append(key)
              if found:
                  streak=0;records.append({'qid':qid,'status':'SUCCESS_NEW_IDENTITY_RESET','endpoint':used,'http_status':status,'new':len(set(found)),'streak_after':0});break
              streak+=1;records.append({'qid':qid,'status':'SUCCESS_ZERO_NEW','endpoint':used,'http_status':status,'new':0,'streak_after':streak});time.sleep(.2)
          out={'schema':'RLF_EU27_CP115R_L03_V1','lane_id':'L03','iso':'BG','city_id':'BG_SOF46','zone_id':'BG_SOF46_G12','repair_reason':'CP115_Q01_HTTP_406_ZERO_CREDIT','queries':records,'new_identities':list(new.values()),'new_identity_count':len(new),'technical_failure':technical,'exhaustion_streak':f'{streak}/15','zone_closed':(not technical and not new and streak==15),'canonical_delta':0,'promotion_allowed':False}
          out['sha256']=hashlib.sha256(json.dumps(out,sort_keys=True,separators=(',',':')).encode()).hexdigest();open('RLF_EU27_CP115R_L03.json','w').write(json.dumps(out,indent=2,ensure_ascii=False));print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLF-EU27-CP115R-L03
          path: RLF_EU27_CP115R_L03.json
          retention-days: 30
