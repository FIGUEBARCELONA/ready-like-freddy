name: RLF sequence run probe

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence-probe.yml'

permissions:
  contents: write

concurrency:
  group: rlf-active-probe-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Connect priority entry points exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rlf-50-worker-kb.yml')
          text = path.read_text()
          needle = '          node scripts/execution/prepare-official-queue.mjs --out=execution/queue\n'
          replacement = '''          node scripts/execution/prepare-official-queue.mjs --out=execution/queue
          node scripts/execution/prioritize-official-entrypoints.mjs \\
            --queue=execution/queue/queue.json \\
            --seeds=data/execution/rlf-kb-official-seeds.json \\
            --summary=execution/queue/summary.json \\
            --urls=execution/queue/urls.txt
'''
          count = text.count(needle)
          existing = text.count('prioritize-official-entrypoints.mjs')
          if existing == 1:
              print('Prioritizer already connected; retaining exact existing connection')
          elif existing == 0 and count == 1:
              path.write_text(text.replace(needle, replacement, 1))
          else:
              raise SystemExit(f'Unsafe patch state: prepare_count={count}, prioritizer_count={existing}')
          PY
          test "$(grep -c 'prioritize-official-entrypoints.mjs' .github/workflows/rlf-50-worker-kb.yml)" = 1
          node --check scripts/execution/prioritize-official-entrypoints.mjs
          grep -A6 -B2 'prioritize-official-entrypoints.mjs' .github/workflows/rlf-50-worker-kb.yml
      - name: Commit connection when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/rlf-50-worker-kb.yml; then
            echo 'No workflow change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rlf-50-worker-kb.yml
          git commit -m 'Connect verified archive entry points to 50-lane prepare stage'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
