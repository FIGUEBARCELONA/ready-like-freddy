name: RLF sequence run probe

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence-probe.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: rlf-sequence-run-probe
  cancel-in-progress: false

env:
  TARGET_RUN_ID: '32754804084'
  OUTPUT_PATH: 'data/execution/sequence10-page2-jobs.json'
  SNAPSHOT_REVISION: '4'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Capture second jobs page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100&page=2" > /tmp/jobs.json
          jq -n --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg revision "$SNAPSHOT_REVISION" --slurpfile jobs /tmp/jobs.json '{schemaVersion: 1, capturedAt: $capturedAt, revision: $revision, totalCount: $jobs[0].total_count, page2Count: ($jobs[0].jobs | length), jobs: [$jobs[0].jobs[] | {id, name, status, conclusion, started_at, completed_at, html_url}]}' > "$OUTPUT_PATH"
      - name: Publish second page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          git commit -m 'Capture sequence 10 second jobs page'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
