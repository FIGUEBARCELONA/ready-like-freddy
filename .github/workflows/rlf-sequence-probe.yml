name: RLF sequence run probe

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence-probe.yml'

permissions:
  actions: read
  checks: read
  contents: write

env:
  TARGET_SHA: '3c109356593fc73bb1e82bdc7a98ec347c6ce7af'
  TARGET_WORKFLOW: 'RLF connect entry-point prioritizer'
  OUTPUT_PATH: 'data/execution/entrypoint-connector-run-probe.json'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Resolve target workflow run and checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=50" \
            > /tmp/runs.json
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
            > /tmp/checks.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg targetSha "$TARGET_SHA" \
            --arg targetWorkflow "$TARGET_WORKFLOW" \
            --slurpfile runs /tmp/runs.json \
            --slurpfile checks /tmp/checks.json \
            '{
              schemaVersion: 1,
              capturedAt: $capturedAt,
              targetSha: $targetSha,
              targetWorkflow: $targetWorkflow,
              matchingRuns: [
                $runs[0].workflow_runs[]
                | select(.name == $targetWorkflow)
                | {id, run_number, run_attempt, event, status, conclusion, head_sha, created_at, updated_at, html_url, jobs_url, artifacts_url}
              ],
              checkRuns: [
                $checks[0].check_runs[]
                | {id, name, status, conclusion, started_at, completed_at, details_url, external_id}
              ]
            }' > "$OUTPUT_PATH"
      - name: Publish probe result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          git commit -m 'Resolve entry-point connector workflow run'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
