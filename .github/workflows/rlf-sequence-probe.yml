name: RLF sequence run probe

on:
  push:
    branches:
      - feature/rlf-execution-backend-20260823
    paths:
      - '.github/workflows/rlf-sequence-probe.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: rlf-sequence-run-probe
  cancel-in-progress: false

env:
  TARGET_RUN_ID: '32754804084'
  OUTPUT_PATH: 'data/execution/sequence10-live-snapshot.json'
  SNAPSHOT_REVISION: '1'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rlf-execution-backend-20260823
      - name: Capture complete run snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > /tmp/run.json
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/artifacts?per_page=100" > /tmp/artifacts.json
          jq -n --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg revision "$SNAPSHOT_REVISION" --slurpfile run /tmp/run.json --slurpfile jobs /tmp/jobs.json --slurpfile artifacts /tmp/artifacts.json '{schemaVersion: 2, capturedAt: $capturedAt, revision: $revision, run: ($run[0] | {id, name, run_number, run_attempt, event, status, conclusion, head_sha, created_at, updated_at, html_url}), jobCount: $jobs[0].total_count, jobs: [$jobs[0].jobs[] | {id, name, status, conclusion, started_at, completed_at, html_url}], artifactCount: $artifacts[0].total_count, artifacts: [$artifacts[0].artifacts[] | {id, name, size_in_bytes, digest, expired, created_at}]}' > "$OUTPUT_PATH"
      - name: Publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          git commit -m 'Snapshot sequence 10 run revision 1'
          git fetch origin feature/rlf-execution-backend-20260823
          git rebase origin/feature/rlf-execution-backend-20260823
          git push origin HEAD:feature/rlf-execution-backend-20260823
