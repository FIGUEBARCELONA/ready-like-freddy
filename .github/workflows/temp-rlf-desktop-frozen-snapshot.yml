name: RLF desktop frozen snapshot package only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rlf-desktop-frozen-snapshot.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable frozen census state
        uses: actions/checkout@v4
        with:
          ref: ff10221c8e6232a137d4826b3a7349e7ba09e8c6
          path: frozen
      - name: Record immutable provenance
        shell: bash
        run: |
          printf '%s\n' 'ff10221c8e6232a137d4826b3a7349e7ba09e8c6' > frozen/FROZEN_TREE_SHA.txt
          printf '%s\n' '449 verified = 74 eligible + 375 hold; remaining 9551; Phase 2 locked' > frozen/RLF_FREEZE_COUNTS.txt
      - name: Upload exact frozen repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: RLF-DESKTOP-FROZEN-REPO-FF10221
          path: frozen/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
