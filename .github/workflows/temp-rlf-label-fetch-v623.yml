name: TEMP RLF label fetch v6.23

on:
  pull_request:
    branches:
      - rlf-parallel50-v25-53

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download fixed label evidence best effort
        shell: bash
        run: |
          set -u
          mkdir -p evidence/original evidence/reports
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          fetch() {
            key="$1"; url="$2"; referer="$3"
            out="evidence/original/${key}"
            set +e
            meta=$(curl --location --retry 2 --retry-all-errors \
              --connect-timeout 20 --max-time 180 --user-agent "$UA" \
              --referer "$referer" \
              --header 'Accept: image/avif,image/webp,image/apng,image/*,*/*;q=0.8' \
              "$url" --output "$out" \
              --write-out '%{http_code}|%{url_effective}|%{content_type}|%{size_download}')
            rc=$?
            set -e
            mime=$(file -b --mime-type "$out" 2>/dev/null || true)
            size=$(stat -c%s "$out" 2>/dev/null || echo 0)
            printf '%s|curl_rc=%s|mime=%s|bytes=%s\n' "$meta" "$rc" "$mime" "$size" > "evidence/reports/${key}.meta"
            if [ "$rc" -ne 0 ] || [ "$size" -lt 1024 ]; then rm -f "$out"; return 0; fi
            case "$mime" in image/*) ;; *) rm -f "$out" ;; esac
          }
          set -e
          fetch 'RLF-EXT-020_J1518_Vietnam.jpg' 'https://images.weserv.nl/?url=images.vestiairecollective.com/images/resized/w%3D1246%2Cq%3D75%2Cf%3Dauto%2C/produit/burgundy-cotton-fred-perry-jacket-29492494-7_1.jpg' 'https://us.vestiairecollective.com/'
          fetch 'RLF-EXT-021_J6319_Portugal.jpg' 'https://images.weserv.nl/?url=img.gem.app/449928663/5f/1695627431/fred-perry-fred-ferry-vintage-made-in-portugal.jpg' 'https://gem.app/'
          fetch 'RLF-EXT-022_J6327_Portugal.jpg' 'https://images.weserv.nl/?url=img.gem.app/317472623/7f/1658213994/fred-perry-fred-perry-laurel-wreath-track-jacket.jpg' 'https://gem.app/'
          fetch 'RLF-EXT-025_J6231_Portugal.jpg' 'https://i.ebayimg.com/images/g/H1oAAOSwcBFmVF5V/s-l1200.jpg' 'https://www.ebay.co.uk/itm/256525038785'
          fetch 'RLF-EXT-026_M12_1576_England.jpg' 'https://images.weserv.nl/?url=images.vestiairecollective.com/images/resized/w%3D1246%2Cq%3D75%2Cf%3Dauto%2C/produit/black-cotton-fred-perry-polo-shirt-43131917-3_2.jpg' 'https://us.vestiairecollective.com/'
          fetch 'RLF-EXT-027_M12_C92_England.jpg' 'https://pictr.com/images/2019/06/01/5Pl0aY.md.jpg' 'https://forum.lowyat.net/topic/2742387/all'
          fetch 'RLF-EXT-028_91CM_England.jpg' 'https://i.ebayimg.com/images/g/IDsAAOSwTYBi4POf/s-l1200.jpg' 'https://www.ebay.com/itm/226944092124'
          find evidence/original -type f -exec file {} \; > evidence/reports/MIME.txt || true
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/reports/SHA256SUMS.txt
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('evidence')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='manifest.json':
                  data=p.read_bytes()
                  rows.append({'path':p.as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'reports'/'manifest.json').write_text(json.dumps({'schema':'rlf-v623-fetch-v3','files':rows},indent=2),encoding='utf-8')
          PY
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: rlf-label-evidence-v623
          path: evidence
          if-no-files-found: error
          retention-days: 7
